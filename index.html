<style>
:root{
  --bg:#FBFBFA;--card:#FFF;--soft:#F2F2F0;--line:#E5E5E1;--line2:#C9C9C3;
  --ink:#131315;--ink2:#55555A;--ink3:#6A6A72;   /* 4.78:1 on --soft; #72727A was 4.25 */
  --acc:#96600F;--acc-s:#F7EEDF;--up:#0E6B4C;--up-s:#E2F0EA;--dn:#AE2E2C;--dn-s:#F9E7E6;
  --sh:0 0 0 .5px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 0 0 .5px rgba(0,0,0,.06),0 10px 30px -8px rgba(0,0,0,.16);
  --hdr:67px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D;--card:#151517;--soft:#1E1E21;--line:#26262A;--line2:#3A3A40;
  --ink:#F5F5F4;--ink2:#ABABB2;--ink3:#8A8A92;
  --acc:#E9A93F;--acc-s:#2A2011;--up:#37C08A;--up-s:#0F2620;--dn:#F0665F;--dn-s:#2B1614;
  --sh:0 0 0 .5px rgba(255,255,255,.06);--sh2:0 0 0 .5px rgba(255,255,255,.08),0 12px 34px -8px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --bg:#0B0B0D;--card:#151517;--soft:#1E1E21;--line:#26262A;--line2:#3A3A40;
  --ink:#F5F5F4;--ink2:#ABABB2;--ink3:#8A8A92;
  --acc:#E9A93F;--acc-s:#2A2011;--up:#37C08A;--up-s:#0F2620;--dn:#F0665F;--dn-s:#2B1614;
  --sh:0 0 0 .5px rgba(255,255,255,.06);--sh2:0 0 0 .5px rgba(255,255,255,.08),0 12px 34px -8px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,system-ui,sans-serif;
  font-size:15px;line-height:1.5;font-weight:500;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
h1{font-size:32px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.12}
h2{font-size:20px;font-weight:700;letter-spacing:-.028em;margin:0}
h3{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;text-align:left}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.up{color:var(--up)}.dn{color:var(--dn)}
.hint{font-size:12.5px;color:var(--ink2);font-weight:500;line-height:1.5}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:block}
.pop{animation:pop .4s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;
  animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.wrap{max-width:1040px;margin:0 auto;padding:0 var(--s5) 110px}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 97%,transparent);
  backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.topin{max-width:1040px;margin:0 auto;padding:11px var(--s5);display:flex;align-items:center;gap:var(--s3)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.03em}
.lvl{margin-left:auto;display:flex;align-items:center;gap:var(--s2);font-size:13px;font-weight:600;color:var(--ink2)}
.lvl .dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.iconb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.iconb:hover{background:var(--soft);color:var(--ink)}
.iconb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg) 97%,transparent);
  backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
.tabsin{max-width:400px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:0 var(--s3)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;min-height:48px;
  color:var(--ink2);font-size:11px;font-weight:600;justify-content:center}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:var(--s5)}
.mkt{font-size:15px;color:var(--ink2);font-weight:500;margin-top:10px;line-height:1.6;max-width:60ch}
.mkt b{color:var(--ink);font-weight:700}
.intro{font-size:13.5px;color:var(--ink2);font-weight:500;line-height:1.55;margin:var(--s3) var(--s1) 0;max-width:64ch}
.sechead{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s6) 0 var(--s3)}
.sechead .c{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3);margin-top:var(--s3);align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:var(--s3);align-items:start}
.stack{display:flex;flex-direction:column;gap:10px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.divide{height:.5px;background:var(--line);margin:var(--s4) 0}
.foot{font-size:12.5px;color:var(--ink2);font-weight:500;line-height:1.6;margin-top:var(--s6);max-width:70ch}

/* rows */
.row{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s4);border-radius:12px}
.row:hover{background:color-mix(in srgb,var(--acc-s) 55%,transparent)}
.row+.row{box-shadow:inset 0 .5px 0 var(--line)}
.rk{width:20px;font-size:13px;font-weight:600;color:var(--ink2);flex:none;font-variant-numeric:tabular-nums}
.rowmain{flex:1;min-width:0;display:block;padding:6px 0;border-radius:8px}
.sy{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowsub{display:flex;align-items:center;gap:var(--s2);margin-top:3px;min-width:0}
.nm{font-size:12.5px;color:var(--ink2);font-weight:600;flex:none}
/* a lozenge stretched to fill the row reads as a meter at 30%; it is a label */
.rowsub .pill{flex:0 1 auto;min-width:0}
.px{text-align:right;flex:none;width:84px;display:flex;flex-direction:column}
.px .num:first-child{font-weight:650}
.px .num:last-child{font-size:13px;font-weight:600}
.spk{flex:none}
.star{width:44px;height:44px;flex:none;border-radius:50%;color:var(--ink3);font-size:17px;line-height:1;
  display:grid;place-items:center;transition:color .16s,transform .16s}
.star:hover{color:var(--acc);transform:scale(1.12)}
.star.on{color:var(--acc)}
.pill{display:inline-block;text-align:left;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:99px;
  background:var(--soft);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill.g{background:var(--up-s);color:var(--up)}.pill.r{background:var(--dn-s);color:var(--dn)}
.pill.n{background:var(--soft);color:var(--ink2)}

/* controls */
.ctrls{display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg.full{width:100%;margin-bottom:10px}
.seg button{padding:9px 14px;min-height:38px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2);flex:1;text-align:center;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.lnk{padding:9px 14px;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--soft)}
.lnk:hover{color:var(--ink)}
.lnk.act{color:var(--acc)}

/* ============ learning surface ============ */
.hero.tight{padding:22px 0 2px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink2);
  font:inherit;font-size:13px;font-weight:600;padding:10px 0;cursor:pointer;min-height:44px}
.back:hover{color:var(--ink)}
.back .ic{transform:rotate(180deg)}
.lcta{display:flex;gap:var(--s3);flex-wrap:wrap;margin:var(--s5) 0 var(--s2)}
.btn.big{padding:15px 26px;font-size:15px;border-radius:14px}
.note{margin-top:var(--s6);background:var(--soft);box-shadow:none}

/* progress ring */
.ring{transform:rotate(-90deg);display:block}
.ring .rbg{fill:none;stroke:var(--line);stroke-width:3}
.ring .rfg{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.16,1,.3,1)}

/* the path */
.path{display:flex;flex-direction:column;gap:var(--s2)}
.unitc{display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;
  background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--sh);
  padding:var(--s4);cursor:pointer;font:inherit;color:var(--ink);
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .16s}
.unitc:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.unitc:active{transform:translateY(0)}
.unitc.locked{background:transparent;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.unitc.locked .ubody b{color:var(--ink2)}
.unitc.locked .hint,.unitc.locked .uprog{color:var(--ink3)}
.unitc.locked .unum,.unitc.locked>.ic{color:var(--line2)}
.unitc.locked .rbg{stroke:var(--line)}
.unitc.locked:hover{transform:none;box-shadow:none}
.unitc.done .rfg{stroke:var(--up)}
.uring{position:relative;flex:none;width:38px;height:38px;display:grid;place-items:center}
.unum{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;
  color:var(--ink2);font-variant-numeric:tabular-nums}
.unitc.done .unum{color:var(--up)}
.ubody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ubody b{font-size:15px;letter-spacing:-.01em}
.uprog{font-size:12px;color:var(--ink3);font-weight:500;margin-top:2px}
.unitc>.ic{flex:none;color:var(--ink3)}

/* lesson list */
.llist{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:var(--s3);padding:11px 2px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.ldot{flex:none;width:9px;height:9px;border-radius:99px;background:var(--line2)}
.lrow.s-learning .ldot{background:var(--acc)}
.lrow.s-due .ldot{background:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.lrow.s-solid .ldot{background:var(--up)}
.lrow.s-again .ldot{background:var(--dn)}
.lt{flex:1;min-width:0;font-size:14px;font-weight:500}
.lp{flex:none;font-size:11.5px}

/* session */
.sess{padding-top:var(--s3);min-height:60vh}
.sbar{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5)}
.sx{background:none;border:0;color:var(--ink3);cursor:pointer;padding:8px;margin:-8px;
  min-width:44px;min-height:44px;display:grid;place-items:center}
.sx:hover{color:var(--ink)}
.pips{flex:1;display:flex;gap:4px}
.pips i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s}
.pips i.on{background:var(--ink2)}
.pips i.now{background:var(--acc)}
.scount{flex:none;font-variant-numeric:tabular-nums}
.scard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:var(--s5) var(--s4);max-width:620px;margin:0 auto}
.sess{padding-top:var(--s5)}
.sbar,.sexp{max-width:620px;margin-left:auto;margin-right:auto}
.stag{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.stag .kicker{display:inline}
.qq{font-size:17px;line-height:1.45;font-weight:500;letter-spacing:-.01em;margin:0 0 var(--s4)}
.qopts{display:flex;flex-direction:column;gap:var(--s2)}
.qopts.row2{flex-direction:row;flex-wrap:wrap}
.qopts.row2 .qo{flex:1;min-width:120px;text-align:center}
.qo{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:13px var(--s4);min-height:48px;font:inherit;font-size:14.5px;font-weight:500;color:var(--ink);
  cursor:pointer;transition:border-color .14s,background .14s,transform .12s}
.qo:hover:not(:disabled){border-color:var(--line2);transform:translateX(2px)}
.qo:disabled{cursor:default}
.qo.right{border-color:var(--up);background:var(--up-s);color:var(--up)}
.qo.wrong{border-color:var(--dn);background:var(--dn-s);color:var(--dn)}
.numrow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.numrow input{flex:1;min-width:130px;padding:13px var(--s4);min-height:48px;font:inherit;font-size:16px;
  font-weight:600;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  font-variant-numeric:tabular-nums}
.numrow input:focus{outline:none;border-color:var(--acc)}
.numrow input.right{border-color:var(--up);color:var(--up)}
.numrow input.wrong{border-color:var(--dn);color:var(--dn)}
.nunit{font-size:14px;color:var(--ink2);font-weight:600;margin-left:-4px}

/* pairs */
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.pcol{display:flex;flex-direction:column;gap:var(--s2)}
.pitem{text-align:left;background:var(--soft);border:1.5px solid transparent;border-radius:11px;
  padding:11px 13px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;
  line-height:1.35;transition:border-color .14s,background .14s,opacity .3s}
.pitem:hover:not(:disabled){border-color:var(--line2)}
.pitem.sel{border-color:var(--acc);background:var(--acc-s)}
.pitem.ok{border-color:var(--up);background:var(--up-s);color:var(--up);opacity:.65}

/* classify */

.seclist{display:flex;flex-direction:column;gap:4px;margin-top:var(--s4)}
.secrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:12px var(--s4);
  border-radius:12px;background:var(--card);box-shadow:var(--sh);cursor:pointer;text-align:left;
  transition:transform .14s cubic-bezier(.16,1,.3,1)}
.secrow:hover{transform:translateX(2px)}
.secrow.on{background:var(--acc-s);box-shadow:inset 0 0 0 1.5px var(--acc)}
.sname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sname b{font-size:14.5px;letter-spacing:-.01em}
.sbars{position:relative;flex:none;width:150px;height:14px}
.sbars i{position:absolute;top:4px;height:6px;border-radius:2px;min-width:2px}
.sbars i.pos{background:var(--up)}
.sbars i.neg{background:var(--dn)}
.sbars .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.sret{flex:none;width:64px;text-align:right;font-weight:700;font-size:14px}
#secc{height:260px}
@media (max-width:520px){.sbars{width:74px}.sret{width:56px;font-size:13px}}
.guided{background:var(--acc-s);box-shadow:none;margin-top:var(--s4)}
.guided .kicker{color:var(--acc)}
.guided .lead2{margin-bottom:0}
.empty .btn{margin:0 6px 0 0}
/* the row labels have to stay put while the columns scroll */
.scrollx{position:relative}
.scrollx table td:first-child,.scrollx table th:first-child{position:sticky;left:0;z-index:2;
  background:var(--card);box-shadow:1px 0 0 var(--line)}
.scrollx::after{content:"";position:absolute;top:0;bottom:0;right:0;width:28px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--card))}
.sret small{font-size:10px;vertical-align:2px;color:var(--ink3)}
.lrow{width:100%;text-align:left;cursor:pointer;border-radius:10px;padding-left:8px;padding-right:6px}
.lrow:hover{background:var(--soft)}
.lrow .ic{flex:none;color:var(--line2)}
.lrow:hover .ic{color:var(--ink3)}
/* the onboarding card needs to read as a card in the dark */
#onb{background:color-mix(in srgb,var(--bg) 82%,transparent)}
.obox{box-shadow:var(--sh2),0 0 0 1px var(--line)}
.malab{margin-top:2px}
.k.acc{background:var(--acc)}.k.ink3{background:var(--ink3)}.k.ink2{background:var(--ink2)}
.k.nep{background:repeating-linear-gradient(90deg,var(--ink3) 0 5px,transparent 5px 9px)}
.sechead .lnk.sm+.c{margin-left:var(--s3)}
.lnk.big{padding:15px 22px;min-height:50px;font-size:15px}
/* toasts must never sit on the thing they describe */
body.focus #toast{bottom:calc(16px + env(safe-area-inset-bottom))}

.ctrls.sticky{flex-wrap:wrap;row-gap:8px}
.ctrls.sticky #refb,.ctrls.sticky #dials{flex:1 1 auto}
@media (max-width:520px){
  .ctrls.sticky{gap:6px}
  .ctrls.sticky #refb,.ctrls.sticky #dials{flex:1 1 46%}
  .ctrls.sticky select,.ctrls.sticky input[type=search]{flex:1 1 46%}
}
.riskgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s3);margin-top:var(--s3)}
/* keyed to the container, not the viewport: the same grid appears in a 760px
   card and in a 323px column of the three-up, and four 60px columns is not a
   layout, it is four numbers at four different heights */
.riskgrid{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.riskgrid>div{display:flex;flex-direction:column;gap:1px}
.riskgrid b{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:1px 0}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:10px 2px;
  border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--soft)}
.mname{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.mname b{font-size:14px;letter-spacing:-.01em}
.mbar{flex:none;width:76px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mbar i.neg{background:var(--dn)}
.mval{flex:none;width:48px;text-align:right;font-weight:700;font-size:13.5px}
.frow2.note2{grid-template-columns:1fr}
.frow2.note2 .fk{font-size:14.5px;margin-bottom:3px}
.frow2.note2 .fn{max-width:72ch}

/* ============ choosing a route ============ */
.rpick{display:flex;flex-direction:column;gap:var(--s3);margin-top:var(--s5)}
.rcard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:var(--s5);
  border-radius:var(--r);background:var(--card);box-shadow:var(--sh);cursor:pointer;
  border:1.5px solid transparent;transition:transform .16s cubic-bezier(.16,1,.3,1),border-color .16s}
.rcard:hover{transform:translateY(-1px);border-color:var(--acc)}
.rtop{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.rtop b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.rtop .hint,.rtop .pill{margin-left:auto}
.rd{font-size:14.5px;line-height:1.55;color:var(--ink2);font-weight:500;max-width:56ch}
.rlist{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:4px;line-height:1.5}
.rcard .bar{margin-top:10px}
.picknote+.picknote{margin-top:var(--s5)}

/* a screen that is still measuring says so, rather than showing a count that
   is about to change underneath the reader */
.empty.pending{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.empty.pending p{max-width:46ch}
.spin{width:22px;height:22px;border-radius:50%;margin-bottom:4px;
  border:2px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@keyframes spin{to{transform:rotate(360deg)}}
/* what the guided setup changed on your behalf */
.gdrop{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.gdrop .ic{vertical-align:-2px;margin-right:4px;color:var(--ink3)}
.gdrop .lnk{display:block;margin:10px 0 0}
.gdrop i{font-style:normal;font-weight:650;color:var(--ink)}
.empty.pending i{font-style:normal;font-weight:650;color:var(--ink)}
.rswitch{float:right;margin:0 0 4px 12px;padding:5px 11px;min-height:30px;font-size:12px}
/* on a wide screen the two courses are a choice, so they sit side by side
   and stretch to the same height rather than stacking like a list */
@media (min-width:760px){
  .rpick{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;max-width:760px}
  .rcard{height:100%}
  .rcard .rlist{margin-top:auto;padding-top:10px}
  .picknote{max-width:760px}}

/* ---- what the business earns ---- */
/* Sits between the chart and the screen's verdict, which is the order the
   question comes in: what does the company do, then what is its price doing.
   The four numbers reuse .riskgrid rather than inventing a fifth way to print
   a figure, and the sector rows reuse .srank for the same reason. */
.biz{margin-top:var(--s3);margin-bottom:var(--s3)}
.fdet{margin-bottom:var(--s3)}
.biz .lead2{margin:10px 0 var(--s4)}
.biz .lead2 b{color:var(--ink);font-weight:700}
.biz .riskgrid{margin-top:0}
/* the lender row continues the grid above it rather than re-centring in it:
   two cells auto-fitted across 760px are two numbers with a hole between */
.bankrow{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line)}
@media (min-width:640px){.biz .riskgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prov{display:flex;align-items:center;gap:5px;margin-top:var(--s4);padding-top:var(--s3);
  border-top:1px solid var(--line);color:var(--ink3);font-size:12px}
.prov.src{color:var(--acc)}
.prov.warn{color:var(--dn)}
.prov .ic{flex:none}
.cardnote{margin-top:var(--s4);max-width:64ch}

/* one row, four columns, aligned — not a label and a value pushed to opposite
   edges of a 760px card with nothing in between */
.fdet .srank{display:grid;grid-template-columns:minmax(0,1fr) auto 74px minmax(96px,150px);
  gap:var(--s3);align-items:center}
.fdet .srank.warn .sn2{color:var(--dn)}
.srank:has(+ .divide){border-bottom:0}
.sn2{text-align:right;font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.srk{font-size:12.5px;color:var(--ink2);font-weight:500;text-align:right}
.kicker.sub{color:var(--ink3);font-weight:650;letter-spacing:.04em;margin-top:0}
.fnums{margin-top:var(--s3)}
.frow{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.frow:last-child{border-bottom:0}
.frow b{color:var(--ink);font-weight:700}
.histover{margin-top:6px}
.px .tagv{color:var(--ink2);font-weight:600;font-size:12.5px}
.fgroup{margin-bottom:var(--s5)}
.fglab{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2)}
.fgsub{margin:0 0 var(--s3);max-width:60ch}
.c.sm{min-width:18px;height:18px;font-size:11px;line-height:18px}
h3.kicker{margin:0;font-size:11.5px;line-height:1.5}
@media (max-width:560px){
  .fdet .srank{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .fdet .srank .rankbar{grid-column:1;width:100%}
  .fdet .srank .srk{grid-column:2}
}
/* rows below the fold cost nothing to lay out until they are scrolled to */
.list .row{content-visibility:auto;contain-intrinsic-size:0 66px}
</style>
</head>

/* ============ the business behind the price ============

   Two rules run through this file. First, no number stands alone: an earnings
   multiple of 19 means nothing until you know that thirteen of the nineteen
   commercial banks are cheaper. Second, every figure says where it came from.

   aggregators agree". For the rest it is not, and the difference is printed
   rather than smoothed over.

   in core.js, because two of the nine scoring dials are built from them and
   the dials are ranked at load. */
/* Rupees at this scale are read in crore and arba here, not in the app's
   general Cr/L shorthand: a bank's balance sheet in crore runs to five digits
   and stops being a number you can hold in your head. */
/* Above about eighty times earnings the profit is a rounding error against the
   price and the multiple stops carrying information — printing 2,765.0 implies
   a precision that four digits of a company earning Rs 0.18 a share cannot
   support. The rank still works, so the rank is what is shown. */
const PE_CAP=80;
const peText=v=>v==null?'—':v>PE_CAP?'over '+PE_CAP+'×':fmt(v,1)+'×';
const bigRs=v=>v==null?'—':(v<0?'-':'')+(Math.abs(v)>=1e9?'Rs '+fmt(Math.abs(v)/1e9,2)+' arba'
  :Math.abs(v)>=1e7?'Rs '+fmt(Math.abs(v)/1e7,1)+' crore'
  :Math.abs(v)>=1e5?'Rs '+fmt(Math.abs(v)/1e5,1)+' lakh':'Rs '+fmt(Math.abs(v),0));

/* ---- rank inside the sector ----
   Sector is the strongest thing two Nepali stocks have in common, so a bank
   is judged against banks. dir=1 means a higher number ranks first. */
const FRK=new Map();
function fRank(s,get,dir){
  if(!s||!s.sector)return null;
  const key=(get.k||get.name||String(get))+'|'+s.sector+'|'+dir;
  let t=FRK.get(key);
  if(!t){
    const peers=EQ.filter(x=>x.sector===s.sector&&!x.stale)
      .map(x=>({sym:x.sym,v:get(x)})).filter(x=>x.v!=null&&isFinite(x.v));
    peers.sort((a,b)=>dir>0?b.v-a.v:a.v-b.v);
    t=Object.create(null); t.__n=peers.length;
    peers.forEach((p,i)=>t[p.sym]=i+1);
    FRK.set(key,t);
  }
  /* a bar reading "1 of 1" is a full bar and a rank of first: STC was the only
     trading company in its sector with a profit, and the page called it the
     cheapest. Below five peers there is no ranking to show, which is the same
     threshold fCompare already used. */
  return (t[s.sym]&&t.__n>=5)?[t[s.sym],t.__n]:null;
}
/* "dearer than 13 of the 18" reads better than "ranks 6th of 18" and says the
   same thing — but only if the word matches the side it is on. A company in
   the expensive half described as "cheaper than 5 of 18" is accurate and
   leaves the reader with the wrong impression, which is the failure mode this
   whole file exists to avoid. */
function fCompare(s,get,cheapWord,dearWord,noun){
  const r=fRank(s,get,-1); if(!r||r[1]<5)return '';
  const [rank,n]=r, peers=`${n} ${noun}`;
  if(rank===1)return `The cheapest ${cheapWord} of the ${peers}`;
  if(rank===n)return `The dearest ${dearWord} of the ${peers}`;
  /* the count is of the companies on the other side of it: dearer than the
     ones it is dearer than, which is rank-1, not n-rank */
  return rank<=n/2
    ? `Cheaper ${cheapWord} than ${n-rank===1?'one':n-rank} of the ${peers}`
    : `Dearer ${dearWord} than ${rank-1===1?'one':rank-1} of the ${peers}`;
}
const SECW={'Commercial Banks':'commercial banks','Development Banks':'development banks',
  'Finance':'finance companies','Microfinance':'microfinance companies','Life Insurance':'life insurers',
  'Non Life Insurance':'non-life insurers','Hydro Power':'hydropower companies',
  'Hotels And Tourism':'hotels','Manufacturing And Processing':'manufacturers',
  'Investment':'investment companies','Tradings':'trading companies','Others':'companies in Others'};
const secWord=x=>SECW[x]||'companies in its sector';

/* ---- the period a figure belongs to ---------------------------------- */
/* Nepali fiscal years run Shrawan to Ashadh. 82083 is 2082/83, whose Q3 closes
   in Chaitra 2082 and whose Q4 closes in Ashadh 2083 — mid-July on the
   Gregorian calendar. Quarters below Q4 are reported cumulatively and scaled
   to a year by the exchange's own convention, which is worth saying out loud
   because a scaled nine months is not a year. */
const QEND={1:['Ashwin',0],2:['Poush',0],3:['Chaitra',0],4:['Ashadh',1]};
function fyParts(fy){const t=String(fy||'');return t.length===5?[+t.slice(0,2)+2000,+('20'+t.slice(3))]:[null,null];}
function fPeriod(f){
  if(!f||!f.fy||!f.q)return{short:'latest filing',long:'the most recent filing we hold',ann:false};
  const [a,b]=fyParts(f.fy), [mon,late]=QEND[f.q]||QEND[4];
  const yr=late?b:a, greg=late?b-57:b-58;
  if(f.q===4)return{short:`FY ${a%100}/${b%100}`,ann:false,
    long:`the year ended ${mon} ${yr}`,greg:`mid-July ${b-57}`};
  const words={1:'three months',2:'six months',3:'nine months'}[f.q];
  return{short:`FY ${a%100}/${b%100} Q${f.q}`,ann:true,
    long:`the ${words} to ${mon} ${yr}, scaled to a full year`,greg:null};
}

/* ---- where the number came from -------------------------------------- */
/* Five different causes were hiding behind one word, "conflict". The cause
   decides who is right, so the cause is what gets shown. */
const SRCN=['the company’s own filing','merolagani','nepsealpha'];
/* The filing block does not always describe the same period as the headline
   EPS. For 64 companies merolagani has the audited year and the filing service
   we pull from stops at Q3 — so the earnings figure is twelve months and the
   profit, equity and return beneath it are nine. Printing one period label over
   both was the worst thing on the page. */
const filPeriod=f=>fPeriod({fy:f.filfy,q:f.filq});
/* fPeriod's long form already begins with "the"; the cumulative suffix is only
   wanted where the sentence is about the annualisation itself */
const filShort=f=>filPeriod(f).long.replace(', scaled to a full year','').replace(/^the /,'');
function fProv(s){
  const f=fu(s); if(!f)return null;
  const p=fPeriod(f), src=SRCN[f.src]||'an aggregator';
  /* an amber line reading exactly like a clean one tells the reader there is
     something to know and not what it is */
  const why={A:'a period ahead of our filing',B:'we use the filed share count',
    C:'a quarter ahead of merolagani',D1:'one source disagrees',D2:'unverified',
    E:'nothing to check it against',F:'the filing contradicts itself'}[f&&f.grp]||'';
  const base=`${p.short} · ${src}`+(why?` · ${why}`:'');
  const split=f.split?` Everything else on this page — profit, equity, assets, return on equity — is still the ${filShort(f)} filing, so it will not divide into the earnings figure above.`:'';
  if(!f.grp)return{tone:'ok',label:base,
    say:`Straight from ${src}, and both merolagani and nepsealpha publish the same figure.`};
  const say={
   A:(f.sign
      ?`merolagani reports a profit for the full year; the ${filShort(f)} filing we hold shows a loss. Until the annual filing reaches us, neither is settled, so no earnings multiple is shown for this company.`
      :`merolagani carries the full-year result for this company; the filing service we pull from still only reaches the ${filShort(f)}. A real twelve months beats a scaled nine, so this is merolagani’s number.`)
     +(shareDoubt(f)?' Separately, the filing contradicts its own paid-up capital on the share count, so book value a share is withheld.':split),
   B:`Taken from the filing: ${f.note}. The count the company itself reports is the one that matches its paid-up capital exactly.`,
   C:`Taken from the filing, which is a quarter ahead of merolagani here.`,
   D1:`Taken from the filing, where ${f.note}.`,
   D2:`Taken from the filing, and it is the only figure in the whole set that nothing else agrees with — same period, same share count, and both aggregators land somewhere different. Treat it as unverified.`,
   E:`No filing reached us for this security${f.note?', and '+f.note:''}.`,
   F:`Taken from the filing, but the filing contradicts itself: ${f.note}.`
  }[f.grp]||f.note;
  return{tone:(f.grp==='D2'||f.grp==='F'||f.sign)?'warn':'src',label:base,say};
}

/* ---- the sentence ----------------------------------------------------- */
function fundLead(s){
  const f=fu(s); if(!f||f.eps==null)return '';
  const p=fPeriod(f),pe=F_PE(s),pb=F_PBV(s),out=[];
  /* four securities with a filing have stopped trading; "at today's Rs 500"
     is a claim about a price nobody paid today */
  const at=s.stale?`At its last traded Rs ${fmt(s.c,0)}`:`At today’s Rs ${fmt(s.c,0)}`;
  const per=p.ann?`over the last twelve months, scaled up from ${p.long.replace(', scaled to a full year','')}`:`in ${p.long}`;
  /* group A's headline is a real twelve months even though its filing is not */
  if(f.eps>0){
    out.push(`Earned <b class="num">Rs&nbsp;${fmt(f.eps,2)}</b> a share ${per}.`);
    if(f.sign)out.push(`The filing we hold for this company covers a shorter period and shows a loss, so no earnings multiple is shown until the two agree.`);
    else if(pe&&pe<=PE_CAP)out.push(`${at} you are paying <b class="num">${fmt(pe,1)} times</b> that`
      +(pb?`, and <b class="num">${fmt(pb,1)} times</b> the Rs&nbsp;${fmt(f.book_value,0)} of net assets behind each share.`:'.'));
    else if(pe)out.push(`${at} that is <b class="num">over ${PE_CAP} times</b> earnings — the profit is too small against the price for the multiple to mean much.`);
  }else if(f.eps<0){
    out.push(`Lost <b class="num">Rs&nbsp;${fmt(-f.eps,2)}</b> a share ${per}.`);
    out.push(`There are no earnings to put a price on, so the earnings multiple is left blank rather than made up.`
      +(pb?` Each share still carries Rs&nbsp;${fmt(f.book_value,0)} of net assets, and the market is asking <b class="num">${fmt(pb,1)} times</b> that.`:''));
  }else out.push(`Reported no profit ${per}.`);
  /* one comparison, not two: the second clause always carried a different
     denominator (not every company has a profit to price) and two peer counts
     in one sentence read as an error even when both are right */
  const cmp = pe ? fCompare(s,F_PE,'on earnings','on earnings',`profitable ${secWord(s.sector)}`)
            : pb ? fCompare(s,F_PBV,'on net assets','on net assets',secWord(s.sector)+' that report net assets')
            : '';
  return out.join(' ')+(cmp?` <span class="hint">${cmp}.</span>`:'');
}

/* ---- the card --------------------------------------------------------- */
const ORD=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
/* One phrasing for a rank, used by the headline numbers and by the sector rows
   beneath them. They used to disagree — "3rd dearest of 19" above "17/19" —
   and a reader has no way to know those are the same fact. */
function rankWords(rank,words){const[i,n]=rank,near=i<=n/2,k=near?i:n-i+1,w=words[near?0:1];
  /* "47th dearest of 103" is a large number that says only "somewhere in the
     middle". Past a third of the way in from either end, say that instead. */
  if(n>=12&&k>n*0.35)return `middle of the ${n}`;
  return k===1?`${w} of the ${n}`:`${ORD(k)} ${w} of ${n}`;}
function fMetric(label,val,sub,rank,words,q){
  /* "6th dearest of 18" carries the direction with it. A bare "13 of 18" needs
     the reader to remember which end was the good one, and the good end is
     different for three of the four numbers here. Counting from whichever end
     is nearer also keeps the number small enough to read at a glance. */
  const r=rank?rankWords(rank,words):'';
  return `<div><span class="hint">${label}${q?Q(q):''}</span><b class="num">${val}</b>
    <span class="hint">${sub||r||'&nbsp;'}</span></div>`;
}
/* lenders live or die on two numbers the rest of the market does not report.
   Burying them behind a disclosure while showing a hydropower company's price
   ratios up front had the priority exactly backwards. */
const bankRow=s=>{const f=fu(s); if(f.npl==null&&f.car==null)return '';
  const carLow=f.car!=null&&f.car<(s.sector==='Commercial Banks'?11:8);
  return `<div class="riskgrid bankrow">
    ${fMetric('Bad loans',f.npl!=null?fmt(f.npl,2)+'%':'—',null,f.npl!=null?fRank(s,x=>{const g=fu(x);return g?g.npl:null;},-1):null,['cleanest','worst'],'npl')}
    ${fMetric('Capital buffer',f.car!=null?fmt(f.car,2)+'%':'—',carLow?'below the regulator’s floor':null,
       (!carLow&&f.car!=null)?fRank(s,x=>{const g=fu(x);return g?g.car:null;},1):null,['strongest','thinnest'],'car')}
  </div>`;};

function vBusiness(s){
  const f=fu(s); if(!f||f.eps==null)return '';
  const p=fPeriod(f),pe=F_PE(s),pb=F_PBV(s),pv=fProv(s),mc=F_MCAP(s);
  return `<div class="card pad biz">
    <span class="kicker">What the business earns</span>
    <p class="lead2">${fundLead(s)}</p>
    <div class="riskgrid">
      ${fMetric('Earnings a share','Rs '+fmt(f.eps,2),p.ann?'nine months, scaled'+Q('basis'):'the full year',null,null,'eps')}
      ${fMetric('Price to earnings',pe?peText(pe):'—',pe?null:(f.sign?'periods disagree':'no profit to price'),(pe&&pe<=PE_CAP)?fRank(s,F_PE,-1):null,['cheapest','dearest'],'pe')}
      ${fMetric('Price to book',pb?fmt(pb,1)+'×':'—',pb?null:(f.negeq?'equity is negative':shareDoubt(f)?'share count disputed':'no net assets reported'),pb?fRank(s,F_PBV,-1):null,['cheapest','dearest'],'pbv')}
      ${f.roe!=null
        ?fMetric('Return on equity',fmt(f.roe,1)+'%',null,fRank(s,x=>{const g=fu(x);return g?g.roe:null;},1),['highest','lowest'],'roe')
        :f.negeq?fMetric('Return on equity','—','equity is negative',null,null,'roe')
        :fMetric('Market value',mc?bigRs(mc):'—',null,null,null,null)}
    </div>
    ${bankRow(s)}
    <p class="hint prov ${pv.tone}">${pv.tone==='warn'?ic('warn',14)+' ':''}${esc(pv.label)}<button class="q" type="button" data-q="prov:${esc(s.sym)}" aria-label="Where this number comes from">?</button></p>
  </div>`;
}

/* ---- the detail: ranks, the sector's own measures, the whole filing ---- */
function srankRow(s,label,get,dir,fmtv,q,flag,words){
  const r=fRank(s,get,dir); const v=get(s);
  if(v==null)return '';
  const warn=flag&&flag(v);
  return `<div class="srank${warn?' warn':''}"><span class="sn">${label}${q?Q(q):''}</span>
    <span class="num sn2">${fmtv(v)}</span>
    ${r?`<span class="rankbar"><i style="width:${((1-(r[0]-1)/Math.max(1,r[1]-1))*100).toFixed(0)}%"></i></span>
    <span class="srk">${esc(rankWords(r,words||['best','worst']))}</span>`
     :'<span class="rankbar" aria-hidden="true"></span><span class="srk hint">too few to rank</span>'}</div>`;
}
const BFIROWS=[
 ['Bad loans',x=>{const g=fu(x);return g?g.npl:null;},-1,v=>fmt(v,2)+'%','npl',null,['cleanest','worst']],
 ['Capital buffer',x=>{const g=fu(x);return g?g.car:null;},1,v=>fmt(v,2)+'%','car',v=>v<8,['strongest','thinnest']],
 ['Lent against deposits',x=>{const g=fu(x);return g?g.cd_ratio:null;},-1,v=>fmt(v,1)+'%','cdr',null,['least stretched','most stretched']],
 ['Base rate',x=>{const g=fu(x);return g?g.base_rate:null;},-1,v=>fmt(v,2)+'%','base',null,['lowest','highest']],
 ['Cost of funds',x=>{const g=fu(x);return g?g.cost_of_funds:null;},-1,v=>fmt(v,2)+'%','cof',null,['lowest','highest']]];

function vFundDetail(s){
  const f=fu(s); if(!f||f.eps==null)return '';
  const fp=filPeriod(f),pv=fProv(s);
  const money=(l,v)=>v==null?'':`<div class="frow"><span>${v<0&&/profit/i.test(l)?l.replace(/profit/i,'loss'):l}</span><b class="num">${bigRs(Math.abs(v*1000))}</b></div>`;
  return `<div class="card pad fdet">
    <span class="kicker">Against its own sector</span>
    <p class="lead2">Each bar is this company’s place among the ${secWord(s.sector)} that report the figure, which is why the counts differ from row to row. Full bar is first.</p>
    ${srankRow(s,'Price to earnings',F_PE,-1,peText,'pe',null,['cheapest','dearest'])}
    ${srankRow(s,'Price to book',F_PBV,-1,v=>fmt(v,1)+'×','pbv',null,['cheapest','dearest'])}
    ${srankRow(s,'Return on equity',x=>{const g=fu(x);return g?g.roe:null;},1,v=>fmt(v,1)+'%','roe',null,['highest','lowest'])}
    ${srankRow(s,'Dividend yield',F_YLD,1,v=>fmt(v,2)+'%','yld',null,['highest','lowest'])}
    ${isBFI(s)?`<div class="divide"></div>
      <span class="kicker sub">Because it lends money${Q('bfi')}</span>
      ${BFIROWS.map(r=>srankRow(s,r[0],r[1],r[2],r[3],r[4],r[5],r[6])).join('')}`:''}
    <div class="divide"></div>
    <span class="kicker sub">The filing itself · ${esc(fp.long.replace(', scaled to a full year',', cumulative'))}</span>
    <div class="fnums">
      ${money('Net profit',f.net_profit_000)}
      ${money('Shareholders’ equity',f.total_equity_000)}
      ${money('Total assets',f.total_assets_000)}
      ${money('Revenue',f.revenue_000)}
      ${money('Operating profit',f.operating_profit_000)}
      ${money('Customer deposits',f.deposits_000)}
      ${money('Loans to customers',f.loans_000)}
      ${money('Net interest income',f.net_interest_income_000)}
      ${f.shares_outstanding?`<div class="frow"><span>Shares in issue</span><b class="num">${f.shares_outstanding.toLocaleString('en-IN')}</b></div>`:''}
      ${f.dividend_pct!=null?`<div class="frow"><span>Last dividend</span><b class="num">${fmt(f.dividend_pct,2)}% cash${f.bonus_pct?' + '+fmt(f.bonus_pct,2)+'% bonus':''}</b></div>`:''}
    </div>
    <p class="hint cardnote">${esc(pv.say)}</p>
  </div>`;
}

/*==== chart.js ====*/
/* ---------- interactive chart ---------- */
function sma(a,n){const o=new Array(a.length).fill(null);let s=0;
  for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n;}return o;}
function bbands(c,n=20,k=2){const m=sma(c,n),u=[],l=[];
  for(let i=0;i<c.length;i++){if(m[i]==null){u.push(null);l.push(null);continue;}
    let v=0;for(let j=i-n+1;j<=i;j++)v+=(c[j]-m[i])**2;const sd=Math.sqrt(v/n);u.push(m[i]+k*sd);l.push(m[i]-k*sd);}
  return{m,u,l};}
function rsiSeries(c,n=14){const o=new Array(c.length).fill(null);let au=0,ad=0;
  for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),dn=Math.max(-d,0);
    if(i<=n){au+=u/n;ad+=dn/n;if(i===n)o[i]=ad===0?100:100-100/(1+au/ad);}
    else{au=(au*(n-1)+u)/n;ad=(ad*(n-1)+dn)/n;o[i]=ad===0?100:100-100/(1+au/ad);}}
  return o;}

/* the theme tokens are the same for every chart and change only when the theme
   does, so they are read once rather than on every frame of a drag */
let __CC=null;
function chartColours(){
  if(__CC)return __CC;
  const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  return __CC={line:g('--line'),ink3:g('--ink3'),ink2:g('--ink2'),ink:g('--ink'),
    acc:g('--acc'),up:g('--up'),dn:g('--dn'),card:g('--card'),soft:g('--soft')};
}
function chartColoursReset(){__CC=null;}
let __LIVE=null;   /* the chart currently on screen, for the resize handler */
addEventListener('resize',()=>{if(__LIVE){__LIVE._w=0;__LIVE.draw();}});
class Chart{
  constructor(canvas,opts){__LIVE=this;
    this.cv=canvas;this.g=canvas.getContext('2d');
    this.opts=Object.assign({range:180,ma20:true,ma50:true,ma200:false,bb:false,rsi:false,nepse:false,
      log:false,hilo:false,cmp:null,line:false,vol:true,readout:null,onHover:null,onAnchor:null},opts);
    this.hover=null;this.off=0;this.anchor=null;this.dragged=false;this._bind();
  }
  setData(s,nepse){this.s=s;this.nepse=nepse;this.hover=null;this.off=0;this.anchor=null;this.draw();}
  destroy(){if(this._up)removeEventListener('mouseup',this._up);this.s=null;this.L=null;}
  /* the anchor turns the chart into a measuring tape */
  setAnchor(i){this.anchor=i==null?null:this.L.i0+i;this.draw();
    if(this.opts.onAnchor)this.opts.onAnchor(this.anchor==null?null:this._barAbs(this.anchor));}
  clampOff(){const max=Math.max(0,this.s.c.length-Math.min(this.opts.range,this.s.c.length));
    this.off=Math.max(0,Math.min(max,Math.round(this.off)));}
  set(o){Object.assign(this.opts,o);this.draw();}
  _bind(){
    const cv=this.cv;
    let down=null,pinch=null;
    const move=(x)=>{const r=cv.getBoundingClientRect();const px=x-r.left;
      if(!this.L)return;const {X,n}=this.L;
      let best=0,bd=1e9;for(let i=0;i<n;i++){const d=Math.abs(X(i)-px);if(d<bd){bd=d;best=i;}}
      if(this.hover!==best){this.hover=best;this.draw();if(this.opts.onHover)this.opts.onHover(this._bar(best));}};
    cv.addEventListener('mousedown',e=>{down={x:e.clientX,off:this.off};this.dragged=false;});
    this._up=()=>{down=null;};addEventListener('mouseup',this._up);
    cv.addEventListener('mousemove',e=>{
      if(down&&this.L){const dx=e.clientX-down.x;
        if(Math.abs(dx)>5){this.dragged=true;
          const bars=dx/((cv.clientWidth||600)/this.L.n);
          this.off=down.off+bars;this.clampOff();this.draw();return;}}
      move(e.clientX);});
    cv.addEventListener('mouseleave',()=>{this.hover=null;this.draw();if(this.opts.onHover)this.opts.onHover(null);});
    cv.addEventListener('touchstart',e=>{
      if(e.touches.length===2){pinch={d:Math.abs(e.touches[0].clientX-e.touches[1].clientX)||1,r:this.opts.range};return;}
      pinch=null;move(e.touches[0].clientX);},{passive:true});
    cv.addEventListener('touchmove',e=>{
      if(e.touches.length===2&&pinch){const d=Math.abs(e.touches[0].clientX-e.touches[1].clientX)||1;
        const nr=Math.max(30,Math.min(this.s.c.length,Math.round(pinch.r*pinch.d/d)));
        if(nr!==this.opts.range){this.opts.range=nr;this.clampOff();this.draw();}
        e.preventDefault();return;}
      move(e.touches[0].clientX);e.preventDefault();},{passive:false});
    cv.addEventListener('touchend',()=>{pinch=null;},{passive:true});
    cv.addEventListener('touchend',()=>{setTimeout(()=>{this.hover=null;this.draw();if(this.opts.onHover)this.opts.onHover(null);},1200);},{passive:true});
    cv.tabIndex=0;
    cv.addEventListener('keydown',e=>{if(!this.L)return;const n=this.L.n;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();
        this.hover=this.hover==null?n-1:Math.max(0,Math.min(n-1,this.hover+(e.key==='ArrowRight'?1:-1)));
        this.draw();if(this.opts.onHover)this.opts.onHover(this._bar(this.hover));}
      if(e.key==='Escape'){this.hover=null;this.anchor=null;this.draw();
        if(this.opts.onHover)this.opts.onHover(null);if(this.opts.onAnchor)this.opts.onAnchor(null);}
      if(e.key==='Enter'&&this.hover!=null)this.setAnchor(this.anchor===this.L.i0+this.hover?null:this.hover);});
    cv.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();
      const r=this.opts.range,nr=Math.max(30,Math.min(this.s.c.length,Math.round(r*(e.deltaY>0?1.2:0.83))));

  }
  _bar(i){const L=this.L;if(!L||i==null)return null;const k=L.i0+i,s=this.s;
    const b={i,k,d:s.d[k],o:s.o[k],h:s.h[k],l:s.l[k],c:s.c[k],v:s.v[k],
      prev:k>0?s.c[k-1]:null,ma20:L.m20[i],ma50:L.m50[i],ma200:L.m200[i],rsi:L.rsi?L.rsi[i]:null};

  draw(){
    const cv=this.cv,s=this.s;if(!s)return;
    /* clientWidth immediately after the view rewrote the page forces a full
       synchronous layout — 11ms on a throttled phone, a third of the cost of
       opening a stock page. The width only changes when the window does, so it
       is measured once and kept. */
    let W=this._w;
    if(!W){W=this._w=cv.clientWidth||600;}
    const hasRsi=this.opts.rsi;
    const H=Math.max(220,Math.min(360,Math.round(W*0.5)))+(hasRsi?70:0);
    if(cv.style.height!==H+'px')cv.style.height=H+'px';
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;}
    const g=this.g;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    const C=chartColours();
    const n=Math.min(this.opts.range,s.c.length);
    this.clampOff();
    const i0=Math.max(0,s.c.length-n-this.off);
    const j1=i0+n;
    const o=s.o.slice(i0,j1),h=s.h.slice(i0,j1),l=s.l.slice(i0,j1),c=s.c.slice(i0,j1),v=s.v.slice(i0,j1),dd=s.d.slice(i0,j1);

    const m20=sma(s.c,20).slice(i0,j1),m50=sma(s.c,50).slice(i0,j1),m200=sma(s.c,200).slice(i0,j1);
    const bb=this.opts.bb?bbands(s.c):null;const bu=bb?bb.u.slice(i0,j1):null,bl=bb?bb.l.slice(i0,j1):null;
    const rs=hasRsi?rsiSeries(s.c).slice(i0,j1):null;
    const PL=2,PR=50,PT=8,VH=this.opts.vol?Math.round(H*0.11):0,RH=hasRsi?56:0,GAP=hasRsi?14:0;
    const CH=H-VH-RH-GAP-PT-28;
    const lows=l.filter(x=>x>0);let mn=Math.min(...lows),mx=Math.max(...h);
    if(this.opts.bb){bu.forEach(x=>{if(x!=null)mx=Math.max(mx,x)});bl.forEach(x=>{if(x!=null)mn=Math.min(mn,x)});}
    // NEPSE overlay rescaled to start at the first close in window
    let nep=null;
    if(this.opts.nepse&&this.nepse){const nd=this.nepse.d,nc=this.nepse.c;
      const idx=new Map();nd.forEach((x,i)=>idx.set(x,i));
      const first=dd.findIndex(x=>idx.has(x));
      if(first>=0){const base=nc[idx.get(dd[first])],ref=c[first];
        nep=dd.map(x=>idx.has(x)?nc[idx.get(x)]/base*ref:null);
        nep.forEach(x=>{if(x!=null){mx=Math.max(mx,x);mn=Math.min(mn,x);}});}}
    if(this.opts.hilo&&this.hi52!=null){mx=Math.max(mx,this.hi52);mn=Math.min(mn,this.lo52);}
    let cmp=null;
    const cmpList=(Array.isArray(this.opts.cmp)?this.opts.cmp:this.opts.cmp?[this.opts.cmp]:[])
      .filter(k=>SER[k]);
    if(cmpList.length){
      cmp=cmpList.map(k=>{const q=SER[k];
        const qi=new Map();q.d.forEach((x,i)=>qi.set(x,i));
        const first=dd.findIndex(x=>qi.has(x));
        if(first<0)return null;
        const base=q.c[qi.get(dd[first])],ref=this.opts.line?c[0]:c[first];
        const a=dd.map(x=>qi.has(x)?q.c[qi.get(x)]/base*ref:null);
        a.forEach(x=>{if(x!=null){mx=Math.max(mx,x);mn=Math.min(mn,x);}});
        return a;}).filter(Boolean);}
    const LOG=this.opts.log&&mn>0;
    const lmn=LOG?Math.log(mn):0,lrg=LOG?(Math.log(mx)-lmn)||1:1;
    const rg=(mx-mn)||1;
    const X=i=>PL+i/(n-1)*(W-PL-PR),Y=p=>LOG?PT+(1-(Math.log(Math.max(p,1e-6))-lmn)/lrg)*CH:PT+(1-(p-mn)/rg)*CH;
    this.L={X,Y,n,i0,m20,m50,m200,rsi:rs,PT,CH};
    // grid
    g.strokeStyle=C.line;g.lineWidth=1;g.fillStyle=C.ink3;g.font='500 10.5px Manrope,sans-serif';g.textAlign='left';
    const asPct=this.opts.line&&cmp&&cmp.length&&c[0]>0;
    for(let k=0;k<=4;k++){const p=LOG?Math.exp(lmn+lrg*k/4):mn+rg*k/4;const yy=Math.round(Y(p))+.5;g.beginPath();g.moveTo(PL,yy);g.lineTo(W-PR,yy);g.stroke();
      const lab=asPct?((p/c[0]-1)*100>=0?'+':'')+((p/c[0]-1)*100).toFixed(0)+'%':(p>=1000?p.toFixed(0):p.toFixed(1));
      g.fillText(lab,W-PR+8,yy+3.5);}
    const line=(arr,col,wd,dash)=>{g.strokeStyle=col;g.lineWidth=wd;g.lineJoin='round';g.setLineDash(dash||[]);g.beginPath();let st=false;
      for(let i=0;i<n;i++){if(arr[i]==null){continue;}st?g.lineTo(X(i),Y(arr[i])):(g.moveTo(X(i),Y(arr[i])),st=true);}g.stroke();g.setLineDash([]);};
    if(this.opts.bb){g.fillStyle=C.acc;g.globalAlpha=.06;g.beginPath();let st=false;
      for(let i=0;i<n;i++){if(bu[i]==null)continue;st?g.lineTo(X(i),Y(bu[i])):(g.moveTo(X(i),Y(bu[i])),st=true);}
      for(let i=n-1;i>=0;i--){if(bl[i]==null)continue;g.lineTo(X(i),Y(bl[i]));}g.closePath();g.fill();g.globalAlpha=1;
      line(bu,C.acc,1,[3,3]);line(bl,C.acc,1,[3,3]);}
    if(this.opts.hilo&&this.hi52!=null){g.strokeStyle=C.ink3;g.lineWidth=1;g.setLineDash([2,4]);g.globalAlpha=.7;
      [[this.hi52,'52w high'],[this.lo52,'52w low']].forEach(([p,lab])=>{const yy=Math.round(Y(p))+.5;
        g.beginPath();g.moveTo(PL,yy);g.lineTo(W-PR,yy);g.stroke();
        g.fillStyle=C.ink3;g.textAlign='left';g.font='600 9.5px Manrope,sans-serif';g.fillText(lab,PL+4,yy-4);});
      g.setLineDash([]);g.globalAlpha=1;g.font='500 10.5px Manrope,sans-serif';}
    if(cmp&&cmp.length){const cols=this.opts.line?[C.acc,C.ink3,C.up,C.dn]:[C.dn,C.acc,C.up,C.ink3];
      cmp.forEach((a,k)=>line(a,cols[k%cols.length],2));}
    if(nep)line(nep,C.ink3,1.4,[5,4]);
    if(this.opts.ma200)line(m200,C.ink2,1.4);
    if(this.opts.ma50)line(m50,C.ink3,1.5);
    if(this.opts.ma20)line(m20,C.acc,1.6);
    const bw=Math.max(1.5,Math.min(9,(W-PL-PR)/n*.62));
    if(this.opts.line){                       /* comparison mode: like against like */
      line(c,C.ink,2);
    }else{
      for(let i=0;i<n;i++){if(!(l[i]>0))continue;const col=c[i]>=o[i]?C.up:C.dn;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1;
        g.beginPath();g.moveTo(X(i),Y(h[i]));g.lineTo(X(i),Y(l[i]));g.stroke();
        const y1=Y(Math.max(o[i],c[i])),y2=Y(Math.min(o[i],c[i]));g.fillRect(X(i)-bw/2,y1,bw,Math.max(1.5,y2-y1));}
    }
    const vy=PT+CH+10;
    if(this.opts.vol){
      const vmx=Math.max(...v)||1;g.globalAlpha=.3;
      for(let i=0;i<n;i++){g.fillStyle=c[i]>=o[i]?C.up:C.dn;g.fillRect(X(i)-bw/2,vy+VH-(v[i]/vmx)*VH,bw,(v[i]/vmx)*VH);}
      g.globalAlpha=1;}
    // rsi pane
    if(hasRsi){const ry=vy+VH+GAP;const RY=val=>ry+(1-val/100)*RH;
      g.fillStyle=C.soft;g.fillRect(PL,RY(70),W-PL-PR,RY(30)-RY(70));
      g.strokeStyle=C.line;[30,50,70].forEach(t=>{const yy=Math.round(RY(t))+.5;g.beginPath();g.moveTo(PL,yy);g.lineTo(W-PR,yy);g.stroke();});
      g.fillStyle=C.ink3;g.textAlign='left';g.fillText('70',W-PR+8,RY(70)+3.5);g.fillText('30',W-PR+8,RY(30)+3.5);
      g.strokeStyle=C.acc;g.lineWidth=1.4;g.beginPath();let st=false;
      for(let i=0;i<n;i++){if(rs[i]==null)continue;st?g.lineTo(X(i),RY(rs[i])):(g.moveTo(X(i),RY(rs[i])),st=true);}g.stroke();
      g.fillStyle=C.ink2;g.font='600 10.5px Manrope,sans-serif';g.fillText('Momentum',PL+4,ry+11);}
    // dates
    g.fillStyle=C.ink3;g.font='500 10.5px Manrope,sans-serif';
    [[0,'left'],[Math.floor(n/2),'center'],[n-1,'right']].forEach(([i,al])=>{g.textAlign=al;
      g.fillText(dayToDate(dd[i]).toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),X(i),H-4);});
    // anchor: a shaded span from where you clicked to where you are
    if(this.anchor!=null&&this.anchor>=i0&&this.anchor<i0+n){
      const ai=this.anchor-i0,ax=X(ai);
      if(this.hover!=null&&this.hover!==ai){
        const hx=X(this.hover),up=c[this.hover]>=c[ai];
        g.fillStyle=up?C.up:C.dn;g.globalAlpha=.07;
        g.fillRect(Math.min(ax,hx),PT,Math.abs(hx-ax),CH);g.globalAlpha=1;}
      g.strokeStyle=C.acc;g.lineWidth=1.5;g.setLineDash([4,3]);
      g.beginPath();g.moveTo(Math.round(ax)+.5,PT);g.lineTo(Math.round(ax)+.5,PT+CH);g.stroke();g.setLineDash([]);
      g.fillStyle=C.acc;g.beginPath();g.arc(ax,Y(c[ai]),4,0,Math.PI*2);g.fill();}
    // crosshair
    if(this.hover!=null){const i=this.hover,x=Math.round(X(i))+.5;
      g.strokeStyle=C.ink;g.globalAlpha=.35;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,PT);g.lineTo(x,H-18);g.stroke();
      const yy=Math.round(Y(c[i]))+.5;g.beginPath();g.moveTo(PL,yy);g.lineTo(W-PR,yy);g.stroke();g.setLineDash([]);g.globalAlpha=1;
      g.fillStyle=C.ink;g.beginPath();g.arc(X(i),Y(c[i]),3.5,0,Math.PI*2);g.fill();
      g.fillStyle=C.card;g.beginPath();g.arc(X(i),Y(c[i]),1.8,0,Math.PI*2);g.fill();

      const tw=g.measureText(tag).width+10;g.fillRect(W-PR+4,yy-9,tw,18);g.fillStyle=C.card;g.textAlign='left';g.fillText(tag,W-PR+9,yy+3.5);}

/*==== F_engine.js ====*/
/* ============ filters: a declarative registry, plus attribution ============
   A filter decides who is in the list. The weights decide the order.
   Keeping those two ideas apart is what makes the screen explainable. */

const RNG=(k,t,g,min,max,step,fmtv,help)=>({k,t,type:'range',get:g,min,max,step,fmt:fmtv,help,
  def:[min,max],act:v=>v[0]>min||v[1]<max,
  /* a handle left at its stop is no bound at all. "at least Rs 500" must not
     quietly also mean "and at most Rs 5,000" — five listed companies trade
     above that, and they were being dropped by a rule nobody set. */
  test:(s,v)=>{const x=g(s);if(x==null)return false;
    return (v[0]<=min||x>=v[0])&&(v[1]>=max||x<=v[1]);},
  say:v=>v[0]>min&&v[1]<max?`${fmtv(v[0])} to ${fmtv(v[1])}`:v[0]>min?`at least ${fmtv(v[0])}`:`at most ${fmtv(v[1])}`});

/* `bare` marks a formatter that already says which way the bound runs — "under
   20×", "over Rs 1 arba". Without it the summary line read "at most under 20×". */
const MIN=(k,t,g,steps,fmtv,help,bare)=>({k,t,type:'min',get:g,steps,fmt:fmtv,help,
  def:0,act:v=>v>0,test:(s,v)=>{const x=g(s);return x!=null&&x>=v;},
  say:v=>bare?fmtv(v):`at least ${fmtv(v)}`});

const TRI=(k,t,g,above,below,help)=>({k,t,type:'tri',get:g,help,above,below,
  def:0,act:v=>v!==0,test:(s,v)=>{const x=g(s);return x==null?false:(v>0?x>0:x<0);},
  fmt:v=>v==null?'not available yet':(v>0?'Rs '+fmt(v,1)+' above':'Rs '+fmt(-v,1)+' below'),
  say:v=>v>0?above:below});

/* type 'max' renders like 'min' but shades the histogram the way it filters:
   these are caps, and highlighting x >= threshold taught the opposite rule */
const MAX=(k,t,g,steps,fmtv,help,cap,needs,bare)=>({k,t,type:'max',get:g,steps,fmt:fmtv,help,max1:1,needs,
  def:cap,act:v=>v<cap,test:(s,v)=>{const x=g(s);return x!=null&&x<=v;},
  say:v=>bare?fmtv(v):`at most ${fmtv(v)}`});
const CUR=s=>s.c;
const FILTERS=[
 MIN('turn','Daily turnover',s=>s.turn20||0,[0,1e5,5e5,1e6,5e6,1e7,3e7,1e8],v=>cr(v)+' a day',
   'Rupees changing hands on an average day. The single best guard against a stock you cannot get out of.'),
 RNG('price','Share price',CUR,0,5000,50,v=>v>=5000?'any':'Rs '+fmt(v,0),
   'Price alone says nothing about value, a Rs 3,000 share can be a smaller company than a Rs 300 one. Useful only for sizing an order.'),
 RNG('rangep','Position in its yearly range',s=>s.rangepos,0,100,5,v=>v+'%',
   '0% sits at the 52-week low, 100% at the high. The fastest way to see whether you are buying something that has already run.'),
 RNG('rsi','Momentum (RSI)',s=>s.rsi,0,100,5,v=>String(v),
   'The size of recent gains against the size of recent losses over fourteen sessions, 0 to 100. Above 70 is called overbought — strong stocks stay there for months.'),
 MIN('rs','Strength against the market',s=>s.rs_comp,[0,50,60,70,80,90,95],v=>v+'%',

 RNG('r1m','One-month return',s=>s.r1m,-40,40,5,v=>pct(v),'Where it has been over the last month, not where it is going.'),

 TRI('prof','Profit or loss',s=>{const f=fu(s);return f?f.eps:null;},'Profitable','Losing money',

 MAX('pe','Price to earnings',s=>F_PE(s),[15,20,30,45,70,9999],

 MAX('pbv','Price to book',s=>F_PBV(s),[1.5,2,3,4,6,99],

   'Price against the net assets on the balance sheet. Under 1 means the market values the company at less than what it says it owns; the middle of this market is near 4 times. It means most for banks, whose assets are loans, and least for hydropower, whose real asset is a licence that never appears at market value.',99,null,1),
 MIN('roe','Return on equity',s=>{const f=fu(s);return f?f.roe:null;},[0,5,10,15,20],v=>v+'%',
   'Profit as a share of the money shareholders have left in the business. The single best one-number test of whether a company is good at its job, and the easiest to flatter with borrowing.'),
 MIN('yld','Dividend yield',s=>F_YLD(s),[0,0.5,1,2,3],v=>v+'%',
   'Last declared cash dividend against today\u2019s price. Bonus shares are deliberately left out — they are a split, not income. Just over half the market has no dividend on record here, and those companies cannot pass this rule whether they declared nothing or we simply have no figure. Last year\u2019s dividend is not a promise about this year\u2019s.'),
 MIN('mcap','Company size',s=>F_MCAP(s),[0,1e9,5e9,2e10,1e11],v=>v?'over '+bigRs(v).replace('Rs ',''):'any size',
   'Shares in issue times today\u2019s price. The whole company, not the share price — a Rs 3,000 share can belong to a far smaller company than a Rs 300 one.',1),
 MAX('npl','Bad loans, for lenders',s=>{const f=fu(s);return f?f.npl:null;},[2,3,5,8,12,100],
   v=>v>=100?'any':'under '+v+'%',
   'The share of a lender\u2019s loan book that has stopped being repaid on schedule. The median lender here is near 7%, and microfinance near 11% — under 3% is exceptional rather than normal. Only banks, development banks, finance companies and microfinance report it, so setting this rule also removes every company that does not lend.',100,null,1),
 MIN('car','Capital buffer, for lenders',s=>{const f=fu(s);return f?f.car:null;},[0,11,12,13,15],v=>v?v+'%':'any',
   'Capital against risk-weighted assets. Nepal Rastra Bank requires 11% of commercial banks. The closer to the floor, the less room a bank has to absorb a bad year or to grow its book. Lenders only.'),
 MAX('young','Listed recently',s=>s.yrbars,[100,160,220,900],v=>v>=900?'any age':v+' sessions',
   'The other side of the same number — companies that have not been trading long. Half the figures in this app need a year of history to mean anything.',900),
];
const FBY=Object.create(null);FILTERS.forEach(f=>FBY[f.k]=f);
/* Twenty-four rules in one flat list is a wall. Grouped by the question they
   answer, it is five short lists, and the grouping teaches the distinction
   that matters most here: what the company earned is a different kind of fact
   from what its price has been doing. */
const FGROUPS=[
 ['What the company earns','From the last filing. Nothing here moves when the price does.',
  ['prof','pe','pbv','roe','yld','mcap','npl','car']],
 ['What the price has done','Price history and today’s close. Nothing here knows what the company earns.',
  ['rangep','rsi','rs','r1m','r1y','ma200','ma50','ma20']],
 ['Whether you can get out','The rules that stop you buying something you cannot sell.',
  ['turn','price','age','young']],
 ['Who has been buying','Broker accumulation, which NEPSE publishes and almost no other exchange does.',
  ['rvol','persist','conc']],
 ['When it goes wrong','Measured on what actually happened, not on a formula.',
  ['dd','vol']]];
(function checkGroups(){const seen=new Set();FGROUPS.forEach(g=>g[2].forEach(k=>seen.add(k)));

const DCACHE=new Map();

   raw min-to-max domain stops answering it the moment one company is far out.
   CREST trades at 3,159 times earnings, so 28 bins across the whole range put
   81% of the market in bin zero and shaded nothing at any threshold a reader
   would ever choose. The domain is clipped to the furthest setting the control
   itself offers, and whatever lies beyond is counted rather than drawn. */
function fdist(f,bins=28){
  const key=f.k+'|'+UNIV+'|'+SECT.join(',')+'|'+(fReady(f)?'1':'0');
  if(DCACHE.has(key))return DCACHE.get(key);
  const vals=univ().filter(sectPass).map(f.get).filter(v=>v!=null&&isFinite(v));
  let out=null;
  if(vals.length){
    let lo,hi;
    if(f.type==='range'){lo=f.min;hi=f.max;}
    else{
      const real=f.steps?f.steps.filter(v=>isFinite(v)&&(f.type!=='max'||v<f.def)):[];
      lo=Math.min(...vals,real.length?Math.min(...real):Infinity);

/* The state of the market, said only as far as the numbers reach. Breadth is a
   headcount; it cannot tell you how far anything moved, so this never claims
   the index over- or understates a fall. */
function todayStrip(){
  const b=D.breadth,N=b.d.length;
  const day=N>1?(b.nepse[N-1]/b.nepse[N-2]-1)*100:null;
  const adv=b.adv[N-1],dec=b.dec[N-1],mv=adv+dec;
  const share=mv?adv/mv:null;
  const wide=share!=null&&Math.abs(share-0.5)>0.35;   /* about 5 to 1 */
  const hi=EQ.filter(s=>s.hi52!=null&&s.c>=s.hi52).length;
  const lo=EQ.filter(s=>s.lo52!=null&&s.c<=s.lo52).length;
  let note='';
  if(wide&&share>0.5)note=`Almost everything rose: ${adv} up against ${dec} down.`;
  else if(wide&&day!=null&&day<0)note=`Almost everything fell: ${dec} down against ${adv} up.`;
  else if(wide&&day!=null&&day>=0)note=`The index held its level while ${dec} of the ${mv} that traded fell. A few large companies carried it.`;
  return `<div class="today">
    <div class="trow1"><span class="tlab">NEPSE</span><b class="num tval">${fmt(b.nepse[N-1],0)}</b>
      <span class="num ${cls(day)} tday">${day==null?'':pct(day)}</span>
      <span class="hint">${esc(fdate(b.d[N-1]))}</span></div>
    <p class="tline">Of the <b class="num">${mv}</b> securities that traded, <b class="num">${adv}</b> rose and <b class="num">${dec}</b> fell.
      <span class="nb"><b class="num">${b.a200[N-1].toFixed(0)}%</b> of them are above their 200-day average${Q('ma')}</span>.
      ${(hi||lo)?`Among ordinary shares, <b class="num">${hi}</b> closed at a 12-month high and <b class="num">${lo}</b> at a 12-month low.`:''}</p>
    ${note?`<p class="hint">${note}</p>`:''}
    ${today().n<GOAL?`<button class="lnk tgo" id="tlearn">${ic('flame',14)} ${today().n} of ${GOAL} lessons today</button>`:''}
  </div>`;}

function openGuide(){
  let i=0;const ans=[];const ov=document.createElement('div');ov.id='onb';ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Help me choose');
  const prev=document.activeElement;
  const close=()=>{ov.remove();document.removeEventListener('keydown',key);
    if(prev&&prev.focus)try{prev.focus();}catch(e){}};
  /* it declares aria-modal, so it has to behave like one: Tab stays inside and
     focus goes back where it came from */
  const key=e=>{
    if(e.key==='Escape'){e.preventDefault();close();return;}
    if(e.key!=='Tab')return;
    const f=[...ov.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(el=>!el.disabled&&el.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}};
  const finish=()=>{
    const [goal,freq,risk]=ans;
    const id=goal==='cheap'?'bargain':goal==='safe'?(risk==='low'?'calm':'steady'):(freq==='daily'?'breakout':'winners');
    const p=PRESETS.find(x=>x.id===id)||PRESETS[0];
    applyPreset(p);
    /* a trend floor on a beaten-down screen is an empty screen, so risk only
       tightens what the style has not already decided */
    if(risk==='low'){FV.turn=Math.max(FV.turn,1e7);if(goal!=='cheap')FV.ma200=1;}
    else if(risk==='mid')FV.turn=Math.max(FV.turn,1e6);
    if(freq==='rare')FV.turn=Math.max(FV.turn,1e7);
    dclear();
    /* what the answers alone produce. Kept, because a short honest list is a
       better answer than a longer one built on rules the user never chose. */
    const strict={FV:JSON.parse(JSON.stringify(FV)),n:screen().list.length};
    /* if that is too small to compare anything, loosen — but name every rule
       dropped and keep the strict screen one tap away */
    const relax=[
      {t:'lowered the turnover floor',run:()=>{FV.turn=Math.min(FV.turn,5e6);}},
      {t:'dropped the moving-average rules',run:()=>{FV.ma200=0;FV.ma50=0;}},
      {t:'dropped the strength-against-the-market rule',run:()=>{FV.rs=0;}},
      {t:'dropped the volume and broker rules',run:()=>{FV.rvol=0;FV.persist=0;FV.conc=0;}},
      {t:'cleared every rule',run:()=>{fReset();}}];
    const dropped=[];
    for(let i=0;i<relax.length&&screen().list.length<8;i++){relax[i].run();dclear();dropped.push(relax[i].t);}
    dclear();PAGE=30;saveScreen();close();
    GUIDED={style:p.t,n:screen().list.length,dropped,strict};
    go('find');};
  const paint=()=>{if(i>=GUIDE.length){finish();return;}
    const g=GUIDE[i];
    ov.innerHTML=`<div class="obox"><span class="kicker">Question ${i+1} of ${GUIDE.length}</span><h2>${g.q}</h2>
      <div class="qopts" style="margin-top:16px">${g.a.map(([t,v])=>`<button class="qo" data-v="${v}">${t}</button>`).join('')}</div>
      <div class="orow" style="margin-top:16px">${GUIDE.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}
        <button class="lnk sm" id="gskip">Skip</button></div></div>`;
    ov.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{ans.push(b.dataset.v);i++;paint();});
    ov.querySelector('#gskip').onclick=close;
    const f=ov.querySelector('.qo');if(f)f.focus();};
  document.body.appendChild(ov);paint();document.addEventListener('keydown',key);}

/* distribution behind a control — where the companies actually sit */
function histSVG(f,inRange){
  const d=fdist(f);if(!d)return'';
  const w=100,h=30,bw=w/d.h.length;
  const svg=`<svg class="hist" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`+
    d.h.map((n,i)=>{const v=d.lo+(i+0.5)*(d.hi-d.lo)/d.h.length;
      const bh=d.max?Math.max(n?1:0,n/d.max*h):0;
      return `<rect x="${(i*bw).toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${(bw*0.82).toFixed(2)}" height="${bh.toFixed(2)}" class="${inRange(v)?'in':'out'}"/>`;}).join('')+
    `</svg>`;
  /* companies past the end of the scale are not in the drawing, so they are
     said out loud rather than silently folded into the last bar */
  return svg+(d.over?`<p class="hint histover">${d.over} compan${d.over===1?'y is':'ies are'} past the end of this scale, at ${esc(f.fmt(d.hi))} or more.</p>`:'');}

function ctrlHTML(f){
  const v=FV[f.k];
  if(f.type==='range'){
    return histSVG(f,x=>x>=v[0]&&x<=v[1])+
      `<div class="drange"><div class="dtrack"><i style="left:${(v[0]-f.min)/(f.max-f.min)*100}%;right:${100-(v[1]-f.min)/(f.max-f.min)*100}%"></i></div>
       <input type="range" class="dr lo" min="${f.min}" max="${f.max}" step="${f.step}" value="${v[0]}" aria-label="${esc(f.t)} minimum">
       <input type="range" class="dr hi" min="${f.min}" max="${f.max}" step="${f.step}" value="${v[1]}" aria-label="${esc(f.t)} maximum"></div>
       <div class="dends"><span class="num">${f.fmt(v[0])}</span><span class="num">${f.fmt(v[1])}</span></div>`;}
  if(f.type==='min'||f.type==='max'){
    const inr=f.type==='max'?(x=>x<=v):(x=>x>=v);
    return histSVG(f,inr)+
      `<div class="chips" role="group" aria-label="${esc(f.t)}">${f.steps.map(x=>`<button class="chip${x===v?' on':''}" data-v="${x}" aria-pressed="${x===v}">${x===0?'Any':esc(f.fmt(x))}</button>`).join('')}</div>`;}
  return `<div class="chips tri" role="group" aria-label="${esc(f.t)}">
    <button class="chip${v===0?' on':''}" data-v="0" aria-pressed="${v===0}">Either</button>
    <button class="chip${v===1?' on':''}" data-v="1" aria-pressed="${v===1}">${esc(f.above)}</button>
    <button class="chip${v===-1?' on':''}" data-v="-1" aria-pressed="${v===-1}">${esc(f.below)}</button></div>`;}

/* live value readout without a full re-render */
function setFV(k){
  const f=FBY[k];
  const lab=APP().querySelector(`[data-fv="${k}"]`);
  if(lab)lab.textContent=k==='sector'?(SECT.length?SECT.join(', '):'All')
    :k==='univ'?(UNIV==='all'?'Everything listed':'Ordinary shares')
    :(f.act(FV[k])?f.say(FV[k]):'Any');
  if(f){
    const keep=APP().querySelector(`[data-keep="${k}"]`);
    if(keep){const n=univ().filter(sectPass).filter(s=>fPass(s,f)).length;
      keep.textContent=f.act(FV[k])?`Keeps ${n} of ${univ().filter(sectPass).length} on its own`:'No effect while set to any';}
    const box=APP().querySelector(`[data-c="${k}"]`);
    if(box&&f.type==='range'){
      const v=FV[k];
      const fill=box.querySelector('.dtrack i');
      if(fill){fill.style.left=((v[0]-f.min)/(f.max-f.min)*100)+'%';fill.style.right=(100-(v[1]-f.min)/(f.max-f.min)*100)+'%';}
      const e=box.querySelectorAll('.dends .num');
      if(e.length===2){e[0].textContent=f.fmt(v[0]);e[1].textContent=f.fmt(v[1]);}
      box.querySelectorAll('.hist rect').forEach((rc,i)=>{
        const d=fdist(f);if(!d)return;const x=d.lo+(i+0.5)*(d.hi-d.lo)/d.h.length;
        rc.setAttribute('class',x>=v[0]&&x<=v[1]?'in':'out');});
    }}
  paintActive();
}

function wireCtrls(){
  APP().querySelectorAll('.fctrl').forEach(box=>{
    const k=box.dataset.c,f=FBY[k];
    box.querySelectorAll('.dr').forEach(inp=>inp.oninput=()=>{
      const lo=box.querySelector('.dr.lo'),hi=box.querySelector('.dr.hi');
      let a=+lo.value,b=+hi.value;
      if(inp.classList.contains('lo')&&a>b){a=b;lo.value=a;}
      if(inp.classList.contains('hi')&&b<a){b=a;hi.value=b;}
      if(FV[k][0]!==a||FV[k][1]!==b)activePreset=null;
      FV[k]=[a,b];setFV(k);});
    box.querySelectorAll('.dr').forEach(inp=>inp.onchange=()=>saveScreen());
    box.querySelectorAll('.chip[data-v]').forEach(b=>b.onclick=()=>{
      const nv=+b.dataset.v;if(FV[k]!==nv)activePreset=null;FV[k]=nv;
      box.querySelectorAll('.chip[data-v]').forEach(x=>x.classList.toggle('on',x===b));
      if(f.type==='min'||f.type==='max'){const d=fdist(f);
        box.querySelectorAll('.hist rect').forEach((rc,i)=>{if(!d)return;
          const x=d.lo+(i+0.5)*(d.hi-d.lo)/d.h.length;rc.setAttribute('class',x>=FV[k]?'in':'out');});}
      setFV(k);saveScreen();});
  });
}

function paintSaved(){
  const box=$('slist');if(!box)return;
  const L=Array.isArray(G.saved)?G.saved:[];
  box.innerHTML=L.length?`<div class="chips" style="margin-top:14px">${L.map((x,i)=>
    `<button class="chip" data-load="${i}">${esc(x.n)}</button>`).join('')}
    <button class="chip" data-clearsaved="1">Clear saved</button></div>`:'';
  box.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{
    if(fDecode(L[+b.dataset.load].c)){saveScreen();toast('Loaded “'+L[+b.dataset.load].n+'”');vRefine();}
    else toast('That screen could not be read');});
  const c=box.querySelector('[data-clearsaved]');if(c)c.onclick=()=>{G.saved=[];saveG();paintSaved();};
}

function tellStory(s){const O=[];const has=s.sma200!=null;
  /* "In plain words" described five kinds of price movement and never once
     mentioned that the company was losing money. That is not plain words. */
  (function business(){const f=typeof fu==='function'?fu(s):null;if(!f||f.eps==null)return;
    const p=fPeriod(f),per=p.ann?'over the last twelve months':'in '+p.long;
    if(f.eps<0)O.push(`It lost <b>Rs ${fmt(-f.eps,2)}</b> a share ${per}. A falling price is a different thing when the business behind it is also going backwards.`);
    else{const pe=F_PE(s);
      O.push(`It earned <b>Rs ${fmt(f.eps,2)}</b> a share ${per}`+
        (pe?`, which at today’s price is ${pe>PE_CAP?'over '+PE_CAP+' times earnings — the profit is small enough against the price that the multiple stops meaning much':fmt(pe,1)+' times earnings'}.`:'.'));}})();
  const above=[s.sma20!=null&&s.c>s.sma20,s.sma50!=null&&s.c>s.sma50,has&&s.c>s.sma200].filter(Boolean).length,of_=has?3:2;
  O.push(above===of_?`Trading above ${has?'its 20, 50 and 200-day averages':'both of its averages'} — buyers have had the upper hand on every timescale we can measure.`
   :above===0?`Below ${has?'all three of its averages':'both of its averages'}. Every timescale points down.`:`Above ${above} of its ${of_} averages. The trend is mixed, which usually means it is deciding.`);
  if(!has)O.push('It listed less than a year ago, so there is no long-term average and no 12-month range yet. Judge it on less evidence than the rest.');
  if(s.rs_comp!=null){const r=Math.round(s.rs_comp);O.push(r>=70?`Stronger than ${r}% of tradable companies. NEPSE did ${pct(M.bench.r1m)} this month; this did ${pct(s.r1m)}.`
   :r<=30?`Weaker than ${100-r}% of companies. It did ${pct(s.r1m)} while NEPSE did ${pct(M.bench.r1m)}.`:`Middle of the pack — around the ${ORD(r)} percentile.`);}
  if(s.rsi!=null)O.push(s.rsi>70?`Momentum reads ${s.rsi.toFixed(0)} out of 100. It has run hard and may need a breather.`:s.rsi<30?`Momentum reads ${s.rsi.toFixed(0)} out of 100 — sold hard. Sometimes a bounce, sometimes a warning.`:`Momentum reads ${s.rsi.toFixed(0)} out of 100 — comfortably in the middle.`);
  if(s.rvol!=null)O.push(s.rvol>2?`${s.rvol.toFixed(1)}× its usual volume. Something got attention.`:s.rvol<0.5?`Only ${s.rvol.toFixed(1)}× normal volume — very quiet. Read little into today’s price.`:`Volume at ${s.rvol.toFixed(1)}× normal, an ordinary day.`);
  O.push(`About Rs ${cr(s.turn20)} changes hands on an average day — ${(s.turn20||0)>1e7?'among the more actively traded names on NEPSE.':(s.turn20||0)>1e6?'a fairly normal amount for NEPSE.':'thin, so your own order could move the price against you.'}`);return O;}

/* an index, restricted to the dates a company actually traded */
function alignIdx(ix,ser){
  const qi=new Map();ix.d.forEach((x,i)=>qi.set(x,i));

  ser.d.forEach(x=>{if(qi.has(x)){d.push(x);c.push(ix.c[qi.get(x)]);}});

    done(ok,(ok?'':`The answer is ${shown}. `)+g.explain);};

    <div class="pairgrid"><div class="pcol">${L.map(x=>`<button class="pitem" data-side="l" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    <div class="pcol">${R.map(x=>`<button class="pitem" data-side="r" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  let wrong=0;
  host.querySelectorAll('.pitem').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('ok'))return;
    if(!sel){sel=b;b.classList.add('sel');return;}
    if(sel===b){b.classList.remove('sel');sel=null;return;}
    if(sel.dataset.side===b.dataset.side){sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}
    if(sel.dataset.i===b.dataset.i){sel.classList.add('ok');b.classList.add('ok');sel.classList.remove('sel');
      sel.disabled=b.disabled=true;sel=null;matched++;
      if(matched===g.pairs.length)done(wrong===0,g.explain||'');}
    else{wrong++;b.classList.add('miss');sel.classList.add('miss');const a=sel;
      setTimeout(()=>{a.classList.remove('miss','sel');b.classList.remove('miss');},420);sel=null;}});};

/* sort live items into buckets */
PRIM.CLASSIFY=(host,g)=>{
  let i=0,wrong=0;
  const step=()=>{
    if(i>=g.items.length){done(wrong===0,g.explain);return;}
    const it=g.items[i];
    host.innerHTML=`<p class="qq">${g.q}</p><div class="classcard">${esc(it.t)}${it.sub?`<span class="hint">${esc(it.sub)}</span>`:''}</div>
      <div class="qopts row2">${g.buckets.map(b=>`<button class="qo" data-b="${esc(b)}">${esc(b)}</button>`).join('')}</div>
      <p class="hint">${i+1} of ${g.items.length}</p>`;
    host.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.b===it.bucket;if(!ok)wrong++;
      b.classList.add(ok?'right':'wrong');
      host.querySelectorAll('.qo').forEach(x=>x.disabled=true);
      setTimeout(()=>{i++;step();},ok?380:900);});};
  step();};

/* put live items in order */
PRIM.RANK=(host,g)=>{
  let order=shuffle(g.items.map((x,i)=>i));
  const draw=()=>{host.innerHTML=`<p class="qq">${g.q}</p>
    <ol class="ranklist">${order.map((idx,pos)=>`<li><span class="rlab">${esc(g.items[idx].t)}</span>
      <span class="rbtns"><button class="rmv" data-p="${pos}" data-d="-1" ${pos===0?'disabled':''} aria-label="Move up">↑</button>
      <button class="rmv" data-p="${pos}" data-d="1" ${pos===order.length-1?'disabled':''} aria-label="Move down">↓</button></span></li>`).join('')}</ol>
    <button class="btn" id="rchk">Check order</button>`;
    host.querySelectorAll('.rmv').forEach(b=>b.onclick=()=>{const p=+b.dataset.p,d=+b.dataset.d;
      [order[p],order[p+d]]=[order[p+d],order[p]];draw();});
    $('rchk').onclick=()=>{
      const want=g.items.map((x,i)=>i).sort((a,b)=>g.items[b].v-g.items[a].v);
      /* ties are genuinely ambiguous — judge the values, not the labels */
      const ok=order.every((x,i)=>g.items[x].v===g.items[want[i]].v);
      host.innerHTML+=`<div class="rankans">${want.map(i=>`<div><b>${esc(g.items[i].t)}</b> <span class="num">${g.items[i].lab??fmt(g.items[i].v,1)}</span></div>`).join('')}</div>`;
      done(ok,g.explain);};};
  draw();};

/* click a point on a live chart */
PRIM.CHART=(host,g)=>{
  host.innerHTML=`<p class="qq">${g.q}</p><div class="lw"><div id="chro" class="readout"><span class="hint">Move across the chart, then click the day you mean.</span></div>
    <canvas id="chq"></canvas></div>`;
  const s=SER[g.sym];let hov=null;
  const ch=new Chart($('chq'),{range:g.range||90,ma20:!!g.ma,ma50:false,onHover:b=>{hov=b;
    $('chro').innerHTML=b?`<span class="ro"><b>${fdate(b.d)}</b><span class="num">close ${fmt(b.c,1)}</span><span class="num">volume ${b.v.toLocaleString()}</span></span>`
      :'<span class="hint">Move across the chart, then click the day you mean.</span>';}});
  ch.setData(s,NEPSE);
  $('chq').onclick=()=>{if(hov==null)return;
    const n=Math.min(g.range||90,s.c.length),i0=s.c.length-n;
    const w=(g.metric==='v'?s.v:s.c).slice(i0);
    const want=g.dir==='min'?w.indexOf(Math.min(...w)):w.indexOf(Math.max(...w));
    const ok=Math.abs(hov.i-want)<=1;
    done(ok,`${ok?'':'The answer was '+fdate(s.d[i0+want])+'. '}${g.explain}`);};};

/* two anonymised charts, which is which */
PRIM.TWOCHART=(host,g)=>{
  const flip=Math.random()<.5, A=flip?g.b:g.a, B=flip?g.a:g.b;
  host.innerHTML=`<p class="qq">${g.q}</p><div class="twochart">
    <div class="lw"><b>Chart A</b><canvas id="tcA"></canvas><button class="btn ghost" data-pick="A">This one</button></div>

  new Chart($('tcB'),{range:g.range||120,ma20:false,ma50:false}).setData(SER[B.sym]);
  host.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{

    host.querySelectorAll('[data-pick]').forEach(x=>x.disabled=true);

/* move a control, watch the effect, then answer */
PRIM.SLIDER=(host,g)=>{
  host.innerHTML=`<p class="qq">${g.q}</p>
    <div class="lw"><label class="dlab" for="sl">${esc(g.label)}<span class="num dval" id="slv"></span></label>
      <input type="range" id="sl" min="${g.min}" max="${g.max}" step="${g.step||1}" value="${g.start??g.min}">

  const upd=()=>{const v=+$('sl').value;$('slv').textContent=g.fmtv?g.fmtv(v):v;$('slout').innerHTML=g.live(v);};

/* commit a prediction, then see the real data */
PRIM.PREDICT=(host,g)=>{
  host.innerHTML=`<p class="qq">${g.q}</p><div class="qopts">${g.opts.map(o=>
    `<button class="qo" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  host.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.o===String(g.a);

      if(g.chart)new Chart(host.querySelector('canvas'),{range:g.chart.range||120,ma20:false,ma50:false,nepse:!!g.chart.nepse}).setData(SER[g.chart.sym],NEPSE);}

/* find the flawed claim */
PRIM.SPOT=(host,g)=>{
  host.innerHTML=`<p class="qq">${g.q||'One of these statements does not hold. Which?'}</p>
    <div class="qopts">${shuffle(g.claims).map(c=>`<button class="qo spot" data-bad="${c.bad?1:0}">${esc(c.t)}</button>`).join('')}</div>`;
  host.querySelectorAll('.qo').forEach(b=>b.onclick=()=>{
