/*==== R_risk.js ====*/
/* ============ risk: what a company does when it goes wrong ============
   Every screener in Nepal shows what a stock returned. None show what you had
   to sit through to get it. These are computed from the loaded price series,
   so they cover the same window the charts do. */
const RISK=Object.create(null);
let RISK_READY=false;

/* NEPSE raised the per-stock daily limit from 10% to 15% on 20 April 2026.
   Both dates are confirmed by the data: the 99.9th percentile of absolute
   daily moves is exactly 10.000% up to 17 April and exactly 15.000% after. */
const CIRCUIT_CHANGE=20563;            /* 2026-04-20 as a day number */
const capFor=day=>(day>=CIRCUIT_CHANGE?15:10)/100+0.005;

/* Annualising by 250 would be borrowing an American calendar. NEPSE trades
   about 230 days a year, and the index knows exactly how many. */
let SPY=null;
function sessionsPerYear(){
  if(SPY)return SPY;
  const d=NEPSE.d;
  if(!d||d.length<400)return SPY=230;
  const n=Math.min(d.length,1200);           /* the last five years or so */
  const a=d[d.length-n],b=d[d.length-1];
  const yrs=(b-a)/365.25;
  return SPY=yrs>0?Math.max(180,Math.min(260,(n-1)/yrs)):230;
}

function buildRisk(){
  if(RISK_READY||!SERIES_READY)return;
  const SQ=Math.sqrt(sessionsPerYear());
  for(const s of EQ){
    const c=SER[s.sym]&&SER[s.sym].c,d0=SER[s.sym]&&SER[s.sym].d;
    if(!c||!d0||c.length<60)continue;
    let pk=c[0],pkI=0,mx=0,mxPk=0,mxTr=0;
    for(let i=1;i<c.length;i++){
      if(c[i]>pk){pk=c[i];pkI=i;}
      const d=(1-c[i]/pk)*100;
      if(d>mx){mx=d;mxPk=pkI;mxTr=i;}
    }
    /* did it ever get back to that peak, and how long did it take */
    let back=-1;
    for(let i=mxTr+1;i<c.length;i++)if(c[i]>=c[mxPk]){back=i;break;}
    /* A single-day move larger than the exchange's own limit did not happen.
       It is a corporate action the adjustment missed, or a resumption after a
       long halt. Those days are flagged and kept out of the swing figure. */
    let sum=0,n=0,worst=0,best=0,suspect=0,worstOk=0;
    for(let i=1;i<c.length;i++){
      const r=c[i]/c[i-1]-1;
      if(!isFinite(r))continue;
      if(r<worst)worst=r;
      if(Math.abs(r)>capFor(d0[i])){suspect++;continue;}
      sum+=r;n++;if(r>best)best=r;if(r<worstOk)worstOk=r;
    }
    const mean=n?sum/n:0;let v=0;
    for(let i=1;i<c.length;i++){const r=c[i]/c[i-1]-1;
      if(isFinite(r)&&Math.abs(r)<=capFor(d0[i]))v+=(r-mean)**2;}
    const sd=n>1?Math.sqrt(v/(n-1)):0;
    /* what the figure would have been with the impossible days counted, so the
       page can show the cost of the choice rather than just asserting it */
    let sdAll=sd;
    if(suspect){let s2=0,n2=0;
      for(let i=1;i<c.length;i++){const r=c[i]/c[i-1]-1;if(isFinite(r)){s2+=r;n2++;}}
      const m2=n2?s2/n2:0;let v2=0;
      for(let i=1;i<c.length;i++){const r=c[i]/c[i-1]-1;if(isFinite(r))v2+=(r-m2)**2;}
      sdAll=n2>1?Math.sqrt(v2/(n2-1)):sd;}
    const d=d0;
    RISK[s.sym]={dd:mx,ddFrom:d[mxPk],ddTo:d[mxTr],
      ddDays:d[mxTr]-d[mxPk],
      backDays:back<0?null:d[back]-d[mxTr],
      recovered:back>=0,
      vol:sd*SQ*100,volAll:sdAll*SQ*100,
      worst:worst*100,worstOk:worstOk*100,best:best*100,suspect,
      days:c.length,from:d[0]};
  }
  /* the market's own numbers, on the same window, so a stock has something to beat */
  const bars=Math.max(...EQ.map(s=>SER[s.sym]?SER[s.sym].c.length:0))||420;
  const n=Math.min(NEPSE.c.length,bars),nc=NEPSE.c.slice(NEPSE.c.length-n);
  let sum=0,cnt=0;for(let i=1;i<nc.length;i++){const r=nc[i]/nc[i-1]-1;if(isFinite(r)){sum+=r;cnt++;}}
  const m=cnt?sum/cnt:0;let v=0;
  for(let i=1;i<nc.length;i++){const r=nc[i]/nc[i-1]-1;if(isFinite(r))v+=(r-m)**2;}
  RISK.__MKT__={vol:(cnt>1?Math.sqrt(v/(cnt-1)):0)*SQ*100,
    from:NEPSE.d[NEPSE.d.length-n],sessions:Math.round(sessionsPerYear())};
  RISK_READY=true;
}
const riskOf=s=>RISK[s.sym]||null;
const volRank=s=>{const r=riskOf(s);if(!r||!RISK.__MKT__.vol)return null;return r.vol/RISK.__MKT__.vol;};

/* ---- what moves with what ----
   Unit 12 teaches that owning eight microfinance companies is not
   diversification. This is the same claim, measured, for one company at a time. */
const RET=Object.create(null);
function retsOf(sym,n){
  const k=sym+'|'+n;
  if(RET[k])return RET[k];
  const c=SER[sym]&&SER[sym].c,d=SER[sym]&&SER[sym].d;
  if(!c||c.length<n+1)return RET[k]=null;
  const i0=c.length-n,r=new Float64Array(n),dd=new Int32Array(n),pp=new Int32Array(n);
  for(let i=0;i<n;i++){r[i]=c[i0+i]/c[i0+i-1]-1;dd[i]=d[i0+i];pp[i]=d[i0+i-1];}
  return RET[k]=r.length?{r,d:dd,p:pp}:null;
}
const CORR=Object.create(null);
function movesWith(sym,n=250,top=5){
  if(CORR[sym])return CORR[sym];
  const a=retsOf(sym,n);if(!a)return CORR[sym]=null;
  const idx=new Map();a.d.forEach((x,i)=>idx.set(x,i));
  const prev=new Map();a.d.forEach((x,i)=>prev.set(x,a.p[i]));
  const out=[];
  for(const s of EQ){
    if(s.sym===sym||(s.turn20||0)<2e6)continue;
    const b=retsOf(s.sym,n);if(!b)continue;
    let sx=0,sy=0,sxx=0,syy=0,sxy=0,m=0;
    for(let j=0;j<b.d.length;j++){
      const i=idx.get(b.d[j]);if(i===undefined)continue;
      /* both returns must span the same single session, or a thinly traded
         name's two-day move gets compared against a one-day move */
      if(prev.get(b.d[j])!==b.p[j])continue;
      const x=a.r[i],y=b.r[j];
      if(!isFinite(x)||!isFinite(y))continue;
      sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;m++;
    }
    if(m<120)continue;                       /* too little overlap to mean anything */
    const cov=sxy/m-(sx/m)*(sy/m);
    const vx=sxx/m-(sx/m)**2,vy=syy/m-(sy/m)**2;
    if(vx<=0||vy<=0)continue;
    out.push({s,c:cov/Math.sqrt(vx*vy),n:m});
  }
  out.sort((p,q)=>q.c-p.c);
  /* the width of the band that is indistinguishable from no relationship,
     at roughly two standard errors */
  const noise=2/Math.sqrt(Math.max(30,n)-2);
  return CORR[sym]={with:out.slice(0,top),against:out.slice(-top).reverse(),
    days:n,pool:out.length,noise};
}

/* The same two numbers for an index.

   A sub-index with two or three constituents jumps when one is added or
   removed: the Others index moved +184% in a day in 2003, Development Bank
   +72% in 2003, Trading +50% in 2008. Those are reconstitutions, not price
   moves, and they contaminate both figures — an inflated peak makes the
   drawdown that follows look far worse than it was. So this defaults to the
   last ten years, which is clean, and still drops any day that moves further
   than a whole index could. */
function idxRisk(name,days=3653){
  const s=IDX[name];if(!s||s.c.length<40)return null;
  let i0=0;
  if(days){const cut=s.d[s.d.length-1]-days;
    for(let k=s.d.length-1;k>=0;k--){if(s.d[k]<=cut){i0=k;break;}}}
  const c=s.c.slice(i0),d=s.d.slice(i0);
  if(c.length<60)return null;
  const CAP=0.12;                       /* no index of many stocks moves this far in a day */
  let pk=c[0],pkI=0,mx=0,mxPk=0,mxTr=0,jumps=0;
  for(let i=1;i<c.length;i++){
    if(Math.abs(c[i]/c[i-1]-1)>CAP)jumps++;
    if(c[i]>pk){pk=c[i];pkI=i;}
    const dd=(1-c[i]/pk)*100;
    if(dd>mx){mx=dd;mxPk=pkI;mxTr=i;}}
  let sum=0,n=0;
  for(let i=1;i<c.length;i++){const r=c[i]/c[i-1]-1;if(isFinite(r)&&Math.abs(r)<=CAP){sum+=r;n++;}}
  const m=n?sum/n:0;let v=0;
  for(let i=1;i<c.length;i++){const r=c[i]/c[i-1]-1;if(isFinite(r)&&Math.abs(r)<=CAP)v+=(r-m)**2;}
  const sd=n>1?Math.sqrt(v/(n-1)):0;
  return{dd:mx,ddFrom:d[mxPk],ddTo:d[mxTr],vol:sd*Math.sqrt(sessionsPerYear())*100,
    from:d[0],n:c.length,jumps};}

/*==== S_view.js ====*/
/* ============ sectors: the question a single company cannot answer ============
   Is this about the company, or about the trade it is in? */
let SECWIN=90, SECPICK=null, SECCH=null;
const SECWINS=[[30,'1 month'],[90,'3 months'],[365,'1 year'],[1825,'5 years'],[0,'All']];

/* return of an index over the last N calendar days, calendar-anchored */
function idxRet(name,days){
  const s=IDX[name];if(!s||s.c.length<2)return null;
  const last=s.d[s.d.length-1];
  if(!days)return{r:(s.c[s.c.length-1]/s.c[0]-1)*100,from:s.d[0]};
  const cut=last-days;
  let i=-1;for(let k=s.d.length-1;k>=0;k--){if(s.d[k]<=cut){i=k;break;}}
  if(i<0)return null;
  return{r:(s.c[s.c.length-1]/s.c[i]-1)*100,from:s.d[i]};}

function idxSlice(name,days){
  const s=IDX[name];if(!s)return null;
  if(!days)return s;
  const cut=s.d[s.d.length-1]-days;
  let i=0;for(let k=s.d.length-1;k>=0;k--){if(s.d[k]<=cut){i=k;break;}}
  return{d:s.d.slice(i),c:s.c.slice(i)};}

/* which sectors have a live index, with the companies behind them */
function sectorRows(){
  const map=D.imap||{};
  return Object.keys(map).map(sec=>{
    const name=map[sec];
    let r=idxRet(name,SECWIN),short=false;
    if(!r){r=idxRet(name,0);short=true;}          /* younger than the window you chose */
    const co=EQ.filter(s=>s.sector===sec);
    return r?{sec,name,r:r.r,from:r.from,short,n:co.length,
      turn:co.reduce((a,s)=>a+(s.turn20||0),0)}:null;})
   .filter(Boolean).sort((a,b)=>b.r-a.r);}

function vSectors(){
  if(typeof wantDetail==='function')wantDetail();
  const rows=sectorRows();
  const nep=idxRet('NEPSE',SECWIN);
  const mx=Math.max(...rows.map(r=>Math.abs(r.r)),Math.abs(nep?nep.r:0),1);
  const win=SECWINS.find(w=>w[0]===SECWIN);
  APP().innerHTML=`<button class="back" id="secback">${ic('chev',16)} Find</button>
  <section class="hero tight"><span class="kicker">Sectors</span><h1>Where the money went</h1>
    <p class="mkt">These are NEPSE's own sub-indices, calculated by the exchange.
      ${nep?`Over ${esc(win[1].toLowerCase())} the index itself did <b class="num ${cls(nep.r)}">${pct(nep.r)}</b>.`:''}</p>
    <div class="seg" style="margin-top:16px" role="group" aria-label="Window">${SECWINS.map(([d,l])=>
      `<button class="${SECWIN===d?'on':''}" data-sw="${d}" aria-pressed="${SECWIN===d}">${l}</button>`).join('')}</div></section>

  <div class="seclist">${rows.map(r=>{const w=Math.abs(r.r)/mx*50;
    return `<button class="secrow${SECPICK===r.sec?' on':''}" data-sec="${esc(r.sec)}">
      <span class="sname"><b>${esc(r.sec)}</b><span class="hint">${r.n} compan${r.n===1?'y':'ies'} · ${cr(r.turn)} a day${(!SECWIN||r.short)?' · since '+fdate(r.from):''}</span></span>
      <span class="sbars"><i class="${r.r<0?'neg':'pos'}" style="${r.r<0?`right:50%;width:${w}%`:`left:50%;width:${w}%`}"></i>
        <em class="zero"></em></span>
      <span class="num sret ${cls(r.r)}">${pct(r.r)}${r.short?'<small>*</small>':''}</span></button>`;}).join('')}</div>
  ${rows.some(r=>r.short)?`<p class="hint" style="margin-top:8px">* This index is younger than the window you chose, so the figure covers its whole life instead.</p>`:''}
  <p class="hint" style="margin-top:12px">Ranked over ${esc(win[1].toLowerCase())}. The line down the middle is zero.
    ${SECWIN?'':' These start on different dates, so the numbers are not comparable with each other — only with zero.'}
    ${(()=>{const have=new Set(rows.map(r=>r.sec));
      const miss=[...new Set(EQ.map(s=>s.sector))].filter(x=>x&&x!=='Unclassified'&&!have.has(x));
      return miss.length?` No sub-index is published for ${miss.map(esc).join(' or ')}, so ${miss.length===1?'it is':'they are'} not ranked here.`:'';})()}</p>

  <div id="secdetail"></div>`;
  $('secback').onclick=()=>go('find');
  APP().querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{SECWIN=+b.dataset.sw;vSectors();});
  APP().querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{
    SECPICK=SECPICK===b.dataset.sec?null:b.dataset.sec;vSectors();
    const d=$('secdetail');if(d&&SECPICK&&!RM.matches)d.scrollIntoView({behavior:'smooth',block:'start'});});
  if(SECPICK)paintSector();
}

function paintSector(){
  const box=$('secdetail');if(!box)return;
  const map=D.imap||{},name=map[SECPICK];
  const co=EQ.filter(s=>s.sector===SECPICK).sort((a,b)=>(b.turn20||0)-(a.turn20||0));
  const s=IDX[name];
  const r1=idxRet(name,30),r3=idxRet(name,90),r12=idxRet(name,365),all=idxRet(name,0);
  box.innerHTML=`<div class="sechead"><h2>${esc(SECPICK)}</h2>
      <button class="lnk sm" id="secclose">Close</button><span class="c">${esc(name)} sub-index</span></div>
    <div class="card chartcard"><canvas id="secc" role="img" aria-label="${esc(SECPICK)} index"></canvas>
      <div class="clegend"><span><span class="k c0"></span>${esc(SECPICK)}</span><span><span class="k c1"></span>NEPSE</span></div>
      <p class="hint chint">Both rescaled to start together, so the gap between them is the sector's excess or shortfall.</p></div>
    <div class="card pad" style="margin-top:12px"><div class="retgrid">
      ${[['1 month',r1],['3 months',r3],['1 year',r12],['Since '+(s?fdate(s.d[0]):'—'),all]].map(([k,v])=>

/*==== L_engine.js ====*/
/* ============ learning engine: mastery, scheduling, sessions ============ */
/* storage is deliberately separate from the main state and compact:
   m[id] = [reps, ease*10, intervalDays, dueDay, wrongCount, lastGradedDay] */
const TODAY=()=>Math.floor(Date.now()/864e5);
const LDEF={v:1,m:{},n:0,ok:0,ses:0};
let LS={...LDEF,m:{}};
(function loadL(){try{
  const raw=localStorage.getItem('bazaar:learn');if(!raw)return;
  const p=JSON.parse(raw);if(!p||typeof p!=='object'||Array.isArray(p))return;
  const num=(v,d,lo,hi)=>Number.isFinite(+v)?Math.max(lo,Math.min(hi,+v)):d;
  LS.n=num(p.n,0,0,1e6);LS.ok=num(p.ok,0,0,1e6);LS.ses=num(p.ses,0,0,1e6);
  if(p.m&&typeof p.m==='object'&&!Array.isArray(p.m)){
    for(const [k,v] of Object.entries(p.m).slice(0,600)){
      if(!/^[a-z]\d{1,2}$/.test(k)||!Array.isArray(v)||v.length<4)continue;
      LS.m[k]=[num(v[0],0,0,99),num(v[1],25,13,30),num(v[2],0,0,3650),num(v[3],0,0,1e6),num(v[4],0,0,999),num(v[5],0,0,1e6)];}}
}catch(e){LS={...LDEF,m:{}};}})();
const saveL=()=>{try{localStorage.setItem('bazaar:learn',JSON.stringify(LS));}catch(e){}};

/* ---- two routes, one scheduler ----
   Someone who has never bought a share and someone who trades weekly need
   different orders of explanation, but the same spaced repetition. So the
   curriculum splits and the memory does not. */
const ROUTES=[
 {id:'start',t:'Start from zero',d:'Never bought a share. Begins with what a company is and ends with your first trade.',units:BUNITS},
 {id:'market',t:'Reading the market',d:'You have bought before. Charts, volume, the floorsheet, risk, and whether any of it works.',units:UNITS},
];
const RBY=Object.create(null);ROUTES.forEach(r=>RBY[r.id]=r);
let ROUTE=RBY[G.route]?G.route:null;          /* null until the user chooses */
const RU=()=>(RBY[ROUTE]||ROUTES[0]).units;
function setRoute(id){if(RBY[id]){ROUTE=id;G.route=id;saveG();}}

const ALL=[];
ROUTES.forEach(r=>r.units.forEach(u=>u.L.forEach(l=>ALL.push({...l,u:u.u,ut:u.t,route:r.id}))));
const LBY=Object.create(null);ALL.forEach(l=>LBY[l.id]=l);
const NLESSON=ALL.length;
const routeLessons=id=>ALL.filter(l=>l.route===id);
/* Anyone who was already learning before the course split has no stored route.
   Asking them "where are you starting?" would be absurd, so put them back where
   their progress already is. */
if(!ROUTE&&Object.keys(LS.m).length){
  const c=Object.create(null);ROUTES.forEach(r=>c[r.id]=0);
  Object.keys(LS.m).forEach(id=>{const l=LBY[id];if(l)c[l.route]++;});
  const best=ROUTES.map(r=>r.id).sort((a,b)=>c[b]-c[a])[0];
  if(c[best]>0)setRoute(best);
}

/* ---- SM-2, trimmed to what actually matters here ---- */
function grade(id,ok){
  const t=TODAY();const r=LS.m[id]||[0,25,0,t,0,0];
  let [n,e,i]=r;const w=r[4],last=r[5]||0;
  if(ok){
    /* Answering the same question four times in one sitting is practice, not
       retention. A repeat on a day already credited can lift a lesson out of
       "needs another go", and no further: the interval only grows on a day
       that has not been counted for this lesson before. */
    const sameDay=n>0&&last===t;
    if(sameDay){i=Math.max(i,1);}
    else{
      n+=1;
      e=Math.min(30,e+1);
      i=n===1?1:n===2?4:Math.round(i*(e/10));
      i=Math.min(365,Math.max(1,i));
    }
  }else{
    n=0;e=Math.max(13,e-3);i=0;
  }
  LS.m[id]=[n,e,i,t+i,w+(ok?0:1),t];
  LS.n++;if(ok)LS.ok++;
  saveL();
}
/* four honest states, not a score */
function mstate(id){
  const r=LS.m[id];if(!r)return 'new';
  if(r[0]===0)return 'again';
  if(r[0]>=3&&r[2]>=21)return 'solid';
  if(r[3]<=TODAY())return 'due';
  return 'learning';
}
const MLAB={new:'Not started',again:'Needs another go',learning:'Learning',due:'Due for review',solid:'Solid'};
const isKnown=id=>{const s=mstate(id);return s==='learning'||s==='due'||s==='solid';};

function unitStat(u,route){
  const U=route?RBY[route].units:RU();
  const ls=U[u].L;let known=0,solid=0,seen=0;
  ls.forEach(l=>{const s=mstate(l.id);if(s!=='new')seen++;if(s==='solid')solid++;if(isKnown(l.id))known++;});
  return{n:ls.length,seen,known,solid,pct:Math.round(known/ls.length*100)};
}
function unlocked(u){
  if(u<=0)return true;
  const p=unitStat(u-1);
  return p.pct>=60||unitStat(u).seen>0;
}
function nextUnit(){const U=RU();for(let i=0;i<U.length;i++){const s=unitStat(i);if(s.pct<100&&unlocked(i))return i;}return 0;}
/* how far through a route someone is, for the picker */
function routeStat(id){
  const ls=routeLessons(id);
  const known=ls.filter(l=>isKnown(l.id)).length;
  return{n:ls.length,known,pct:ls.length?Math.round(known/ls.length*100):0};}

/* ---- what is due, across everything ---- */
function dueIds(cap=99){
  const t=TODAY();
  return Object.keys(LS.m).filter(id=>LBY[id]&&LS.m[id][3]<=t&&LS.m[id][0]>0)
    .sort((a,b)=>LS.m[a][3]-LS.m[b][3]).slice(0,cap);
}
function againIds(){return Object.keys(LS.m).filter(id=>LBY[id]&&LS.m[id][0]===0);}

/* ---- session building ----
   new material first, with up to two spaced reviews folded in so old ideas
   keep coming back. reviews are picked from earlier units only. */
const SESN=6;
/* The app asks for three lessons a day and says it takes about two minutes. A
   session that hands over eight questions breaks that promise on day one, so a
   sitting is what is left of today's goal — and "Keep going" at the end is how
   you do more, by choosing to. */
function sessionSize(){
  const left=typeof today==='function'?Math.max(0,GOAL-today().n):GOAL;
  return left>0?left:SESN;}
function buildSession(u,n){
  const want=Math.max(1,n||sessionSize());
  const pool=ALL.filter(l=>l.u===u&&l.route===(ROUTE||ROUTES[0].id));
  const fresh=pool.filter(l=>mstate(l.id)==='new').slice(0,want);
  const redo=pool.filter(l=>mstate(l.id)==='again').slice(0,want-fresh.length);
  let core=fresh.concat(redo);
  if(!core.length)core=pool.filter(l=>mstate(l.id)==='due').slice(0,want);
  if(!core.length)core=shuffle(pool).slice(0,want);
  const rev=dueIds(30).map(id=>LBY[id]).filter(l=>l.route!==(ROUTE||'')||l.u<u).slice(0,want>=5?2:1);
  const out=core.slice();
  rev.forEach((l,k)=>{const at=Math.min(out.length,2+k*3);out.splice(at,0,{...l,review:true});});
  return out;
}
function buildDrill(){
  const d=againIds().concat(dueIds(20)).filter((v,i,a)=>a.indexOf(v)===i);
  let items=d.map(id=>({...LBY[id],review:true}));
  if(items.length<4){
    const extra=shuffle(ALL.filter(l=>isKnown(l.id)&&!d.includes(l.id))).slice(0,8-items.length);
    items=items.concat(extra.map(l=>({...l,review:true})));}
  return shuffle(items).slice(0,8);
}
/* accuracy across everything answered, honestly reported */
const accuracy=()=>LS.n?Math.round(LS.ok/LS.n*100):null;
const totalKnown=()=>ALL.filter(l=>isKnown(l.id)).length;
const totalSolid=()=>ALL.filter(l=>mstate(l.id)==='solid').length;

/* ============ the daily rhythm: streak, goal, moments ============ */
const GOAL=3;                                  /* lessons that count as a day done */
/* NPT is UTC+5:45. On UTC dates a session at 11pm in Kathmandu is filed under
   the next day and one at 5am under the previous one, so a streak could break
   for someone who studied every evening. The market's day is the app's day. */
const NPT_OFFSET=5.75*3600e3;
const TODAY_S=()=>new Date(Date.now()+NPT_OFFSET).toISOString().slice(0,10);
const YDAY_S=()=>new Date(Date.now()+NPT_OFFSET-864e5).toISOString().slice(0,10);
function today(){
  if(!G.day||G.day.date!==TODAY_S())G.day={date:TODAY_S(),n:0,xp:0};
  return G.day;}
function dayTick(n,gain){const t=today(),was=t.n>=GOAL,first=t.n===0;
  t.n+=n;t.xp+=gain||0;
  if(first){                                   /* first activity today advances the streak */
    const y=YDAY_S();
    G.streak=G.lastVisit===t.date?Math.max(1,G.streak)      /* today already counted */
            :G.lastVisit===y?G.streak+1:1;
    G.lastVisit=t.date;}
  saveG();
  if(!was&&t.n>=GOAL)moment(G.streak>1?G.streak+' days in a row':'Daily goal done',GOAL+' lessons. Come back tomorrow.');
  paintStreak();}

/* a moment worth pausing for — used sparingly */
let momT=null;
function moment(title,sub){
  if(G.quiet)return;
  let el=$('moment');
  if(!el){el=document.createElement('div');el.id='moment';el.setAttribute('role','status');document.body.appendChild(el);}
  el.innerHTML=`<div class="mcard">${ic('flame',20)}<div><b>${esc(title)}</b><span class="hint">${esc(sub)}</span></div></div>`;
  el.classList.add('on');clearTimeout(momT);momT=setTimeout(()=>el.classList.remove('on'),2600);}

function paintStreak(){
  const e=$('streak');if(!e)return;
  const t=today();
  const pct=Math.min(100,t.n/GOAL*100);
  e.innerHTML=`${ring(pct,22)}<span class="sflame">${ic('flame',13)}</span><span class="num">${G.streak}</span>`;
  e.classList.toggle('cold',G.streak===0);
  e.title=`${G.streak}-day streak · ${t.n} of ${GOAL} lessons today`;
  e.setAttribute('aria-label',e.title);}

/* numbers that arrive rather than appear */
function countUp(el,to,dur=650,suffix=''){
  if(RM.matches||!el){if(el)el.textContent=to+suffix;return;}
  const from=0,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e)+suffix;
    if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);}
function animateStats(root){
  (root||document).querySelectorAll('[data-count]').forEach(el=>{

/* ---------- session ---------- */
let SESS=null;
function startSession(items,opt){
  if(!items.length){toast('Nothing due here');return;}
  SESS={q:items,i:0,right:0,wrong:[],opt,t0:Date.now()};
  go('session');
}
function vSession(){
  if(!SESS){go('learn');return;}
  const {q,i}=SESS;
  if(i>=q.length){return sessionEnd();}
  const L=q[i];
  APP().innerHTML=`<div class="sess">
    <div class="sbar"><button class="sx" id="squit" aria-label="Leave">${ic('close',18)}</button>
      <div class="pips">${q.map((_,k)=>`<i class="${k<i?'on':k===i?'now':''}"></i>`).join('')}</div>
      <span class="hint scount">${i+1}/${q.length}</span></div>
    <div class="scard">
      <div class="stag">${L.review?'<span class="pill n">Review</span>':''}<span class="kicker">${esc(L.t)}</span></div>
      <div id="qhost"></div>
    </div>
    <div class="sexp" id="sexp" hidden></div></div>`;
  $('squit').onclick=()=>{SESS=null;go('learn');};
  /* a primitive can fire more than once (a chart stays clickable, a timer lands
     after the user quits), so the hook is scoped to this question in this session */
  const mySess=SESS,myI=i;let taken=false;
  LESSONVIEW.resolve=(ok,expl)=>{
    if(taken||SESS!==mySess||SESS.i!==myI)return;
    taken=true;resolveQ(ok,expl);};
  try{
    const g=L.g();
    (PRIM[L.p]||PRIM.MCQ)($('qhost'),g);
  }catch(err){console.error('lesson',L.id,err);
    $('qhost').innerHTML='<p class="hint">This question could not be built from today’s data. Skipping it.</p>';
    setTimeout(()=>{if(SESS===mySess&&SESS.i===myI){SESS.i++;vSession();}},900);}
}
function resolveQ(ok,expl){
  const L=SESS.q[SESS.i];
  grade(L.id,ok);
  if(ok)SESS.right++;else SESS.wrong.push(L);
  const gain=ok?(L.review?4:10):0;
  if(gain)xp(gain,null);
  dayTick(1,gain);
  const e=$('sexp');
  e.hidden=false;
  e.className='sexp '+(ok?'good':'bad');
  e.innerHTML=`<div class="sehead">${ic(ok?'check':'info',18)}<b>${ok?'Right':'Not quite'}</b>${gain?`<span class="xpb">+${gain} XP</span>`:''}</div>
    <p>${expl||''}</p>
    <button class="btn" id="snext">${SESS.i+1>=SESS.q.length?'Finish':'Continue'}</button>`;
  const nb=$('snext');nb.focus();
  nb.onclick=()=>{SESS.i++;vSession();};
  e.scrollIntoView(RM.matches?{block:'nearest'}:{behavior:'smooth',block:'nearest'});
  document.onkeydown=ev=>{if(ev.key==='Enter'&&$('snext')){ev.preventDefault();$('snext').click();}};
}
function sessionEnd(){
  const {right,q,wrong,opt}=SESS;
  const pct=Math.round(right/q.length*100);
  const mins=Math.max(1,Math.round((Date.now()-SESS.t0)/60000));
  LS.ses++;saveL();
  if(totalKnown()>=3)award('learn3');
  if(totalKnown()>=NLESSON)award('learn6');
  const st=opt.unit!=null?unitStat(opt.unit):null;
  APP().innerHTML=`<div id="share"></div>
  ${wrong.length?`<div class="sechead"><h2>Coming back tomorrow</h2><span class="c">${wrong.length}</span></div>
    <div class="llist">${wrong.map(l=>`<div class="lrow s-again"><span class="ldot"></span><span class="lt">${esc(l.t)}</span>
      <span class="hint lp">${esc((RBY[l.route]||RBY.market).units[l.u].t)}</span></div>`).join('')}</div>
    <p class="hint" style="margin-top:10px">These come back sooner than the rest. That is the point of getting them wrong here.</p>`:''}
  ${st?`<div class="card pad" style="margin-top:16px"><b>${esc(RU()[opt.unit].t)}</b>
    <div class="bar a" style="margin-top:10px"><i style="width:${st.pct}%"></i></div>
    <p class="hint" style="margin-top:8px">${st.known} of ${st.n} learned in this unit.</p></div>`:''}
  <div class="lcta">
    ${st&&st.pct<100?`<button class="btn big" id="sagain">Keep going</button>`:''}
    <button class="btn ghost big" id="sdone">Back to the path</button>
    <button class="lnk big" id="sfind">Go and look at companies</button></div>`;
  shareCard($('share'),{kicker:'Bazaar · '+opt.title,
    head:right+' of '+q.length+' right',
    sub:pct===100?'Every question first time, in about '+mins+' minute'+(mins===1?'':'s')+'.'
      :`${totalKnown()} of ${NLESSON} lessons learned so far.`,
    stats:[[totalKnown(),'learned'],[totalSolid(),'solid'],[G.streak,'day streak']],
    copy:`Bazaar · ${opt.title} — ${right}/${q.length} right, ${totalKnown()}/${NLESSON} lessons learned, ${G.streak}-day streak.`});
  const a=$('sagain');if(a)a.onclick=()=>startSession(buildSession(opt.unit,SESN),opt);
  $('sdone').onclick=()=>{SESS=null;go('learn');};
  $('sfind').onclick=()=>{SESS=null;go('find');};
  document.onkeydown=null;
}

/* Every number in this app came from somewhere, and some of those places have
   known problems. Stating them is cheaper than being caught by them. */
function dataNotes(){
  const bad=EQ.filter(s=>{const r=riskOf(s);return r&&r.suspect;});
  const badDays=EQ.reduce((a,s)=>a+((riskOf(s)||{}).suspect||0),0);
  const jumps=Object.keys(D.imap||{}).map(k=>{const r=idxRisk(D.imap[k],0);return r?r.jumps:0;})
    .reduce((a,b)=>a+b,0);
  const stale=M.n_all-M.n_live;
  return[
   ['Prices are adjusted; the charts start in 2020',
    `Bonus issues, rights and dividends are all adjusted out, so a chart shows what your money did rather than what the quoted price did. The adjustment chain in the source database reaches ${M.adj_from}, but the bars loaded here begin ${M.win_from||'2020'}. Anything this app says about a company covers that window and no more.`],
   [`${bad.length} companies have days that could not have happened`,
    `${badDays} single-day moves in the loaded history are larger than the exchange's own limit allowed on that date — 10% until 20 April 2026, ${FACT.circuit}% since. A price cannot do that. They are corporate actions the adjustment missed, or resumptions after a halt. They are excluded from every swing figure and flagged on the company pages concerned.`],
   ['Small sector indices jump when a company joins or leaves',
    `The Others index moved 184% in a single day in 2003, Development Bank 72%, Trading 50%. An index of two or three companies does that on reconstitution. Sector risk is therefore measured over the last ten years, which is clean, and any remaining jump is dropped and counted${jumps?` (${jumps} in the current windows)`:''}.`],
   [`${stale} of ${M.n_all} securities did not trade on the last session`,
    'Their listed price is whatever someone last agreed to, which for some is months ago. They are kept out of every screen and every ranking, which is necessary and does bias any backward-looking number upward: the ones that stopped trading are not in the average.'],
   ['The floorsheet starts in 2024',
    `Broker-level data covers ${(M.trades/1e6).toFixed(1)} million trades from ${M.fs_from}. Anything about broker behaviour is about that period. There is no way to test it against a full market cycle.`],
   ['There is no fundamental data at all',
    'No earnings, book value, debt or P/E. When something in this app looks cheap, it means its price is low against its own past year. Whether the business is worth more than that is a question this data cannot reach.'],
   ['The score does not predict, and we tested it',
    `Ranked at ${BT.months} month-ends across ${BT.first.slice(0,4)}–${BT.last.slice(0,4)}: mean rank correlation with the next month's return ${BT.mean_ic} (t = ${BT.t_ic}). The test could only have detected an edge of about ${BT.mdes}% a month or larger, so it rules out a large effect rather than a small one. The script is in the project.`],
  ];}

      <div><span class="hint">You keep</span><b class="num ${net>=0?'up':'dn'}">Rs ${fmt(net,0)}</b></div></div>
      <p class="hint" style="margin-top:12px">${gross<=0?'No gain, so no tax, but the costs are still paid, twice.'
        :`<b>${bite.toFixed(0)}%</b> of your gain goes on costs and tax. ${bite>40?'At small gains the fees do most of the damage, which is the arithmetic behind trading less.':bite>20?'Normal for a gain this size.':'Costs matter less the larger the gain, and you do not control the gain.'}`}</p>`;};
  ['camt','cgain'].forEach(id=>$(id).oninput=calc);
  $('clong').onchange=calc;calc();
}

/* ================= YOU ================= */
/* One rule decides a call, and both the badge on the card and the summary use
   it. They did not: the card waited for a 0.25% gap before saying anything,
   while the summary counted every call from the moment it was made — so two
   calls placed this morning read "too early to tell" and "0 of 2" at once.
   A call also needs time to be about anything, hence the minimum. */
const CALL_MIN_DAYS=21;
function callAge(c){
  if(!c||!c.at||!/^\d{4}-\d\d-\d\d$/.test(c.at))return null;
  const d=Date.parse(c.at+'T00:00:00Z');
  return Number.isFinite(d)?Math.floor((Date.now()-d)/864e5):null;}
function callVerdict(c){
  const s=ALLBY[c.sym];
  const nowN=D.breadth.nepse[D.breadth.nepse.length-1];
  const moved=(s&&s.c&&c.px)?(s.c/c.px-1)*100:null;
  const bm=(c.bench&&nowN)?(nowN/c.bench-1)*100:null;
  const rel=(moved!=null&&bm!=null)?moved-bm:null;
  const days=callAge(c);
  if(rel==null)return{moved,bm,rel:null,right:null,days,why:'nodata'};
  if(days!=null&&days<CALL_MIN_DAYS)return{moved,bm,rel,right:null,days,why:'young'};
  if(Math.abs(rel)<0.25)return{moved,bm,rel,right:null,days,why:'level'};
  return{moved,bm,rel,right:c.dir==='up'?rel>0:rel<0,days,why:'judged'};}
const CALL_WAIT={nodata:'no price yet',young:'too early to tell',level:'level with the market',nodata2:''};
function vYou(){const L=lvl(),pr=(G.xp-LEVELS[L][0])/((nextAt()-LEVELS[L][0])||1)*100;
  APP().innerHTML=`<section class="hero"><span class="kicker">Level ${L+1}</span><h1>${lvlName()}</h1>
    <p class="mkt">${G.xp} XP · ${Math.max(0,nextAt()-G.xp)} to ${LEVELS[Math.min(L+1,LEVELS.length-1)][1]}</p>
    <div class="bar a" style="max-width:400px;margin-top:14px"><i style="width:${Math.min(100,pr).toFixed(0)}%"></i></div>
    <div class="statrow">${[[G.streak,'day streak'],[G.calls.length,'calls made'],[G.seen.length,'companies seen'],[totalKnown(),'of '+NLESSON+' lessons']].map(([v,k])=>`<div><div class="num sv" data-count="${v}">0</div><div class="hint">${k}</div></div>`).join('')}</div></section>
  <div class="sechead"><h2>Your calls</h2><span class="c">${G.calls.length}</span></div>
  ${G.calls.length?`<div class="stack">${G.calls.map((c,i)=>{const s=ALLBY[c.sym];
    const v=callVerdict(c);const {moved,bm,rel,right}=v;
    return`<div class="card pad callcard"><div class="cl1"><b>${esc(s?shortName(s):c.sym)}</b><span class="pill ${c.dir==='up'?'g':'r'}">${c.dir==='up'?'Beats market':'Lags market'}</span>
      ${right!=null?`<span class="pill ${right?'g':'r'}">${right?'ahead so far':'behind so far'}</span>`
        :`<span class="pill n">${v.why==='young'&&v.days!=null?`${CALL_MIN_DAYS-v.days} more day${CALL_MIN_DAYS-v.days===1?'':'s'} before this counts`:esc(CALL_WAIT[v.why]||'too early to tell')}</span>`}
      ${rel!=null?`<span class="num ${cls(rel)} clm">${pct(rel)}<small> vs NEPSE</small></span>`:''}<button class="lnk sm" data-delc="${i}">Remove</button></div>
      ${c.why?`<p class="cwhy">“${esc(c.why)}”</p>`:'<p class="hint">No reason recorded.</p>'}
      <p class="hint">Called at ${fmt(c.px,1)} on ${esc(c.at&&/^\d{4}-\d\d-\d\d$/.test(c.at)?fdate(Math.round(Date.parse(c.at+'T00:00:00Z')/864e5)):c.at)} · momentum ${c.rsi==null?'—':Math.round(c.rsi)} · beating ${c.rs==null?'—':Math.round(c.rs)}% of the market${c.preset?' · '+esc(c.preset):''}
        ${moved!=null?`<br>The company has done ${pct(moved)}; NEPSE has done ${bm==null?'—':pct(bm)}. What counts is the gap.`:''}</p></div>`;}).join('')}</div>`
   :`<div class="card empty"><b>No calls yet</b><p>Open any company and say whether you expect it to beat or lag the market. We freeze today’s numbers alongside it, so in a month you can see whether your reasoning was right.</p></div>`}
  ${(()=>{
    /* the same verdict the cards show, so the two can never disagree */
    const v=G.calls.map(callVerdict);
    const scored=v.filter(x=>x.right!==null).map(x=>x.right);
    const waiting=v.length-scored.length;
    if(scored.length<2)return G.calls.length?`<div class="card pad" style="margin-top:12px"><span class="kicker">How you are doing</span>
      <p class="lead2">Nothing to score yet. A call counts once it is <b>${CALL_MIN_DAYS} days</b> old and has actually moved against the market —
      ${waiting===1?'your one call is':`all ${waiting} of your calls are`} still inside that window.</p></div>`:'';
    const r=scored.filter(Boolean).length;
    return `<div class="card pad" style="margin-top:12px"><span class="kicker">How you are doing</span>
      <p class="lead2"><b class="num">${r} of ${scored.length}</b> calls are ahead of the market so far.${waiting?` ${waiting} more ${waiting===1?'is':'are'} too young to judge.`:''}
      ${scored.length<8?'Too few to mean anything yet, a coin gets about half right. Keep going.':
        r/scored.length>0.6?'Better than a coin so far. Still a small sample: twenty calls is where it starts to be informative.':
        r/scored.length<0.4?'Behind a coin so far. Worth reading back through your reasons for a pattern.':
        'About what a coin would do. That is the honest baseline to beat.'}</p></div>`;})()}
  <div class="sechead"><h2>Milestones</h2><span class="c">${G.badges.length} of ${BADGES.length}</span></div>
  <div class="badges">${BADGES.map(b=>{const got=G.badges.includes(b.id);return`<div class="badge${got?' got':''}">${got?ic('check',18):ic('dot',18)}<span class="t">${b.t}</span><span class="hint">${got?'Done':b.d}</span></div>`;}).join('')}</div>
  <label class="chk" style="margin-top:22px"><input type="checkbox" id="quiet" ${G.quiet?'checked':''}> Turn off XP pop-ups</label>
  <p class="foot">Data to ${esc(M.last_session)} · ${M.n_equity} tradable companies, ${M.n_all} listed securities · ${(M.trades/1e6).toFixed(1)} million trades since ${esc(M.fs_from)} · prices adjusted for bonus shares and rights. Nothing here is advice, and none of it predicts.<br><button class="lnk sm" id="gofacts" style="margin:10px 0 0">What is wrong with this data</button></p>`;
  const gf=$('gofacts');if(gf)gf.onclick=()=>go('facts');
  APP().querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{G.calls.splice(+b.dataset.delc,1);saveG();vYou();});
  $('quiet').onchange=e=>{G.quiet=e.target.checked;saveG();};}

/* ================= ROUTER ================= */
const VIEWS={find:vFind,refine:vRefine,sectors:vSectors,stock:vStock,list:vList,compare:vCompare,learn:vLearn,unit:vUnit,intro:vIntro,session:vSession,facts:vFacts,you:vYou};
/* The hash is the route. That buys the browser's own Back and Forward, a
   bookmarkable company page on a hosted build, and a Back button that returns
   where you came from instead of always to Find. */
const hashFor=(v,sym)=>'#/'+v+(v==='stock'&&sym?'/'+encodeURIComponent(sym):'');
function parseHash(){
  const m=/^#\/([a-z]+)(?:\/(.+))?$/.exec(location.hash||'');
  if(!m||!VIEWS[m[1]])return null;
  return{v:m[1],sym:m[2]?decodeURIComponent(m[2]):null};}
let HASHLOCK=false;
function paintView(v,sym){const app=APP();
  const run=()=>{try{VIEW=v;if(sym)SYM=sym;render();window.scrollTo(RM.matches?{top:0}:{top:0,behavior:'smooth'});
      const h=app.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
    }finally{app.classList.remove('leaving');}};
  if(RM.matches){run();return;}
  app.classList.add('leaving');setTimeout(run,90);}
function go(v,sym){
  if(sym)SYM=sym;                 /* set before any paint defers, so callers can read it */
  const h=hashFor(v,sym);
  if((location.hash||'')===h){paintView(v,sym);return;}
  HASHLOCK=true;
  try{location.hash=h;}catch(e){}
  setTimeout(()=>{HASHLOCK=false;},0);
  paintView(v,sym);}
/* one step back, and Find as the floor so Back never leaves the app on the
   first screen someone opened */
function goBack(fallback){
  if(history.length>1&&parseHash()){history.back();
    setTimeout(()=>{if(!parseHash())go(fallback||'find');},120);return;}
  go(fallback||'find');}
addEventListener('hashchange',()=>{
  if(HASHLOCK)return;
  const r=parseHash();
  paintView(r?r.v:'find',r&&r.sym);});
function render(){document.body.classList.toggle('focus',VIEW==='session');
  document.body.classList.toggle('refining',VIEW==='refine');document.querySelectorAll('.tab').forEach(t=>{const v=t.dataset.v;
    const on=v===VIEW||(VIEW==='stock'&&v==='find')||(VIEW==='compare'&&v==='list')||(VIEW==='refine'||VIEW==='sectors')&&v==='find'||(VIEW==='unit'||VIEW==='session'||VIEW==='facts'||VIEW==='intro')&&v==='learn';
    t.classList.toggle('on',on);t.setAttribute('aria-current',on?'page':'false');});
  try{(VIEWS[VIEW]||vFind)();paintHeader();}
  catch(err){console.error(err);
    document.body.classList.remove('focus');
    /* A screen failing to draw is usually a screen, not your data. Offer the
       cheap recoveries first, a copy of everything second, and erasing it all
       last — behind a confirmation. */
    APP().innerHTML=`<div class="card empty"><b>This screen could not be drawn</b>
      <p>Your saved work is untouched. Try again, or go back to the list of companies.</p>
      <button class="btn" id="rtry">Try again</button>
      <button class="lnk" id="rhome">Back to Find</button>
      <p class="hint" style="margin-top:14px">If it keeps happening, take a copy of your saved work first —
        it is the only copy, and it lives in this browser.</p>
      <button class="lnk" id="rexp">Copy my saved work</button>
      <button class="lnk" id="rst">Erase everything and start again</button></div>`;
    const t=$('rtry');if(t)t.onclick=()=>{try{render();}catch(e){}};
    const hm=$('rhome');if(hm)hm.onclick=()=>go('find');
    const ex=$('rexp');if(ex)ex.onclick=exportState;
    const r=$('rst');if(r)r.onclick=()=>{
      if(!confirm('This deletes your watchlist, calls, saved screens and every lesson you have learned. There is no undo. Continue?'))return;
      try{['bazaar:state','bazaar:learn','bazaar:theme'].forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};}}
/* everything this browser is holding for you, as one pasteable block */
async function exportState(){
  const blob={app:'bazaar',at:new Date().toISOString(),
    state:localStorage.getItem('bazaar:state'),learn:localStorage.getItem('bazaar:learn')};
  const txt=JSON.stringify(blob);
  try{await navigator.clipboard.writeText(txt);toast('Copied — paste it somewhere safe');}
  catch(e){
    const ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:fixed;inset:auto 12px 12px 12px;height:120px;z-index:99';
    document.body.appendChild(ta);ta.select();
    toast('Copy the text at the bottom of the screen');
    setTimeout(()=>ta.remove(),20000);}}
function paintHeader(){paintStreak();animateStats(APP());}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){go(t.dataset.v);return;}
  const w=e.target.closest('[data-watch]');if(w){e.preventDefault();e.stopPropagation();
    const sym=w.dataset.watch;toggleWatch(sym);const on=G.watch.includes(sym);
    document.querySelectorAll(`[data-watch="${CSS.escape(sym)}"]`).forEach(el=>{
      el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));
      if(el.dataset.watchlabel!==undefined)el.textContent=on?'Saved to your list':'Save to list';});
    if(VIEW==='list')vList();return;}
  const p=e.target.closest('[data-preset]');if(p){const P=PRESETS.find(x=>x.id===p.dataset.preset);if(P){
    applyPreset(P);PAGE=30;saveScreen();
    if(!G.presets.includes(P.id)){G.presets.push(P.id);saveG();if(G.presets.length>=PRESETS.length)award('all_preset');}go('find');}return;}
  const gs=e.target.closest('[data-gosec]');if(gs){e.preventDefault();e.stopPropagation();
    SECPICK=gs.dataset.gosec;SECWIN=90;go('sectors');return;}
  const sc=e.target.closest('[data-sym]');if(sc){go('stock',sc.dataset.sym);return;}
  const q=e.target.closest('[data-q]');if(q){e.preventDefault();showPop(q);return;}
  if(!e.target.closest('#pop'))hidePop();});
const pop=()=>$('pop');
function showPop(el){
  const k=el.dataset.q||'';
  /* one key shape carries a company instead of a term: the provenance note is
     different for every security, and pre-baking 275 glossary entries to avoid
     one branch would be the wrong trade */
  const g=k.slice(0,5)==='prov:'
    ?(()=>{const pv=typeof fProv==='function'?fProv(ALLBY[k.slice(5)]):null;
           return pv?['Where this number comes from',pv.say]:null;})()
    :GLOSS[k];
  if(!g)return;const p=pop();p.innerHTML='<b>'+esc(g[0])+'</b>'+esc(g[1]);p.classList.add('on');
  const r=el.getBoundingClientRect();p.style.left=Math.max(10,Math.min(r.left-30,innerWidth-p.offsetWidth-10))+'px';
  p.style.top=(r.bottom+8+p.offsetHeight>innerHeight?Math.max(10,r.top-p.offsetHeight-8):r.bottom+8)+'px';}
function hidePop(){pop().classList.remove('on');}
document.addEventListener('mouseover',e=>{const q=e.target.closest('[data-q]');if(q)showPop(q);});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-q]'))hidePop();});
document.addEventListener('focusin',e=>{const q=e.target.closest('[data-q]');q?showPop(q):hidePop();});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;

});
function toggleTheme(){if(typeof chartColoursReset==='function')chartColoursReset();const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('bazaar:theme',next)}catch(e){}

try{const t=localStorage.getItem('bazaar:theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
$('themeb').onclick=toggleTheme;
$('streak').onclick=()=>go('learn');
let rz;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(VIEW==='stock'&&CH)CH.draw();});});
/* focusing the first control forces a full layout of the page that was painted
   one statement earlier — 36ms on a throttled phone, under a blurred backdrop

function onboard(){if(G.onboarded)return;
  const steps=[
   ['Welcome to Bazaar','A calmer way to read the Nepal Stock Exchange. Built from '+M.n_equity+
     ' tradable companies, prices adjusted for bonus shares and rights, and '+(M.trades/1e6).toFixed(0)+

   ['Nothing here predicts','We tested it. Rank every tradable company at '+BT.months+' month-ends, then check what happened next: nothing. '+
     'The test script is in the app if you want to run it yourself. Use this to shorten a list, not to pick from one.']];
  let i=0,prevFocus=document.activeElement;const ov=document.createElement('div');ov.id='onb';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Welcome');

    const b=ov.querySelector('#obn');b.onclick=()=>{if(i<steps.length-1){i++;paint();}else done();};b.focus();};
