const LQ=()=>EQ.filter(s=>(s.turn20||0)>4e6&&SER[s.sym]&&SER[s.sym].c.length>=250);
const one=()=>LQ()[Math.floor(Math.random()*LQ().length)]||EQ[0];
const some=n=>shuffle(LQ()).slice(0,n);
const nm=s=>shortName(s);
const RSN=x=>x==null?'—':Math.round(x);
/* the worst the index has actually done, computed rather than remembered */
let _dd=null;
function DD_NEPSE(){
  if(_dd!=null)return _dd;
  const c=NEPSE.c;let pk=-1,mx=0;
  for(let i=0;i<c.length;i++){if(c[i]>pk)pk=c[i];const d=(1-c[i]/pk)*100;if(d>mx)mx=d;}
  return _dd=mx||35;}
const BT=D.bt||{months:70,mean_ic:-0.0006,t_ic:-0.02,pct_positive:55.7,mean_q5_q1:0.756,t_spread:0.88,mdes:1.71,ci_spread:[-0.92,2.43],ci_ic:[-0.068,0.067],first:'2017-09-26',last:'2026-08-31',years:[]};
const BTYRS=()=>(BT.years&&BT.years.length)?BT.years.length:9;
/* NEPSE facts, verified Sept 2026 — see FACTS panel in the app */
const FACT={week:'Monday to Friday',hours:'11:00 to 15:00',pre:'10:30 to 10:45',settle:'T+2',
  circuit:15,circuitFrom:'20 April 2026',circuitWas:10,preband:5,halt5:'15 minutes',halt8:'the rest of the day',
  comm:[[50000,0.36],[500000,0.33],[2000000,0.31],[10000000,0.27],[Infinity,0.24]],commMin:10,
  sebon:0.015,dp:25,cgtLong:7.5,cgtShort:10,cgtFrom:'17 July 2026',
  face:100,mfFace:10,demat:100,mero:50,sectors:13,base:'12 February 1994',
  /* the beginner path, verified September 2026 */
  dematOpen:'50 to 150',meroReg:50,boidDays:'one to three working days',
  ipoMin:10,ipoBookMin:50,bookDiscount:10,
  allotDays:20,listMonths:2};
function commPct(v){for(const [cap,p] of FACT.comm)if(v<=cap)return p;return 0.24;}
function costBuy(v){return Math.max(FACT.commMin,v*commPct(v)/100)+v*FACT.sebon/100+FACT.dp;}
function costSell(v){return Math.max(FACT.commMin,v*commPct(v)/100)+v*FACT.sebon/100+FACT.dp;}

 {id:'d2',t:'What it costs to hold an account',p:'NUM',g:()=>({q:`Demat maintenance is Rs ${FACT.demat} a year and MeroShare is Rs ${FACT.mero} a year. What do you pay annually just to have an account?`,
   a:FACT.demat+FACT.mero,tol:1,unit:'Rs',explain:'Rs 150 a year, set by CDSC and the same at every depository participant. Small, but it is charged whether you trade or not.'})},
 {id:'d3',t:'T+2 settlement',p:'CLASSIFY',g:()=>({q:'You buy shares on Monday. When does each of these happen?',
   buckets:['Monday','Tuesday','Wednesday'],items:[
    {t:'The trade is executed',bucket:'Monday'},{t:'You pay for the shares',bucket:'Tuesday'},
    {t:'The shares arrive in your Demat account',bucket:'Wednesday'},{t:'You can sell them',bucket:'Wednesday'}],
   explain:'T+2 means settlement two trading days after the trade. It is why you cannot buy and sell the same shares on the same day in Nepal.'})},
 {id:'d4',t:'Why you cannot day-trade here',p:'MCQ',g:()=>({q:'Why is intraday trading impossible on NEPSE?',
   opts:['Shares only reach your account on T+2, so you cannot sell before then','Brokers may not accept a same-day buy and sell order','SEBON bans buying and selling one stock inside a week','The market is only open for a few hours, which is far too short'],
   a:'Shares only reach your account on T+2, so you cannot sell before then',
   explain:'Delivery-based settlement forces a minimum two-day hold. Strategies imported from markets with intraday settlement simply do not work here.'})},
 {id:'d5',t:'Brokerage on a small trade',p:'NUM',g:()=>({q:`You buy Rs 40,000 of shares. Brokerage is ${FACT.comm[0][1]}% at this size. What is the commission in rupees?`,
   a:40000*0.0036,tol:3,unit:'Rs',explain:`Commission falls as trade size rises: ${FACT.comm.slice(0,4).map(c=>c[1]+'%').join(', ')} and 0.24% above a crore. There is a minimum of Rs ${FACT.commMin}.`})},
 {id:'d6',t:'The full round trip',p:'NUM',g:()=>{const v=200000,sell=240000;const c=costBuy(v)+costSell(sell);
   return{q:`You buy Rs 2,00,000 and later sell for Rs 2,40,000. Total brokerage, SEBON fee and DP charges on both legs — how many rupees?`,
   a:c,tol:c*0.12,unit:'Rs',hint:`Brokerage ${commPct(v)}% each way, SEBON ${FACT.sebon}%, DP Rs ${FACT.dp} per scrip.`,
   explain:`About Rs ${Math.round(c)}, or ${(c/40000*100).toFixed(1)}% of your Rs 40,000 gain. Note the DP charge — sources disagree on whether it applies to one leg or both, so check your own contract note.`};}},
 {id:'d7',t:'Capital gains tax',p:'MCQ',g:()=>({q:'You are a resident individual. You sell shares held for eight months at a profit. What rate applies?',
   opts:[`${FACT.cgtShort}%`,`${FACT.cgtLong}%`,'5%','No tax on share gains'],a:`${FACT.cgtShort}%`,
   explain:`Held 365 days or less: ${FACT.cgtShort}%. Held longer: ${FACT.cgtLong}%. These rose from 7.5% and 5% on ${FACT.cgtFrom}. Most guides online still quote the old numbers. It is withheld at settlement and is a final tax for individuals.`})},
 {id:'d8',t:'Holding a year changes the bill',p:'NUM',g:()=>({q:`On a Rs 1,00,000 gain, how many rupees do you save by holding more than a year instead of less?`,
   a:100000*(FACT.cgtShort-FACT.cgtLong)/100,tol:200,unit:'Rs',
   explain:`${FACT.cgtShort}% versus ${FACT.cgtLong}% is Rs 2,500 on a lakh of gain. Worth knowing, but never a reason on its own to hold something you would otherwise sell.`})},
 {id:'d9',t:'Costs against gain, not turnover',p:'SLIDER',g:()=>({q:'Move the slider to see how costs scale against your profit.',
   label:'Your gain on a Rs 1,00,000 position',min:2,max:60,step:2,start:10,fmtv:v=>v+'%',
   live:v=>{const g1=100000*v/100,c=costBuy(100000)+costSell(100000+g1);
     return `Costs of about <b>Rs ${Math.round(c)}</b> against a gain of Rs ${Math.round(g1)}. That is <b class="${c/g1>0.15?'dn':'up'}">${(c/g1*100).toFixed(1)}%</b> of your profit gone before tax.`;},
   opts:['Costs matter most when your gain is small','Costs are a fixed percentage of profit','Costs only matter for large trades'],
   a:'Costs matter most when your gain is small',
   explain:'Frequent small trades give away most of their profit to fees. This is the arithmetic behind "trade less".'})},
 {id:'d10',t:'What a contract note shows',p:'SPOT',g:()=>({q:'Which of these will not appear on your NEPSE contract note?',
   claims:[{t:'Broker commission, itemised in rupees'},{t:'The SEBON regulatory fee on the trade'},{t:'The DP charge for the transfer'},{t:'The spread you paid between bid and ask',bad:1}],
   explain:'The spread is a real cost and it is never itemised. It is buried in the price you got. That is exactly why it is worth understanding.'})}]},
];

/*==== L_curr2.js ====*/
/* ============ curriculum part 2: units 4-7 ============ */
UNITS.push(

{u:4,t:'Reading a chart',d:'What the line says, and what it hides',L:[
 {id:'e1',t:'One point, one day',p:'MCQ',g:()=>({q:'On a daily price chart, what does a single point on the line represent?',
   opts:['The closing price of that day','The average price of that day','The highest price of that day','The price right now'],
   a:'The closing price of that day',
   explain:'Everything here is built on closing prices. Intraday the stock may have travelled far above and below that point, the close is just where it stopped.'})},
 {id:'e2',t:'Find the peak',p:'CHART',g:()=>{const s=one();return{
   q:`Click the day ${nm(s)} closed highest in the last 90 sessions.`,sym:s.sym,range:90,metric:'c',dir:'max',
   explain:'Peaks are obvious afterwards and invisible at the time. Nobody rang a bell on that day.'};}},
 {id:'e3',t:'Find the floor',p:'CHART',g:()=>{const s=one();return{
   q:`Click the day ${nm(s)} closed lowest in the last 90 sessions.`,sym:s.sym,range:90,metric:'c',dir:'min',
   explain:'The low is equally clear now and was equally unclear then. Both facts matter when someone tells you they buy the bottom.'};}},
 {id:'e4',t:'The busiest day',p:'CHART',g:()=>{const s=one();return{
   q:`Click the day ${nm(s)} traded the most shares in the last 90 sessions.`,sym:s.sym,range:90,metric:'v',dir:'max',
   explain:'Volume spikes mark days when a lot of people changed their minds at once — results, news, or a large holder moving. The price move alone would not have told you.'};}},
 {id:'e5',t:'Where in the year',p:'NUM',g:()=>{const s=one();return{
   q:`${nm(s)} has traded between Rs ${fmt(s.lo52,0)} and Rs ${fmt(s.hi52,0)} over the past year and now sits at Rs ${fmt(s.c,1)}. How far up that range is it, in percent?`,
   a:s.rangepos,tol:4,unit:'%',hint:'(now − low) ÷ (high − low) × 100',
   explain:'0% means at the yearly low, 100% at the yearly high. It is one of the fastest ways to see whether you are buying something that has already run.'};}},
 {id:'e6',t:'The same data, two stories',p:'SLIDER',g:()=>{const s=one();const S1=SER[s.sym];
   return{q:`Change the window on ${nm(s)}. Watch the return change.`,
   label:'Days shown',min:20,max:Math.min(750,S1.c.length),step:10,start:60,fmtv:v=>v+' days',
   live:v=>{const n=Math.min(v,S1.c.length),a=S1.c[S1.c.length-n],b=S1.c[S1.c.length-1];
     const r=(b/a-1)*100;return `Over the last <b>${n}</b> sessions ${nm(s)} is <b class="${cls(r)}">${pct(r)}</b>.`;},
   opts:['The window you choose decides the story','A longer window is always more honest','A shorter window is always more current'],
   a:'The window you choose decides the story',
   explain:'Anyone showing you a return has chosen a start date. Ask what happens if you move it. If the answer changes sign, the claim was about the window.'};}},
 {id:'e7',t:'Which one moved more',p:'TWOCHART',g:()=>{const p=some(2);
   const [a,b]=Math.abs(p[0].r3m||0)>Math.abs(p[1].r3m||0)?p:[p[1],p[0]];
   return{q:'One of these moved further over the last three months. Which?',a:{sym:a.sym},b:{sym:b.sym},range:90,
   explain:`it moved ${pct(a.r3m)} against ${pct(b.r3m)} for the other. Charts are auto-scaled — each fills its own box, so a gentle drift and a violent move can look identical. Always read the axis.`};}},
 {id:'e8',t:'The axis lies by omission',p:'SPOT',g:()=>({q:'Which of these makes a chart misleading rather than merely different?',
   claims:[{t:'Starting the price axis at a number well above zero',bad:1},
     {t:'Showing three months of history instead of a full year'},{t:'Using a plain line instead of candlesticks'},{t:'Marking the 20-day average on top of it'}],
   explain:'A truncated axis turns a 2% wobble into a mountain range. The other three change what you see; a cut axis changes how big it feels. Charts in this app always label the axis so you can check.'})},
 {id:'e9',t:'After a big run',p:'PREDICT',g:()=>{const c=shuffle(LQ().filter(s=>(s.r3m||0)>15));const s=c[0]||one();const S1=SER[s.sym];
   return{q:`${nm(s)} is up ${pct(s.r3m)} over three months. Before you look — what did the next month actually do?`,
   opts:['I cannot tell from this','Kept rising','Fell back'],a:'I cannot tell from this',
   reveal:()=>`<div class="lw"><canvas></canvas></div><p class="hint">The last year of ${esc(nm(s))}, index overlaid.</p>`,
   chart:{sym:s.sym,range:250,nepse:true},
   explain:`A past run tells you what happened. What follows is a separate question, and this chart cannot answer it. Across ${BT.months} month-ends between ${BT.first.slice(0,4)} and ${BT.last.slice(0,4)}, the best-scoring fifth of companies beat the worst-scoring fifth by ${BT.mean_q5_q1}% a month, with a t-statistic of ${BT.t_spread} — well inside what chance produces.`};}}]},

{u:5,t:'The market as a whole',d:'The index, breadth, and how much of a move is just the tide',L:[
 {id:'f1',t:'What the index is',p:'MCQ',g:()=>({q:'What does the NEPSE index actually measure?',
   opts:['The combined market value of listed companies, against a base date','The average share price of all the companies listed on it',
     'The total number of shares that changed hands during today','The combined profit reported by all the listed companies'],
   a:'The combined market value of listed companies, against a base date',
   explain:`It is capitalisation-weighted and set to 100 on ${FACT.base}. A Rs 5 move in a giant bank shifts it far more than a Rs 50 move in a small hydro company.`})},
 {id:'f2',t:'Weighting means big names dominate',p:'SPOT',g:()=>({q:'Which conclusion does not follow from a capitalisation-weighted index?',
   claims:[{t:'A few large companies drive most of the daily move'},
     {t:'The index can rise while most listed companies fall'},
     {t:'If the index is up 1%, the average stock is up about 1%',bad:1},
     {t:'A small company doubling barely moves the index'}],
   explain:'The index is a weighted average. Breadth is a headcount, and the two disagree often.'})},
 {id:'f3',t:'Breadth versus the index',p:'PREDICT',g:()=>{const B=D.breadth,n=B.d.length-1;
   const adv=B.adv[n],dec=B.dec[n],ix=((B.nepse[n]/B.nepse[n-1])-1)*100;
   const sh=adv/((adv+dec)||1);
   return{q:`On the last session the index moved ${pct(ix)}. What share of the companies that traded went up?`,
   opts:['Roughly a third or fewer','About half','Roughly two-thirds','Almost all of them'],
   a:sh<0.42?'Roughly a third or fewer':sh<0.58?'About half':sh<0.85?'Roughly two-thirds':'Almost all of them',
   reveal:()=>`<p class="reveal-n"><b>${adv}</b> rose, <b>${dec}</b> fell.</p>`,
   explain:`${adv} advancing against ${dec} declining. Direction is easy; participation is what tells you whether a move is broad or a handful of heavyweights.`};}},
 {id:'f4',t:'Above the average',p:'SLIDER',g:()=>{const B=D.breadth,n=B.d.length-1;
   return{q:'Breadth is usually read as the share of stocks trading above a moving average. Move the slider to compare windows.',
   label:'Average length',min:1,max:3,step:1,start:1,fmtv:v=>(v===1?20:v===2?50:200)+'-day',
   live:v=>{const k=v===1?'a20':v===2?'a50':'a200';const val=B[k][n];v=v===1?20:v===2?50:200;
     return `<b>${fmt(val,1)}%</b> of stocks are above their ${v}-day average today. ${val<25?'<span class="dn">That is a market where almost nothing is working.</span>':val>60?'<span class="up">Broad participation.</span>':''}`;},
   opts:['The longer the average, the slower breadth changes','Longer averages give higher readings','All three are the same measure'],
   a:'The longer the average, the slower breadth changes',
   explain:`Today: ${fmt(B.a20[n],1)}% above the 20-day, ${fmt(B.a50[n],1)}% above the 50-day, ${fmt(B.a200[n],1)}% above the 200-day. The 20-day flips within weeks; the 200-day takes quarters.`};}},
 {id:'f5',t:'Beating the market',p:'NUM',g:()=>{const s=one();
   return{q:`${nm(s)} returned ${pct(s.r1y)} over the last year. The NEPSE index returned ${pct(M.bench.r1y)}. By how many percentage points did the stock beat the index? A negative number is fine.`,
   a:(s.r1y||0)-M.bench.r1y,tol:1.2,unit:'points',
   explain:'This difference is what "relative strength" means. A stock up 8% in a market up 20% has not done well. It has lost ground to the tide.'};}},
 {id:'f6',t:'Sectors of NEPSE',p:'PAIRS',g:()=>({q:'Match each sector to what its companies actually do.',
   pairs:[['Commercial Banks','Take deposits and lend, the largest group by market value'],
     ['Microfinance','Small loans, mostly rural, tightly regulated margins'],
     ['Hydro Power','Build and run river power plants, revenue tied to PPAs'],
     ['Life Insurance','Long-term policies, income from premiums and investments']],
   explain:`NEPSE has ${FACT.sectors} sector sub-indices. Sector is the single biggest thing two stocks can have in common — microfinance names tend to move together whatever their individual merits.`})},
 {id:'f7',t:'Which sector is this',p:'CLASSIFY',g:()=>{const pick=n=>shuffle(EQ.filter(s=>s.sector===n)).slice(0,1)[0];
   const want=['Commercial Banks','Hydro Power','Microfinance','Life Insurance'];
   const items=want.map(w=>{const s=pick(w);return s?{t:nm(s),sub:'Rs '+fmt(s.c,0)+' · '+cr(s.turn20)+' a day',bucket:w}:null;}).filter(Boolean);
   return{q:'Which sector does each company belong to?',buckets:want,items:shuffle(items),
   explain:'Company names in Nepal usually give the sector away, but not always, and "Development Bank" and "Finance" are separate categories from "Commercial Banks" with different rules and different sizes.'};}},
 {id:'f8',t:'Count is not weight',p:'RANK',g:()=>{const cnt={};EQ.forEach(s=>{cnt[s.sector]=(cnt[s.sector]||0)+1;});
   const items=['Hydro Power','Commercial Banks','Microfinance','Life Insurance'].map(k=>({t:k,v:cnt[k]||0,lab:(cnt[k]||0)+' listed'}));
   return{q:'Put these sectors in order. Most listed companies first.',items,
   explain:'Hydro has the most listings by a distance, but commercial banks carry far more market value. Number of companies and weight in the index are different things.'};}},
 {id:'f9',t:'The tide, honestly',p:'MCQ',g:()=>({q:'Your stock is up 12% this quarter and the index is up 11%. What is the most honest reading?',
   opts:['Almost all of that was the market','The stock outperformed strongly','The stock is a good company','The stock has momentum'],
   a:'Almost all of that was the market',
   explain:'One point of excess return over three months is noise. Most of what feels like skill in a rising market is simply exposure to it.'})}]},

{u:6,t:'Corporate actions',d:'Why a price can drop 20% with nothing wrong',L:[
 {id:'g1',t:'A bonus share is not free money',p:'MCQ',g:()=>({q:'A company issues a 1:5 bonus, one free share for every five held. What happens to the value of your holding on the ex-date, ignoring market movement?',
   opts:['It stays the same','It rises 20%','It falls 20%','It depends on the dividend'],a:'It stays the same',
   explain:'You hold 20% more shares and the price adjusts by 5/6, which is a fall of about 17%, not 20%. Multiply it out: 120 shares at 83.3% of the old price is exactly what you had. The company did not become more valuable by relabelling its reserves. What changes is liquidity and the optics of a lower price.'})},
 {id:'g2',t:'The adjusted price',p:'NUM',g:()=>({q:'A share trades at Rs 600 and goes ex-bonus on a 1:4 issue (one free share per four held). Roughly what is the theoretical opening price?',
   a:480,tol:12,unit:'Rs',hint:'You end up with 5 shares for every 4 you had.',
   explain:'600 × 4 ÷ 5 = 480. On the screen this looks like a 20% crash. In your account nothing was lost. Any chart that does not adjust for this will show a fall that never happened.'})},
 {id:'g3',t:'Spot the adjustment',p:'CLASSIFY',g:()=>{const k=shuffle(Object.keys(LESSON))[0];const L=LESSON[k];
   const evs=L.events.slice(0,3).map(e=>({t:fdate(L.d[e[0]])+' — raw price fell '+fmt(Math.abs(e[1]),1)+'%',
     sub:'the adjusted series does not show this fall',bucket:'Corporate action'}));
   const S1=SER[k];const real=[];
   for(let i=S1.c.length-260;i<S1.c.length&&real.length<2;i++){const r=(S1.c[i]/S1.c[i-1]-1)*100;
     if(r<-3.5)real.push({t:fdate(S1.d[i])+' — price fell '+fmt(Math.abs(r),1)+'%',sub:'present in the adjusted series too',bucket:'A real fall'});}
   return{q:`${k}: which of these price drops were real?`,buckets:['A real fall','Corporate action'],
   items:shuffle(evs.concat(real)),
   explain:`Every drop that appears in the raw series but vanishes from the adjusted one is a corporate action. This is the test this app runs on all ${M.n_all} securities. Without it, a bonus issue looks like a crash.`};}},
 {id:'g4',t:'The vocabulary',p:'PAIRS',g:()=>({q:'Match each corporate action to what it does.',
   pairs:[['Bonus share','Free shares from reserves; price adjusts down, value unchanged'],
     ['Cash dividend','Cash paid per share; price falls by roughly the amount paid'],
     ['Rights issue','Chance to buy new shares at a set price, usually below market'],
     ['Book close','The cut-off date deciding who is on the register for the action']],
   explain:'All four move the price for reasons that have nothing to do with the market changing its mind about the company.'})},
 {id:'g5',t:'Rights issue arithmetic',p:'NUM',g:()=>({q:'You bought 100 shares at Rs 400 each. The company now offers a 1:1 rights issue at the face value of Rs 100, and you take it up. What is your average cost per share afterwards?',
   a:250,tol:10,unit:'Rs',hint:'Total spent ÷ total shares.',
   explain:'You paid Rs 40,000 for the first 100 and Rs 10,000 for the next 100 — Rs 50,000 for 200 shares, so Rs 250 each. The market price will adjust towards this level, which is why a rights issue is not free money either.'})},
 {id:'g6',t:'Dividends are quoted on face value',p:'NUM',g:()=>({
   q:`A company declares a 15% cash dividend. Face value is Rs ${FACT.face}. How many rupees per share is that?`,
   a:15,tol:0.5,unit:'Rs',
   explain:`In Nepal a dividend percentage is always on face value, never on market price. So a 15% dividend is Rs 15 a share. On a share trading at Rs 600 that is a yield of 2.5%, not 15%.`})},
 {id:'g7',t:'Yield, done properly',p:'NUM',g:()=>{const px=[280,340,420,505,640,880][Math.floor(Math.random()*6)],d=12;
   return{q:`A company trades at Rs ${px} and declares a ${d}% dividend on Rs ${FACT.face} face value. What is the dividend yield, in percent?`,
   a:d/px*100,tol:0.3,unit:'%',hint:'Rupees per share \u00f7 market price \u00d7 100',
   explain:'This is the single most common mistake in Nepali market conversation — treating the declared percentage as the yield. On a Rs 500 share a 12% dividend yields 2.4%.'};}},
 {id:'g8',t:'The day it goes ex',p:'SPOT',g:()=>({q:'A stock opens 18% lower on the day after book close. Three of these should be checked before the fourth. Which one comes last?',
   claims:[{t:'A bonus issue has gone ex'},{t:'A large cash dividend has gone ex'},
     {t:'The company is in serious trouble',bad:1},{t:'A rights issue has gone ex'}],
   explain:'Check the corporate action calendar before the news. Most large single-day drops in Nepal are mechanical. Assume trouble only after you have ruled out arithmetic.'})},
 {id:'g9',t:'Why adjustment matters to you',p:'MCQ',g:()=>({q:'Why does an unadjusted chart matter for a long-term holder?',
   opts:['Your return looks far worse than it was','Your return looks far better than it was',
     'It makes no difference to returns','It only affects short-term traders'],
   a:'Your return looks far worse than it was',
   explain:`Every bonus issue lops a chunk off the historical price line. A company that issued five bonuses over a decade can show a flat unadjusted chart while having doubled your money. Every price in this app is adjusted the same way. The charts load from ${M.win_from?M.win_from.slice(0,4):'2020'}, which is a limit worth remembering.`})}]},

{u:7,t:'Trend and momentum',d:'Averages, RSI, and what they can and cannot say',L:[
 {id:'h1',t:'What a moving average is',p:'MCQ',g:()=>({q:'What is the 50-day moving average?',
   opts:['The average of the last 50 closing prices, recalculated each day',
     'The average price over the last 50 calendar days including holidays',
     'A prediction of the price 50 days ahead','The midpoint of the 50-day high and low'],
   a:'The average of the last 50 closing prices, recalculated each day',
   explain:'It is a smoothing device, nothing more. It always lags, by construction. Half the window, roughly. It cannot lead.'})},
 {id:'h2',t:'Read the three averages',p:'NUM',g:()=>{const s=shuffle(LQ().filter(x=>x.sma200))[0]||one();
   return{q:`${nm(s)} closed at Rs ${fmt(s.c,1)} with a 200-day average of Rs ${fmt(s.sma200,1)}. How far above or below the average is the price, in percent?`,
   a:(s.c/s.sma200-1)*100,tol:1,unit:'%',
   explain:'Distance from the long average is a rough gauge of how stretched a move is. Very large distances in either direction tend not to persist, but "tend not to" is not "will not".'};}},
 {id:'h3',t:'Stacking',p:'RANK',g:()=>{const s=shuffle(LQ().filter(x=>x.sma200&&x.sma50&&x.sma20&&x.s_trend>70))[0]
     ||shuffle(LQ().filter(x=>x.sma200))[0]||one();
   return{q:`Put these in order for ${nm(s)}, highest value first.`,
   items:[{t:'Price today',v:s.c,lab:'Rs '+fmt(s.c,1)},{t:'20-day average',v:s.sma20,lab:'Rs '+fmt(s.sma20,1)},
     {t:'50-day average',v:s.sma50,lab:'Rs '+fmt(s.sma50,1)},{t:'200-day average',v:s.sma200,lab:'Rs '+fmt(s.sma200,1)}],
   explain:'When price sits above the short average, which sits above the medium, which sits above the long, chartists call it a stacked uptrend. It describes the past few months. Nothing more.'};}},
 {id:'h4',t:'RSI, honestly',p:'MCQ',g:()=>({q:'RSI is 78. What does that actually tell you?',
   opts:['Recent gains have been larger than recent losses','The stock is overbought and about to fall back',
     'The stock has become expensive relative to its worth','There are more buyers than sellers in the market'],
   a:'Recent gains have been larger than recent losses',
   explain:'RSI compares the size of recent gains to recent losses over fourteen sessions, scaled 0–100. It is about how big the moves were, not how many days went each way. Above 70 is conventionally "overbought", but strong stocks stay above 70 for months. It measures what has already happened. Nothing is ever due.'})},
 {id:'h5',t:'Overbought does not mean sell',p:'PREDICT',g:()=>{const c=shuffle(LQ().filter(s=>(s.rsi||0)>68));const s=c[0]||one();
   return{q:`${nm(s)} has an RSI of ${fmt(s.rsi,0)} — "overbought" by the textbook. What is the honest expectation for the next month?`,
   opts:['Unknown; overbought readings persist as often as they reverse','A fall is likely','A further rise is likely'],
   a:'Unknown; overbought readings persist as often as they reverse',
   reveal:()=>`<div class="lw"><canvas></canvas></div>`,chart:{sym:s.sym,range:250},
   explain:'The word "overbought" carries a prediction it cannot support. In a strong trend RSI stays high precisely because the trend is strong. Treat it as a description of intensity.'};}},
 {id:'h6',t:'Lag has a cost',p:'SLIDER',g:()=>({q:'Move the slider to see the trade-off in choosing an average length.',
   label:'Moving average length',min:5,max:200,step:5,start:20,fmtv:v=>v+' days',
   live:v=>`A ${v}-day average lags a turn by roughly <b>${Math.round(v/2)} sessions</b>. ${v<15?'<span class="dn">It will also flip on every wobble.</span>':v>120?'<span class="dn">You will be very late to every real change.</span>':'A reasonable compromise.'}`,
   opts:['Shorter averages react sooner but produce more false signals','Shorter averages are more accurate','Longer averages predict better'],
   a:'Shorter averages react sooner but produce more false signals',
   explain:'There is no setting that removes the trade-off. Anyone selling you a "best" period has just chosen a point on this line and not told you.'})},
 {id:'h7',t:'Trend against the tape',p:'TWOCHART',g:()=>{const up=shuffle(LQ().filter(s=>s.s_trend>75))[0];
   const dn=shuffle(LQ().filter(s=>s.s_trend<20))[0];
   if(!up||!dn){const p=some(2);return{q:'Which of these is in the stronger uptrend?',a:{sym:p[0].sym},b:{sym:p[1].sym},range:180,explain:'read the slope across the whole window. The last few days are noise.'};}
   return{q:'One of these is above all three of its moving averages and one is below all three. Which is the one above?',
   a:{sym:up.sym},b:{sym:dn.sym},range:180,
   explain:'you can usually see it without the averages drawn. That is the point. The indicator formalises what the eye already reads.'};}},
 {id:'h8',t:'What momentum is worth',p:'SPOT',g:()=>({q:'Which claim about momentum goes beyond the evidence?',
   claims:[{t:'Momentum has been a durable factor in many world markets'},
     {t:'Momentum works reliably on NEPSE at the individual stock level',bad:1},
     {t:'Momentum strategies suffer sharp reversals at turning points'},
     {t:'Trading on momentum raises costs because you trade more often'}],
   explain:`We measured it. Across ${BT.months} month-ends of NEPSE history a composite leaning on trend and momentum had a mean rank correlation with the next month\u2019s returns of ${BT.mean_ic}, indistinguishable from zero. The sample is small, so this rules out a large effect rather than a small one. Momentum may work elsewhere. Here we have not shown that it does.`})},
 {id:'h9',t:'What a crossover really is',p:'MCQ',g:()=>({q:'The 20-day average crosses above the 50-day. What has definitely happened?',
   opts:['The last 20 days have been stronger than the previous stretch','A buy signal has fired and the stock should now be bought',
     'Institutions have started buying, which is what moved it','The downtrend has ended and an uptrend has begun'],
   a:'The last 20 days have been stronger than the previous stretch',
   explain:'A crossover is arithmetic about the recent past, restated. It fires after the move, always. Calling it a signal adds a claim the arithmetic does not make.'})}]}

);

/* ============ curriculum part 3: units 8-12 ============ */
UNITS.push(

{u:8,t:'Volume and the tape',d:'How much conviction is behind a price',L:[
 {id:'i1',t:'Volume is agreement, not direction',p:'MCQ',g:()=>({q:'A stock rises 4% on triple its normal volume. What does the volume add?',
   opts:['A lot of stock changed hands on this move','The move is more likely to continue',
     'Institutions were buying','The move is more likely to reverse'],
   a:'A lot of stock changed hands on this move',
   explain:'Every share bought was also sold. Volume measures participation and disagreement about price, never direction. The buyer and the seller both thought they were right.'})},
 {id:'i2',t:'Relative volume',p:'NUM',g:()=>{const s=shuffle(LQ().filter(x=>x.rvol>1.3))[0]||one();
   return{q:`${nm(s)} traded ${s.v.toLocaleString()} shares today against a normal day of about ${Math.round(s.v/s.rvol).toLocaleString()}. How many times its normal volume is that?`,
   a:s.rvol,tol:0.25,unit:'×',
   explain:'Raw volume cannot be compared between companies, a giant bank always trades more than a small hydro. Volume against its own normal can.'};}},
 {id:'i3',t:'Turnover, not shares',p:'RANK',g:()=>{const p=some(4);
   return{q:'Put these in order of daily turnover in rupees. Most traded first.',
   items:p.map(s=>({t:nm(s),v:s.turn20,lab:cr(s.turn20)})),
   explain:'Turnover in rupees is what decides whether you can get in and out. A stock trading 100,000 shares at Rs 20 is far less liquid than one trading 5,000 shares at Rs 2,000.'};}},
 {id:'i4',t:'Why thin stocks hurt',p:'SLIDER',g:()=>({q:'You want to buy Rs 5,00,000 of a company. Move the slider to change how much it trades in a day.',
   label:'Average daily turnover',min:1,max:60,step:1,start:5,fmtv:v=>v+' lakh',
   live:v=>{const d=500000/(v*100000);
     return `Your order is <b>${(d*100).toFixed(0)}%</b> of a typical day. ${d>0.5?'<span class="dn">You will move the price against yourself going in, and again coming out.</span>':d>0.2?'You will need to work the order over a few days.':'<span class="up">You can trade this without being noticed.</span>'}`;},
   opts:['Position size only matters relative to what a stock actually trades','Any stock can absorb five lakh','Illiquidity only matters when selling'],
   a:'Position size only matters relative to what a stock actually trades',
   explain:'The cost of illiquidity is invisible. It appears as a worse fill, never as a line on your contract note. It is largest exactly when you most want out.'})},
 {id:'i5',t:'The busiest day was about something',p:'CHART',g:()=>{const s=shuffle(LQ())[0];
   return{q:`Click the heaviest volume day for ${nm(s)} in the last six months.`,sym:s.sym,range:130,metric:'v',dir:'max',
   explain:'Now go and find out what happened that day — results, a dividend announcement, a policy change. Volume spikes are questions, and they usually have answers.'};}},
 {id:'i6',t:'Volume dries up in a bear market',p:'PREDICT',g:()=>({q:`This market is currently classified ${M.regime}. What usually happens to turnover in a prolonged decline?`,
   opts:['It falls, often sharply','It rises as people panic','It stays about the same'],
   a:'It falls, often sharply',
   reveal:()=>`<p class="reveal-n">Breadth today: <b>${fmt(D.breadth.a200[D.breadth.d.length-1],1)}%</b> of stocks above their 200-day average.</p>`,
   explain:'Panic produces one or two heavy days. What follows is months of thin, listless trading as people stop looking. That is when illiquidity bites hardest.'})},
 {id:'i7',t:'The spread you never see',p:'SPOT',g:()=>({q:'Which of these costs does not appear anywhere on your contract note?',
   claims:[{t:'The gap between the best buy and best sell price',bad:1},{t:'The broker commission charged on the trade'},{t:'The SEBON regulatory fee on the amount'},{t:'The DP charge for moving the shares'}],
   explain:'On a thin stock the spread can be several percent — larger than every itemised fee combined. It is paid at the moment you trade and never named.'})},
 {id:'i8',t:'Price without volume',p:'MCQ',g:()=>({q:'A stock hits a new yearly high on a fifth of its normal volume. What is the fair reading?',
   opts:['Very few people were involved in setting that price','It is a strong breakout that is likely to continue',
     'The stock is being quietly accumulated by someone big','The high is not real and the exchange will cancel it'],
   a:'Very few people were involved in setting that price',
   explain:'A price is only as informative as the number of people who agreed to it. On thin volume, a single order can set the closing price for the whole market to see.'})},
 {id:'i9',t:'Circuit limits',p:'MCQ',g:()=>({q:`A stock is at the ${FACT.circuit}% circuit limit and you cannot get filled. What is happening?`,
   opts:['Price cannot move further today, so orders queue unfilled','Trading in that stock has been suspended for the session',
     'The exchange has closed early and will reopen tomorrow','Your broker has blocked the order for risk reasons'],
   a:'Price cannot move further today, so orders queue unfilled',
   explain:`NEPSE caps individual stock moves at ${FACT.circuit}% a day. The queue at the limit is a measure of how much demand or supply is trapped, and it usually spills into the next session.`})}]},

{u:9,t:'Broker flow',d:'What the floorsheet shows, and what it cannot',L:[
 {id:'j1',t:'What the floorsheet is',p:'MCQ',g:()=>({q:'NEPSE publishes a floorsheet after each session. What is on it?',
   opts:['Every trade, with the buying and selling broker numbers','The holdings of every investor with a Demat account',
     'Only the large institutional trades of that session','A summary of the day’s volume, broken down by sector'],
   a:'Every trade, with the buying and selling broker numbers',
   explain:`Trade by trade, with broker codes but no client names. This app holds it from ${M.fs_from} — over ${(M.trades/1e6).toFixed(1)} million trades.`})},
 {id:'j2',t:'Net flow is always zero',p:'SPOT',g:()=>({q:'Which of these can the floorsheet not tell you?',
   claims:[{t:'Which broker bought the most of a stock this month'},
     {t:'Whether more money flowed into a stock than out of it',bad:1},
     {t:'How concentrated the buying was among a few brokers'},
     {t:'Whether one broker kept buying day after day'}],
   explain:'Every share bought was sold by someone. Summed across all brokers, net flow is exactly zero, always. Anyone showing you "net institutional inflow" for a NEPSE stock has computed something else and mislabelled it.'})},
 {id:'j3',t:'Concentration instead',p:'NUM',g:()=>{const s=shuffle(EQ.filter(x=>x.acc_c3>25&&x.top_acc&&x.top_acc.length))[0]||one();
   return{q:`Add up everything the net buyers of ${nm(s)} accumulated over the last 20 sessions. What share of that total did the top three take?`,
   a:s.acc_c3,tol:6,unit:'%',
   explain:'This is concentration among net buyers, not share of all buying. It is measurable where net flow is not. A high number means few desks did most of the accumulating, which may be one determined client or one broker with many. You cannot tell which.'};}},
 {id:'j4',t:'Persistence',p:'MCQ',g:()=>({q:'A broker bought a stock on 18 of the last 20 sessions. What does that suggest, and what does it not prove?',
   opts:['Someone is working a position; it does not say who or why',
     'Institutional accumulation in that stock is confirmed','The stock will rise once the buying programme finishes','The broker has information that is not public yet'],
   a:'Someone is working a position; it does not say who or why',
   explain:'Persistence is the most informative broker statistic because it is hard to fake. It still identifies a desk. A desk may be filling one order or a hundred.'})},
 {id:'j5',t:'The multiple comparisons trap',p:'SPOT',g:()=>({q:'You test all 90-odd brokers against 300 stocks to find which broker predicts moves best. What is wrong with the answer you get?',
   claims:[{t:'Testing tens of thousands of combinations guarantees some look predictive by chance',bad:0},
     {t:'The best-looking broker will almost certainly not repeat',bad:0},
     {t:'A p-value under 0.05 in this search means a real edge was found',bad:1},
     {t:'Any result needs to hold on data you did not search',bad:0}],
   explain:`With ${Object.keys(BRK).length} brokers and ${M.n_equity} equities that is about ${Math.round(Object.keys(BRK).length*M.n_equity/1000)} thousand hypotheses, of which roughly ${Math.round(Object.keys(BRK).length*M.n_equity*0.05/100)*100} will clear p < 0.05 with no edge at all. This is why the app reports broker concentration as description and refuses to rank brokers by predictive power.`})},
 {id:'j6',t:'Who was buying',p:'RANK',g:()=>{
   const cands=EQ.filter(x=>x.top_acc&&x.top_acc.length>=3&&new Set(x.top_acc.slice(0,3).map(b=>b[1])).size===3);
   const s=shuffle(cands)[0]||one();
   const t3=(s.top_acc||[]).slice(0,3);
   return{q:`For ${nm(s)}, put these brokers in order of how much they accumulated over the last 20 sessions.`,
   items:t3.map(b=>({t:bname(b[0]),v:b[1],lab:'Rs '+fmt(b[1],1)+'m'})),
   explain:'This is where to start looking, not where to stop. The same broker appears at the top of many stocks simply because it is large.'};}},
 {id:'j7',t:'Retail-dominated market',p:'MCQ',g:()=>({q:'NEPSE is overwhelmingly retail. What follows from that for broker-flow analysis?',
   opts:['A large broker mostly reflects many small clients, not one view',
     'Broker flow here is a clean signal of institutional intent','Brokers on NEPSE trade mainly on their own account','Flow data is useless and should be ignored entirely'],
   a:'A large broker mostly reflects many small clients, not one view',
   explain:'In markets with heavy institutional participation, broker flow can proxy for smart money. Here, the largest brokers are largest because they have the most retail accounts. The inference does not transfer.'})},
 {id:'j8',t:'Intensity',p:'NUM',g:()=>{const s=shuffle(EQ.filter(x=>x.intensity>15&&x.acc_m>1&&x.top_acc&&x.top_acc.length))[0]||one();
   const top=s.top_acc&&s.top_acc[0]?s.top_acc[0][1]:0;
   return{q:`Over the last 20 sessions, brokers who were net buyers of ${nm(s)} accumulated about Rs ${fmt(s.acc_m,0)} million between them, and the largest single one took Rs ${fmt(top,1)} million of that. What share is that, in percent?`,
   a:s.acc_m>0?top/s.acc_m*100:0,tol:6,unit:'%',hint:'One broker\u2019s share of the total accumulated.',
   explain:'One desk accounting for a large slice of the accumulation is unusual and worth a question. A broker acts for many clients, so it is not an answer.'};}},
 {id:'j9',t:'What you would need to prove it',p:'MCQ',g:()=>({q:'What would it take to show broker accumulation genuinely predicts returns on NEPSE?',
   opts:['A pre-registered rule tested on data held back from the search',
     'A chart of a stock where the rule clearly worked well','Several separate examples where the rule worked as expected','A high correlation measured across the full history'],
   a:'A pre-registered rule tested on data held back from the search',
   explain:'Choose the rule first, then test it once, on data you never looked at. Everything else is storytelling with numbers attached — including most of what circulates in trading groups.'})}]},

{u:10,t:'Comparing companies',d:'Ranking, percentiles, and the limits of what we hold',L:[
 {id:'k1',t:'What a percentile is',p:'MCQ',g:()=>({q:'A stock scores 90 on trading activity. What does that mean?',
   opts:['It is more liquid than about 90% of tradable companies','It trades on about 90% of the sessions in a year',
     'Its liquidity is 90 out of 100 on an absolute scale','90% of its shares changed hands during the period'],
   a:'It is more liquid than about 90% of tradable companies',
   explain:'Trading activity, beating the market, unusual volume and broker activity are ranks against the other companies today. In a market where everything is thin, a 90 is still thin, just less thin than the rest. The other three are absolute readings of the company itself, which the next lesson covers.'})},
 {id:'k2',t:'Ranks move; readings do not',p:'SPOT',g:()=>({q:'Three of these are ranks against other companies, so they can move without the company changing. Which one is an absolute reading of the company itself?',
   claims:[{t:'Trading activity'},{t:'Beating the market'},{t:'Near its highs',bad:1},{t:'Unusual volume'}],
   explain:'Near its highs is this company\u2019s own position in its own 12-month range: 0 at the low, 100 at the high. Price trend and momentum are absolute too. The other four are percentiles, and a percentile can move purely because everything around it moved. That is why a percentile is a poor thing to set an alert on.'})},
 {id:'k3',t:'Weights are preferences, not truths',p:'SLIDER',g:()=>({q:'Move the weight on trading activity and watch which company comes top.',
   label:'Weight on trading activity',min:0,max:10,step:1,start:5,
   live:v=>{const w={s_trend:6,s_rs:6,s_mom:5,s_struct:5,s_vol:4,s_broker:4,s_liq:v};
     let best=null,bs=-1;EQ.forEach(s=>{let n=0,d=0;for(const k in w){if(s[k]==null)continue;n+=s[k]*w[k];d+=w[k];}
       const sc=d?n/d:0;if(sc>bs){bs=sc;best=s;}});
     return best?`Top of the list: <b>${esc(nm(best))}</b> at ${cr(best.turn20)} a day, ${fmt(best.rangepos,0)}% up its yearly range.`:'—';},
   opts:['Changing what you value changes what you find','There is one correct set of weights','The weights barely matter'],
   a:'Changing what you value changes what you find',
   explain:'A screen is a statement of preference. Two honest people with different weights get different lists and neither is wrong. Treat any published "top stocks" list as somebody’s weights, undisclosed.'})},
 {id:'k4',t:'What this data does not include',p:'SPOT',g:()=>({q:'Which of these can this app not tell you about a company?',
   claims:[{t:'Whether the company earns a profit',bad:1},{t:'How far it is from its yearly high'},
     {t:'How much it trades on an average day'},{t:'How it has moved against the index'}],
   explain:'There is no fundamental data here, no earnings, no book value, no P/E, no debt. Every conclusion in this app is about price and volume. When someone calls a stock "cheap", ask cheap against what.'})},
 {id:'k5',t:'Same sector, different outcome',p:'TWOCHART',g:()=>{const sec=shuffle(['Commercial Banks','Hydro Power','Microfinance'])[0];
   const grp=LQ().filter(s=>s.sector===sec);
   const srt=grp.slice().sort((a,b)=>(b.r1y||0)-(a.r1y||0));
   const a=srt[0],b=srt[srt.length-1];
   if(!a||!b||a===b){const p=some(2);return{q:'Which of these did better over the last year?',a:{sym:p[0].r1y>=p[1].r1y?p[0].sym:p[1].sym},b:{sym:p[0].r1y>=p[1].r1y?p[1].sym:p[0].sym},range:250,explain:'sector explains a lot, but not everything.'};}
   return{q:`Both of these are ${sec}. One returned ${pct(a.r1y)} over the year and the other ${pct(b.r1y)}. Which is the winner?`,
   a:{sym:a.sym},b:{sym:b.sym},range:250,
   explain:`the gap between best and worst inside one sector was ${fmt(Math.abs((a.r1y||0)-(b.r1y||0)),0)} points. Sector matters, and it is nowhere near the whole story.`};}},
 {id:'k6',t:'Survivorship',p:'MCQ',g:()=>({q:'You look at a list of today’s listed companies and their ten-year returns. What is systematically missing?',
   opts:['Companies that delisted, merged or went stale along the way','Nothing at all, provided the prices have been adjusted',
     'Only the very smallest companies, which barely matter','Companies that moved from one sector to another'],
   a:'Companies that delisted, merged or went stale along the way',
   explain:`This app excludes stale securities from live lists — necessary for usable screens, and it does bias any backward-looking study upward. Every historical average you read anywhere has some version of this problem.`})},
 {id:'k7',t:'Comparing over the same window',p:'NUM',g:()=>{const p=some(2);
   return{q:`Over one year ${nm(p[0])} returned ${pct(p[0].r1y)} and ${nm(p[1])} returned ${pct(p[1].r1y)}. What is the gap, in percentage points?`,
   a:Math.abs((p[0].r1y||0)-(p[1].r1y||0)),tol:1.2,unit:'points',
   explain:'Percentage points, not percent. A move from 5% to 10% is five points and also a doubling — saying "up 5%" for that is one of the most common ways numbers get mangled.'};}},
 {id:'k8',t:'The stale trap',p:'MCQ',g:()=>({q:'A security did not trade at all in the most recent session. What is the price you see for it?',
   opts:['The last price anyone agreed to, however long ago','An estimate of its current fair value from NEPSE',
     'Zero, because no trade set a price that session','The average of the prices over the last month'],
   a:'The last price anyone agreed to, however long ago',
   explain:`${M.n_all-M.n_live} of the ${M.n_all} securities here did not trade on the last session. Their prices are leftovers from whenever they last changed hands, which for some is months ago. They are kept out of screens for that reason.`})},
 {id:'k9',t:'Equity is not everything listed',p:'CLASSIFY',g:()=>{const eq=shuffle(EQ).slice(0,2).map(s=>({t:nm(s),sub:s.sector,bucket:'Ordinary share'}));
   const mf=shuffle(S.filter(s=>s.instr!=='equity')).slice(0,2).map(s=>({t:nm(s),sub:s.sector,bucket:'Not an ordinary share'}));
   return{q:'Which of these are ordinary shares?',buckets:['Ordinary share','Not an ordinary share'],items:shuffle(eq.concat(mf)),
   explain:`Mutual fund units, debentures and preference shares all list and trade on NEPSE and behave nothing like ordinary shares. Of ${M.n_all} securities here, ${M.n_equity} are ordinary equity. Screens run on equities only.`};}}]},

{u:11,t:'Risk and what goes wrong',d:'Drawdowns, position size, and the mistakes that cost most',L:[
 {id:'l1',t:'Drawdown is the number that matters',p:'NUM',g:()=>{const s=shuffle(LQ())[0];const S1=SER[s.sym];
   const n=Math.min(500,S1.c.length);let pk=-1,mx=0;
   for(let i=S1.c.length-n;i<S1.c.length;i++){if(S1.c[i]>pk)pk=S1.c[i];const dd=(1-S1.c[i]/pk)*100;if(dd>mx)mx=dd;}
   return{q:`Over roughly the last two years, what was the largest peak-to-trough fall in ${nm(s)}, in percent?`,
   a:mx,tol:Math.max(4,mx*0.18),unit:'%',hint:'Measured from the highest close to the lowest close that followed it.',
   explain:`${fmt(mx,0)}%. The annual return tells you where it ended; the drawdown tells you what you had to sit through. People sell inside drawdowns, which is why this number decides real outcomes more often than the return does.`};}},
 {id:'l2',t:'Position size does the work',p:'SLIDER',g:()=>({q:'You put money into one company. Move the slider to see what a 40% fall in it costs you.',
   label:'Share of your portfolio in one stock',min:2,max:100,step:2,start:10,fmtv:v=>v+'%',
   live:v=>{const l=v*0.4;return `A 40% fall costs you <b class="dn">${l.toFixed(1)}%</b> of everything. Getting back to even then needs <b>${(100/(100-l)*100-100).toFixed(1)}%</b> on what you have left.`;},
   opts:['How much you hold decides the damage more than what you hold','A good company protects you from this','Diversification means owning many stocks in one sector'],
   a:'How much you hold decides the damage more than what you hold',
   explain:'You cannot control whether a stock falls 40%. You fully control whether that costs you 4% or 40%. Almost everyone spends their time on the first question.'})},
 {id:'l3',t:'Correlated is not diversified',p:'MCQ',g:()=>({q:'You own eight microfinance companies. How diversified are you?',
   opts:['Barely. They respond to the same rates, rules and sentiment','Well diversified — eight separate companies is plenty',
     'Fully, as long as they lend in different districts','It depends on how much you put into each of the eight'],
   a:'Barely. They respond to the same rates, rules and sentiment',
   explain:'Diversification is about what makes holdings move differently. Counting them tells you nothing. One policy change on microfinance spreads hits all eight the same day.'})},
 {id:'l4',t:'Recovering is harder than falling',p:'NUM',g:()=>({q:'Your portfolio falls 40%. What return do you need to get back to where you started?',
   a:66.7,tol:3,unit:'%',
   explain:'100 → 60 needs 66.7% to return to 100. This is why capital preservation is not timidity. It is arithmetic. Big losses compound against you twice.'})},
 {id:'l5',t:'What a stop actually does',p:'SPOT',g:()=>({q:`In a market with ${FACT.circuit}% circuit limits, which claim about stop-losses is wrong?`,
   claims:[{t:'A stop caps your loss at the level you set',bad:1},
     {t:'A gap down can fill you far below your stop'},{t:'A stop is an order that has to find a buyer'},
     {t:'In an illiquid stock a stop may not fill at all'}],
   explain:'A stop becomes a market order when triggered. If the stock opens at the lower circuit with no buyers, there is nothing to fill against. Stops manage discipline; they do not remove risk.'})},
 {id:'l6',t:'The market has fallen hard before',p:'PREDICT',g:()=>{const N=NEPSE;let pk=-1,mx=0,mi=0;
   for(let i=0;i<N.c.length;i++){if(N.c[i]>pk)pk=N.c[i];const dd=(1-N.c[i]/pk)*100;if(dd>mx){mx=dd;mi=i;}}
   const band=v=>v<25?'About 25%':v<45?'About 40%':v<65?'About 55%':'More than 70%';
   return{q:`The index history here runs from ${fdate(N.d[0])}. What is the largest peak-to-trough fall in it?`,
   opts:['About 25%','About 40%','About 55%','More than 70%'],a:band(mx),
   reveal:()=>`<p class="reveal-n">Trough on <b>${fdate(N.d[mi])}</b>, <b class="dn">${fmt(mx,1)}%</b> below the prior peak.</p>`,
   explain:`${fmt(mx,1)}%, bottoming on ${fdate(N.d[mi])}. Anyone who bought near that peak waited years to see their money again. A whole-market fall on this scale is not a tail event in Nepal, and any plan that only works if it never happens again is not a plan.`};}},
 {id:'l7',t:'Averaging down',p:'MCQ',g:()=>({q:'A stock you own is down 30%. You buy more to lower your average cost. What have you actually done?',
   opts:['Increased your exposure to a position that is losing','Reduced your risk, because your average cost is lower',
     'Guaranteed a faster recovery when the price turns','Locked in a better price than the one you first paid'],
   a:'Increased your exposure to a position that is losing',
   explain:'Averaging down is a position-sizing decision dressed up as a price decision. It can be right. It is right for reasons about the company, never because your average cost looks nicer.'})},
 {id:'l8',t:'The story after the fact',p:'SPOT',g:()=>({q:'Which of these is hindsight bias at work?',
   claims:[{t:'"The crash was obvious — look at the chart"',bad:1},
     {t:'"I did not know it would fall and I sized accordingly"'},
     {t:'"I was wrong about this company"'},{t:'"This fell more than I expected"'}],
   explain:'Every chart looks inevitable read backwards. The reason this app shows you charts without the right-hand side first, and asks you to commit, is that committing is the only way to find out what you actually knew.'})},
 {id:'l9',t:'Leverage in a circuit market',p:'MCQ',g:()=>({q:'You borrow against your shares to buy more. The market falls and you face a margin call while stocks sit at the lower circuit. What is the problem?',
   opts:['You must sell into a market where nothing is trading','Your loss is capped at the equity you put in yourself',
     'The circuit protects you by stopping the fall there','Your broker will wait until the market trades again'],
   a:'You must sell into a market where nothing is trading',
   explain:'Circuit limits do not stop losses; they delay the ability to exit. Leverage converts a fall you could have waited out into a fall you must act on, at the worst possible moment.'})},
 {id:'l11',t:'What it actually did',p:'NUM',g:()=>{
   const c=shuffle(EQ.filter(x=>{const r=riskOf(x);return r&&r.dd>25&&(x.turn20||0)>5e6;}));
   const s=c[0]||one(),r=riskOf(s)||{dd:30,ddFrom:0,ddTo:0,ddDays:0};
   return{q:`Over the history loaded here, what was the largest peak-to-trough fall in ${nm(s)}, in percent?`,
   a:r.dd,tol:Math.max(5,r.dd*0.2),unit:'%',hint:'Measured from the highest close to the lowest close that followed it.',
   explain:`${fmt(r.dd,0)}%, from ${fdate(r.ddFrom)} to ${fdate(r.ddTo)} — ${r.ddDays} days of it. ${r.recovered?`It took ${r.backDays} more days to get back to that level.`:'It has still not got back to that level.'} The company page shows this for every company, because the return alone never tells you what you had to sit through.`};}},
 {id:'l12',t:'Steady and violent',p:'RANK',g:()=>{
   const c=shuffle(EQ.filter(x=>{const r=riskOf(x);return r&&(x.turn20||0)>1e7;})).slice(0,4);
   if(c.length<4)return{q:'Not enough data today.',items:[{t:'—',v:1}],explain:''};
   return{q:'Put these in order by how much they swing in a year, widest first.',
   items:c.map(x=>({t:nm(x),v:riskOf(x).vol,lab:fmt(riskOf(x).vol,0)+'% a year'})),
   explain:`The NEPSE index itself swings about ${fmt(RISK.__MKT__?RISK.__MKT__.vol:17,0)}% a year. A company at double that is not twice as risky in some abstract sense: it is a company where a normal year covers twice the range, so the same position size hurts twice as much.`};}},
 {id:'l13',t:'Correlation, measured',p:'MCQ',g:()=>{
   /* banks move as a bloc and microfinance does not, so the answer genuinely varies */
   const s=shuffle(EQ.filter(x=>(x.turn20||0)>1e7&&['Commercial Banks','Microfinance','Hydro Power','Development Banks','Life Insurance'].includes(x.sector)))[0]||one();
   const m=movesWith(s.sym);
   const same=m?m.with.filter(x=>x.s.sector===s.sector).length:0;
   const top=m&&m.with[0]?m.with[0].c:null;
   return{q:`Take the five companies whose daily moves match ${nm(s)} most closely. How many of them are in the same sector, ${esc(s.sector)}?`,
   opts:['None of them','One or two','Three or four','All five'],
   a:same===0?'None of them':same<=2?'One or two':same<=4?'Three or four':'All five',
   explain:`${same} of five${top!=null?`, and the closest match sits at ${top.toFixed(2)}`:''}. This varies by sector and it is worth knowing which is which: commercial banks move almost as one, while microfinance names barely move together at all. Where the answer is four or five, holding several of them is one position, not several.`};}},
 {id:'l10',t:'Concentration you did not choose',p:'MCQ',g:()=>({q:'You hold six stocks. One has quadrupled and now makes up 55% of your portfolio. What is true?',
   opts:['You are now concentrated whether you decided to be or not','You are still diversified, across six separate names',
     'Winners should be left alone, so nothing needs doing','Your risk is unchanged, since you own the same six'],
   a:'You are now concentrated whether you decided to be or not',
   explain:'Portfolios drift towards their winners. Not rebalancing is itself a decision. It is just one you never consciously made.'})}]},

{u:12,t:'Evidence and honest thinking',d:'How to tell a finding from a story',L:[
 {id:'m1',t:'Correlation and what it is not',p:'MCQ',g:()=>({q:'Two stocks move together with a correlation of 0.8. What follows?',
   opts:['They have responded to common influences in this period','One of them has been causing the other one to move',
     'They will carry on moving together in the future too','They must belong to the same sector as each other'],
   a:'They have responded to common influences in this period',
   explain:'Correlation is a description of a window, computed after the fact. It says nothing about cause and it changes — often exactly when you were relying on it.'})},
 {id:'m2',t:'Sample size',p:'SPOT',g:()=>({q:'Three of these describe real evidence. Which one is not evidence at all?',
   claims:[{t:`Tested over ${BT.months} months of NEPSE data with the t-statistics reported`,bad:0},
     {t:'It worked on the last three stocks I happened to try',bad:1},
     {t:'Backtested with the code published so you can rerun it',bad:0},
     {t:'The result held on data that was not used to build the rule',bad:0}],
   explain:'Three examples is an anecdote. The reason this app publishes t-statistics and ships the backtest script is that you should not have to take our word for anything.'})},
 {id:'m3',t:'What a t-statistic says',p:'MCQ',g:()=>({q:`In our test, the best-scoring fifth of companies beat the worst-scoring fifth by ${BT.mean_q5_q1}% a month, with a t-statistic of ${BT.t_spread}. What does that mean?`,
   opts:['Inside what chance produces, so it shows nothing either way','The score works, though the monthly advantage it gives is small',
     'The score is reliable if you hold the companies long enough','The test must have been badly flawed to produce that'],
   a:'Inside what chance produces, so it shows nothing either way',
   explain:`A t-statistic near 2 is the usual threshold for taking a result seriously; ${BT.t_spread} is nowhere near. But note what this does and does not say. With ${BT.months} monthly observations this test could only have seen an edge of about ${BT.mdes}% a month or larger. Anything smaller is invisible to it. Failing to find something is not the same as showing it is absent.`})},
 {id:'m4',t:'The app’s own verdict',p:'NUM',g:()=>({q:`Across ${BT.months} month-ends, in what percentage of them did our score correlate positively with the next month's returns?`,
   a:BT.pct_positive,tol:7,unit:'%',hint:'A coin flip would give you about half.',
   explain:`${BT.pct_positive}%, which is a coin flip. We built the score, tested it, found no signal, and left both the score and the result in the product. The test is small, so it rules out only a large edge. What it does rule out is treating the number as a forecast.`})},
 {id:'m5',t:'Overfitting',p:'MCQ',g:()=>({q:'A rule is tuned until it would have returned 400% over the last five years. What should you expect going forward?',
   opts:['Much less, and possibly nothing','Similar returns','Better, as it improves','It depends on the market'],
   a:'Much less, and possibly nothing',
   explain:'Given enough parameters you can fit any history perfectly. The test that matters is performance on data the rule never saw. Almost no published strategy shows you that.'})},
 {id:'m6',t:'Confirmation',p:'SPOT',g:()=>({q:'You believe a stock will rise. Three of these fight confirmation bias. Which one feeds it?',
   claims:[{t:'Write down in advance what would prove you wrong',bad:0},
     {t:'Read what the sellers think',bad:0},{t:'Size the position so being wrong is survivable',bad:0},
     {t:'Find more people who agree with you',bad:1}],
   explain:'The cheapest protection is writing your thesis down before you buy, including the part that would end it. Memory rewrites itself otherwise, every time.'})},
 {id:'m7',t:'Where the numbers here come from',p:'PAIRS',g:()=>({q:'Match each thing this app shows you to where it comes from.',
   pairs:[['Adjusted daily prices',`Bonus, rights and dividend-adjusted daily bars, loaded from ${M.win_from||'2020'}`],
     ['Broker concentration',`Floorsheet trade records from ${M.fs_from}`],
     ['Index and breadth','NEPSE index history with a daily count of stocks above their averages'],
     ['Factor scores','Percentile ranks computed across tradable equities each day']],
   explain:'Nothing here is a live feed and nothing is fundamental data. Knowing what a number is made of is the difference between using it and being used by it.'})},
 {id:'m8',t:'Base rates',p:'MCQ',g:()=>({q:'Someone shows you five winning trades as evidence of a method. What is the first thing to ask?',
   opts:['How many trades in total, and what did the losers do','Which companies were they, and in which sectors',
     'What the average gain per winning trade came to','Over what period the five trades were made'],
   a:'How many trades in total, and what did the losers do',
   explain:'Five winners out of five is interesting. Five out of forty is worse than random. The denominator is the part that gets left out, and it is the part that decides.'})},
 {id:'m9',t:'What this app is for',p:'SPOT',g:()=>({q:'After everything in this course, which use of this app is unsupported by its own evidence?',
   claims:[{t:'Narrowing 300 companies to 15 worth a closer look',bad:0},
     {t:'Checking whether a fall was real or a corporate action',bad:0},
     {t:'Deciding what to buy because the score is high',bad:1},
     {t:'Seeing how a company has moved against the index',bad:0}],
   explain:'Sorting, filtering, checking, comparing — all supported. Predicting, not supported, by our own measurement. Holding both thoughts at once is the whole skill.'})},
 {id:'m10',t:'The last question',p:'MCQ',g:()=>({q:'What is the single most useful habit this course has tried to build?',
   opts:['Asking what a number is made of before believing it','Finding the single indicator that works best here',
     'Trading more often, so the edge has room to show','Following investors who have been doing this longer'],
   a:'Asking what a number is made of before believing it',
   explain:'Every unit here has been the same question in a different costume. Adjusted or raw? Over what window? Against what benchmark? Out of how many? Nobody can answer these for you, and almost nobody will volunteer them.'})}]}

/*==== L_beg.js ====*/
/* ============ the beginner route: NEPSE from zero ============
   The other course assumes you have bought something before. This one does
   not. It follows the order a Nepali actually meets the market in: savings,
   then a company, then the exchange, then the accounts, then an IPO — because
   that is how nearly everyone here starts — and only then the secondary market. */
const BUNITS=[

{u:0,t:'Money before markets',d:'What investing is, and what it is not',L:[
 {id:'n1',t:'Saving and investing are different jobs',p:'PAIRS',g:()=>({q:'Match each place for money to the job it does well.',
   pairs:[['A bank savings account','Money you might need this month, kept safe and boring'],
     ['A fixed deposit','A known return over a known term, with a penalty for breaking it early'],
     ['Shares','A share of a business, worth whatever someone will pay for it that day'],
     ['An emergency fund','Three to six months of expenses that never goes near the market']],
   explain:'Each does one job well and the others badly. Most damage happens when money doing one job gets put somewhere doing another.'})},
 {id:'n2',t:'Why anyone bothers',p:'SLIDER',g:()=>({q:'Money sitting still loses value. Move the slider to see how much.',
   label:'Years',min:1,max:25,step:1,start:10,fmtv:v=>v+' years',
   live:v=>{const r=Math.pow(1/1.055,v);
     return `At around 5.5% inflation, Rs 1,00,000 kept under a mattress buys what <b>Rs ${fmt(100000*r,0)}</b> buys today. You did not lose any rupees. You lost <b class="dn">${((1-r)*100).toFixed(0)}%</b> of what they were for.`;},
   opts:['Doing nothing with money is also a decision with a cost','Cash is safe because the number does not change','Only investments can lose value'],
   a:'Doing nothing with money is also a decision with a cost',
   explain:'This is the case for investing, and it is the whole case. It is not a reason to buy shares in particular, and it is not a reason to hurry.'})},
 {id:'n3',t:'The money that must not go in',p:'MCQ',g:()=>({q:'Which of these should never be in the share market?',
   opts:['Money you will need for something specific within a year','Money you inherited and have no immediate plans for','Money you saved this year on top of an emergency fund','Money you would rather grow than leave in a savings account'],
   a:'Money you will need for something specific within a year',
   explain:'The market does not know when your school fees are due. Money with a date attached belongs somewhere with a date attached.'})},
 {id:'n4',t:'Borrowing to invest',p:'SPOT',g:()=>({q:'Three of these are true about buying shares with borrowed money. Which is not?',
   claims:[{t:'The loan has to be repaid whether the shares rise or fall'},
     {t:'A fall can force you to sell at the worst possible moment'},
     {t:'If you are confident enough, borrowing multiplies a good decision',bad:1},
     {t:'Interest is charged whether or not the shares pay a dividend'}],
   explain:'Borrowing multiplies the outcome, not the decision. It converts a fall you could have waited out into one you must act on, and it is the most common way people in Nepal turn a bad year into a permanent loss.'})},
 {id:'n5',t:'What a return is',p:'NUM',g:()=>({q:'You buy something for Rs 400 and sell it for Rs 460. What is your return, in percent?',
   a:15,tol:0.6,unit:'%',hint:'The gain, divided by what you paid.',
   explain:'Rs 60 gained on Rs 400 spent is 15%. Always divide by what you paid. Dividing by what it is worth now is the most common arithmetic mistake in this whole subject.'})},
 {id:'n6',t:'Nobody can tell you what happens next',p:'MCQ',g:()=>({q:'Someone in a Viber group says a share will definitely double this month. What do they actually know?',
   opts:['Nothing you do not','That the company is good','That demand is coming','That the price is low'],
   a:'Nothing you do not',
   explain:'If anyone could reliably say that, they would not be telling you for free. This applies to tips, to television, and to every number in this app.'})}]},

{u:1,t:'What a company is',d:'Why a business sells pieces of itself',L:[
 {id:'o1',t:'Why a company sells shares',p:'MCQ',g:()=>({q:'A hydropower company needs Rs 2 arba to build a plant. Why might it sell shares instead of borrowing all of it?',
   opts:['Shares do not have to be repaid on a schedule','Shares are cheaper than a loan',
     'The regulator requires it','Shareholders cannot ask for anything back'],
   a:'Shares do not have to be repaid on a schedule',
   explain:'A loan has a date and an interest bill. A share sells a slice of the future instead. That is the whole trade: the company gets money it never has to repay, and gives up part of what it earns forever.'})},
 {id:'o2',t:'What you own',p:'CLASSIFY',g:()=>({q:'As an ordinary shareholder, which of these do you get?',
   buckets:['Yes','No'],
   items:[{t:'A vote at the annual general meeting',bucket:'Yes'},
     {t:'A share of any dividend the company declares',bucket:'Yes'},
     {t:'A guaranteed return',bucket:'No'},
     {t:'The right to walk in and take equipment',bucket:'No'},
     {t:'A claim on what is left if the company is wound up, after everyone else',bucket:'Yes'}],
   explain:'You own a slice of the business and its profits. You do not own its things, and nothing is promised. Being last in the queue if it fails is exactly why shares pay more than a deposit when they work.'})},
 {id:'o3',t:'Promoter and public',p:'PAIRS',g:()=>({q:'Nepali companies split their shares into groups. Match each one.',
   pairs:[['Promoter shares','Held by founders and the institutions that started it, with limits on selling'],
     ['Public shares','What was sold to ordinary people and trades freely'],
     ['Face value','The Rs 100 accounting figure printed on the share'],
     ['Market price','What someone will pay for it today']],
   explain:'When you buy on NEPSE you are almost always buying public shares from another ordinary holder. The company gets nothing from that trade — it already sold its shares, once, at the IPO.'})},
 {id:'o4',t:'The price is not the size',p:'MCQ',g:()=>({q:'Company A trades at Rs 2,000 and Company B at Rs 200. Which is bigger?',
   opts:['You cannot tell without knowing how many shares exist','A, because a higher price means a more valuable firm','B, because more of its shares can change hands daily','They are similar, since both are listed on NEPSE'],
   a:'You cannot tell without knowing how many shares exist',
   explain:'Cut a cake into 10 slices or 1,000 and it is the same cake. Size is price multiplied by the number of shares, and that number varies enormously between Nepali companies.'})},
 {id:'o5',t:'What sectors are on NEPSE',p:'CLASSIFY',g:()=>{
   const pick=n=>shuffle(EQ.filter(s=>s.sector===n))[0];
   const want=['Commercial Banks','Hydro Power','Microfinance','Life Insurance'];

   buckets:want,items:shuffle(items),
   explain:`Of the ${M.n_equity} tradable companies here, the great majority are banks, microfinance, insurance or hydropower. There is very little manufacturing and almost no technology. That shapes everything: when interest rates move, most of this market moves together.`};}},
 {id:'o6',t:'A share is not a lottery ticket',p:'SPOT',g:()=>({q:'Which of these is the wrong reason to buy a share?',
   claims:[{t:'You think the business will earn more over time'},

{u:2,t:'What NEPSE is',d:'The exchange, and who is responsible for what',L:[
 {id:'p1',t:'Why an exchange exists',p:'MCQ',g:()=>({q:'What problem does a stock exchange actually solve?',
   opts:['Finding someone willing to take the other side, at a known price',
     'Deciding what each listed company is genuinely worth today','Making sure ordinary investors do not lose their money','Setting a fair opening price for every company each day'],
   a:'Finding someone willing to take the other side, at a known price',
   explain:'Without an exchange you would have to find a buyer yourself and argue about the price. NEPSE is a place where that happens continuously, in public. It does not decide value and it promises nobody a profit.'})},
 {id:'p2',t:'Who does what',p:'PAIRS',g:()=>({q:'Four organisations, four different jobs. Match them.',
   pairs:[['SEBON','The regulator: approves public issues and makes the rules'],

     ['CDSC','The depository: holds shares electronically and runs Mero Share'],
     ['Your broker','The licensed firm that places your orders on the exchange']],
   explain:'People say "NEPSE" for the whole market, but these are four separate bodies with four separate jobs. When something goes wrong, knowing which one to go to saves weeks.'})},
 {id:'p3',t:'When the market is open',p:'MCQ',g:()=>({q:`When is NEPSE open for continuous trading?`,
   opts:[`${FACT.week}, ${FACT.hours}`,'Sunday to Thursday, 11:00 to 15:00','Every day, 10:00 to 16:00','Monday to Friday, 10:00 to 17:00'],
   a:`${FACT.week}, ${FACT.hours}`,
   explain:`${FACT.week}, ${FACT.hours}, with a pre-open session from ${FACT.pre}. The week changed from Sunday–Thursday in April 2026, so a great many guides still online have this wrong.`})},
 {id:'p4',t:'The index is not the market',p:'MCQ',g:()=>({q:'The NEPSE index rose 1% today. What does that tell you about your own shares?',

   a:'Very little on its own',
   explain:'The index is weighted by size, so a few large banks move it most. It can rise on a day when most companies fell. Your company is its own question.'})},

   explain:`Rs ${fmt(400*(1+FACT.circuit/100),0)}. NEPSE caps how far one share can move in a day. The cap was ±${FACT.circuitWas}% until ${FACT.circuitFrom}. When a share is stuck at the limit, it can still trade at that price, but the orders queue up and the pressure usually carries into the next session.`})},
 {id:'p6',t:'A price needs two people',p:'SPOT',g:()=>({q:'A share is quoted at Rs 500. Which of these does that guarantee?',

 {id:'r6',t:'An IPO is not free money',p:'SPOT',g:()=>({q:'Which of these is the least safe assumption about a Nepali IPO?',

/*==== L_fund.js ====*/
/* ============ the company behind the share ============
   Every other unit in this app reads prices. This one reads what the companies
   reported, which is the only part of a share that is not a matter of opinion —
   and, as the lessons here keep showing, is still not a settled number. */

/* liquid companies that actually have a filing behind them */
const FQ=()=>LQ().filter(s=>{const f=fu(s);return f&&f.eps!=null;});
const FQP=()=>FQ().filter(s=>fu(s).eps>0&&F_PE(s));
/* A lesson that states two numbers and asks the reader to divide them must use
   a company where the division actually comes out. For the 65 companies whose
   headline EPS is the aggregator's full year while the filed profit is only
   nine months, it does not — the reader would do the arithmetic correctly and
   be marked wrong. */
const FQD=()=>FQP().filter(s=>{const f=fu(s);
  /* and big enough that rounding the stated figures to one and two decimals
     still divides out inside the tolerance the lesson accepts */
  return !f.split&&f.net_profit_000>1e5&&f.shares_outstanding>1e6;});
const FQB=()=>FQ().filter(s=>fu(s).npl!=null);
const pick1=a=>a[Math.floor(Math.random()*a.length)];
/* RANK refuses tied values, and two companies on the same P/E to one decimal
   is common enough to fail a test run at random if we do not check */
const spread=(a,n,g)=>{const o=shuffle(a).filter(x=>g(x)!=null);const out=[];
  for(const s of o){if(out.every(t=>Math.abs(g(t)-g(s))>0.05*Math.max(1,Math.abs(g(s)))))out.push(s);if(out.length===n)break;}
  return out.length===n?out:shuffle(a).slice(0,n);};
